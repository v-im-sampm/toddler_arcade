<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Little Arcade v2 – reference sketch (Robo Buddy)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html (Color Pop) and hatch_a_pet.html.
  Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs, ellipses,
  bezier/quadratic curves, linear/radial gradients, globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene.
  Audio nodes: sine oscillators (kalimba = sine + one inharmonic partial; FM blip = one sine modulating
  one sine), linear-attack/exponential-decay gains, exponential pitch glides, white noise rendered once
  at 16 kHz through one biquad (shaker ticks, workshop hiss), one sine LFO (workshop hum), an original
  looping workshop tune (G major pentatonic, 100 bpm) plus a dance groove on its own small voice pool
  that ducks under the cues, one compressor.
  All art is procedural and original; no external resources, no network, no storage, no mic.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap. URL ?seed=N.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1E2245; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #note { position: fixed; left: 8px; bottom: 6px; color: #9DB8FA; font: 12px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Robo Buddy reference sketch"></canvas></div>
<div id="note">v2 reference sketch · Robo Buddy · 320×240 logical stage · D debug · R reduced motion · P particle cap</div>
<script>
'use strict';
// ---------- tokens (same subset as quality_bar.html) ----------
const W = 320, H = 240;
const TOK = {
  ink: '#3B3550', inkSoft: '#6F6888', paper: '#FFF8EC', cream: '#FFF3D6', hintGlow: '#FFE066', night: '#1E2245',
  wallTop: '#FFE0A7', wallBot: '#FFB36A', floorTop: '#DDB892', floorBot: '#B07A4F',     // scene_art workshop()
  squashPress: [1.12, 0.88], wiggleDeg: 6, wiggleMs: 360, glowPeriod: 0.9,
  idleVisualHint: 6, idleWave: 8, idleDoze: 20, maxInputBlock: 0.3, moodHold: 4, wakeGuard: 0.8,
  springBouncy: { k: 380, c: 14 }, breathScale: 0.025, bob: 2, tapDebounce: 0.08,
  deviceMaxParticles: 48, webMaxParticles: 400,        // game doc §9 budget (48) under the shared device cap (96)
};
// tokens.json hues as [shadow, base, light]; outlines always use the shadow of their fill.
const HUE = {
  teal: ['#127A7D', '#21B3B0', '#8FE3DE'], yellow: ['#C99A0E', '#FFD23F', '#FFEB9C'],
  orange: ['#C2621B', '#FF8A2A', '#FFC07F'], brown: ['#7A4E2D', '#B07A4F', '#DDB892'],
  cream: ['#D9C7A3', '#FFF3D6', '#FFFBEF'], pink: ['#B23E86', '#F06BB8', '#FBB6DC'],
  green: ['#1E8452', '#2DB26E', '#8EE0B4'], red: ['#B8323A', '#EF4B4F', '#FF9A92'],
  sky: ['#2B79B8', '#4FB0F0', '#A9DBFB'], purple: ['#6236A6', '#8F5BE0', '#C9AEF5'], blue: ['#2448A8', '#3A6FE8', '#9DB8FA'],
};
// Moods: antenna bulb, LED tint and badge colour. Every mood also has its own face, pose, badge icon and
// motif, so colour is never the only cue.
const MOOD_HUE = { CALM: 'teal', HAPPY: 'yellow', SILLY: 'pink', YUMMY: 'green', SLEEPY: 'purple', HELLO: 'orange' };
const TARGET_MOOD = { head: 'HAPPY', belly: 'SILLY', food: 'YUMMY', moon: 'SLEEPY', hello: 'HELLO' };
// Stage geometry (logical px). Bolt's local origin is the floor point between his wheels.
const BOLT = { x: 160, y: 226, eyeY: 100 };
const HIT = {
  bolt: [96, 56, 128, 176], head: [104, 60, 112, 72], belly: [108, 136, 104, 72],
  food: [8, 92, 72, 68], moon: [8, 168, 72, 64], hello: [240, 96, 72, 72],   // food/moon keep an 8 px gap
};
const TARGET_PT = { head: [160, 100], belly: [160, 172], food: [44, 122], moon: [44, 200], hello: [276, 128] };
const CYCLE = ['head', 'belly', 'food', 'hello', 'moon'];          // autoTarget order (test hook)
const GLANCE = ['food', 'hello', 'moon'];                          // props Bolt glances at as a hint
const BTN = { no: [128, 172], yes: [192, 172], r: 24, hit: 28 };    // "want to dance?" chest buttons (48 px, 8 px apart)
const SPB = 60 / 100;                                              // seconds per beat (100 bpm)
const MOUTH = [160, 116];                                          // where snacks go (scene px)

// LED face: 13 x 7 dot matrix on Bolt's screen. 'e' = eye dot (follows the last touch, blinks),
// 'o' = lit dot, 'p' = pink dot (cheeks, tongue). Faces are swapped at runtime (doc §4: 8 faces + variants).
const LED = { cols: 13, rows: 7, dx: 6.4, dy: 6, x0: -38.4, y0: -144, r: 2.3 };
const FACE_SRC = {
  calm:   ['.............', '..ee.....ee..', '..ee.....ee..', '..ee.....ee..', '.............', '.p..o...o..p.', '.....ooo.....'],
  smile:  ['.............', '..ee.....ee..', '..ee.....ee..', '..ee.....ee..', '.............', '.p.o.....o.p.', '....ooooo....'],
  happy:  ['.............', '..oo.....oo..', '.o..o...o..o.', '.............', '...o.....o...', '.p..ooooo..p.', '.....ooo.....'],
  silly:  ['.............', '.o.........o.', '..oo.....oo..', '.o.........o.', '...o.....o...', '.p..ooooo..p.', '......pp.....'],
  yummy:  ['.............', '..oo.....oo..', '.o..o...o..o.', '.............', '.....ooo.....', '.p..o...o..p.', '.....ooo.....'],
  chew:   ['.............', '..oo.....oo..', '.o..o...o..o.', '.............', '.............', '.p..ooooo..p.', '.............'],
  sleepy: ['.............', '.............', '.o..o...o..o.', '..oo.....oo..', '.............', '.p.........p.', '.....ooo.....'],
  yawn:   ['.............', '.............', '.............', '.oooo...oooo.', '.....ooo.....', '.p..o...o..p.', '.....ooo.....'],
  hello:  ['.............', '..ee.....oo..', '..ee....o..o.', '..ee.........', '.............', '.p.o.....o.p.', '....ooooo....'],
  dance:  ['.............', '...o.....o...', '..ooo...ooo..', '...o.....o...', '.............', '.p.o.....o.p.', '....ooooo....'],
  sing:   ['.............', '...o.....o...', '..ooo...ooo..', '...o.....o...', '.....ooo.....', '.p..o...o..p.', '.....ooo.....'],
};
const FACES = {};
for (const k in FACE_SRC) {
  const f = { lit: [], eye: [], pink: [], on: new Set() };
  FACE_SRC[k].forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === 'o') f.lit.push([c, r]); else if (ch === 'e') f.eye.push([c, r]); else if (ch === 'p') f.pink.push([c, r]);
  }));
  FACES[k] = f;
}

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];
const crossed = (k, dt, at) => k >= at && k - dt < at;              // a timeline mark passed this frame

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- audio (Web Audio, G major pentatonic, conservative gain) ----------
let ac = null, master = null, voices = [], noiseBuf = null;
const PENT = [0, 2, 4, 7, 9];
function degFreq(deg, oct = 0) {                                   // degree 0 = G4
  const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5;
  return 392.0 * Math.pow(2, (PENT[i] + 12 * (o + oct)) / 12);
}
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
  const nr = mulberry32(99);                                // 1 s of white noise, rendered once at 16 kHz
  noiseBuf = ac.createBuffer(1, 16000, 16000);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = nr() * 2 - 1;
}
function voiceOk(when, len) {                                  // 8 cue voices, counted where they overlap in time
  const now = ac.currentTime, t = now + when; voices = voices.filter(v => v[1] > now);
  if (voices.filter(v => v[0] < t + len && v[1] > t).length >= 8) return false;   // voice limit
  voices.push([t, t + len]); duckMusic(now, when + len); return true;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
// Kalimba pluck: sine tine + one inharmonic overtone (x5.4) that dies in 60 ms; overtone dropped above 7.8 kHz.
function kalimba(freq, when = 0, vel = 1, dur = 0.5) {
  if (!ac || !voiceOk(when, dur)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.42 * vel, 0.003, dur);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  o1.connect(g); g.connect(master); o1.start(t); o1.stop(t + dur + 0.05);
  if (freq * 5.4 < 7800) {
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 5.4;
    const g2 = ac.createGain(); env(g2, t, 0.14 * vel, 0.002, 0.06);
    o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + 0.1);
  }
}
// FM blip (Bolt's voice): one sine modulating one sine. The index decays so each blip starts bright and
// ends pure; ratio <= 2 and index <= 1.5 keep the strong sidebands under 7.8 kHz for notes up to B5.
// f1 = optional exponential glide target (boing / question / boop).
function fmBlip(freq, when = 0, vel = 1, dur = 0.12, ratio = 1, index = 1.2, f1 = 0) {
  if (!ac || !voiceOk(when, dur)) return;
  const t = ac.currentTime + when;
  const car = ac.createOscillator(); car.type = 'sine'; car.frequency.setValueAtTime(freq, t);
  const mod = ac.createOscillator(); mod.type = 'sine'; mod.frequency.setValueAtTime(freq * ratio, t);
  if (f1) {
    car.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
    mod.frequency.exponentialRampToValueAtTime(f1 * ratio, t + dur * 0.6);
  }
  const mg = ac.createGain(); mg.gain.setValueAtTime(freq * ratio * index, t);
  mg.gain.exponentialRampToValueAtTime(freq * ratio * index * 0.12, t + dur);
  mod.connect(mg); mg.connect(car.frequency);
  const g = ac.createGain(); env(g, t, 0.26 * vel, 0.004, dur);
  car.connect(g); g.connect(master);
  car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
}
// Pitched sine with an exponential glide (yawn, whirr, snore, cookie pop).
function glide(f0, f1, glideS, when, peak, dur, attack = 0.003) {
  if (!ac || !voiceOk(when, dur)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, attack, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.04);
}
// Shaker tick / hiss: the shared noise buffer through one bandpass biquad (offset from the clock, no RNG).
function noiseHit(dest, t, peak, dur, freq) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
  const g = ac.createGain(); env(g, t, peak, 0.002, dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, (t * 7.31) % 0.9); s.stop(t + dur + 0.02);
}
// ---------- workshop tune (original; G major pentatonic, 4/4 at 100 bpm, 8 bars = 19.2 s loop) ----------
// melody: [beat, degree, beats] on the kalimba; bass: one degree per bar at octave -1 on beats 1 and 3;
// blips: Bolt's soft FM "bip" answering the melody every other bar. While Bolt sleeps only the melody plays, softer.
const TUNE = { beats: 32, voices: 6,
  melody: [[0, 2, 1], [1, 3, 1], [2, 4, 1.5], [3.5, 3, 0.5], [4, 2, 2], [6, 0, 1], [7, 1, 1],
           [8, 1, 1], [9, 2, 0.5], [9.5, 1, 0.5], [10, -1, 2], [12, -2, 1], [13, -1, 1], [14, 1, 2],
           [16, 2, 1], [17, 3, 1], [18, 5, 1.5], [19.5, 4, 0.5], [20, 3, 2], [22, 2, 1], [23, 4, 1],
           [24, 3, 1], [25, 1, 1], [26, 2, 1], [27, 1, 1], [28, 0, 3]],
  bass: [0, -1, 1, -2, 0, -1, -2, 0],
  blips: [[7.5, 5], [15.5, 3], [23.5, 6], [31.5, 5]] };
// Events in time order: [beat, kind, freq, peak, dur]; kinds: k kalimba, b bass, f FM bip.
const SONG = [];
for (const [b, d, n] of TUNE.melody) SONG.push([b, 'k', degFreq(d), 0.075, Math.min(n * SPB, 0.6) + 0.25]);
TUNE.bass.forEach((d, i) => { SONG.push([i * 4, 'b', degFreq(d, -1), 0.07, 1.0]); SONG.push([i * 4 + 2, 'b', degFreq(d, -1), 0.05, 0.8]); });
for (const [b, d] of TUNE.blips) SONG.push([b, 'f', degFreq(d), 0.035, 0.2]);
SONG.sort((a, b) => a[0] - b[0] || b[3] - a[3]);
let music = null, musicBus = null, duck = null, duckUntil = 0, musicVoices = [], hum = [];
function startMusic() {
  if (!ac) return;
  if (!musicBus) { musicBus = ac.createGain(); duck = ac.createGain(); musicBus.connect(duck); duck.connect(master); }
  const now = ac.currentTime;
  musicBus.gain.cancelScheduledValues(now); musicBus.gain.setValueAtTime(0, now);
  musicBus.gain.setTargetAtTime(1, now + 0.5, 1.5);                // gentle fade-in, never a loud start
  music = { t0: now + 0.5, i: 0, loop: 0, g: null }; musicVoices = [];
  startHum(now);
}
function stopMusic() {
  if (!music) return;
  musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(0, ac.currentTime, 0.15);
  for (const s of hum) s.stop(ac.currentTime + 0.6);
  hum = []; music = null;
}
// Workshop hum under the tune, outside both voice pools: G2 + G3 sines and lowpassed noise,
// breathing with one slow sine LFO on its gain. Very quiet: felt more than heard.
function startHum(now) {
  const g = ac.createGain(); g.gain.value = 0.022; g.connect(musicBus);
  const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.25;
  const lg = ac.createGain(); lg.gain.value = 0.006; lfo.connect(lg); lg.connect(g.gain);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = 98; o1.connect(g);
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = 196;
  const g2 = ac.createGain(); g2.gain.value = 0.6; o2.connect(g2); g2.connect(g);
  const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400; f.Q.value = 0.7;
  const g3 = ac.createGain(); g3.gain.value = 0.25; n.connect(f); f.connect(g3); g3.connect(g);
  hum = [lfo, o1, o2, n];
  for (const s of hum) s.start(now);
}
function musicVoiceOk(t, len) {                                    // own pool: never takes cue voices
  musicVoices = musicVoices.filter(e => e > t);
  if (musicVoices.length >= TUNE.voices) return false;
  musicVoices.push(t + len); return true;
}
// kinds: k kalimba, b bass (sine + soft 2nd harmonic), f FM bip, w woodblock, s shaker tick (noise), z snore.
function musicNote(t, kind, freq, peak, dur) {
  if (!musicVoiceOk(t, dur)) return;
  if (kind === 's') { noiseHit(musicBus, t, peak, dur, freq); return; }
  const g = ac.createGain(); g.connect(musicBus);
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(freq, t); o.connect(g);
  const end = t + dur + 0.05; o.start(t); o.stop(end);
  if (kind === 'k') {
    env(g, t, peak, 0.003, dur);
    if (freq * 5.4 < 7800) {
      const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 5.4;
      const g2 = ac.createGain(); env(g2, t, peak * 0.33, 0.002, 0.06); o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + 0.1);
    }
  } else if (kind === 'b') {
    env(g, t, peak, 0.02, dur);
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
    const g2 = ac.createGain(); g2.gain.value = 0.5; o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(end);
  } else if (kind === 'f') {
    env(g, t, peak, 0.004, dur);
    const mo = ac.createOscillator(); mo.type = 'sine'; mo.frequency.value = freq;
    const mg = ac.createGain(); mg.gain.setValueAtTime(freq, t); mg.gain.exponentialRampToValueAtTime(freq * 0.1, t + dur);
    mo.connect(mg); mg.connect(o.frequency); mo.start(t); mo.stop(end);
  } else if (kind === 'w') {
    o.frequency.exponentialRampToValueAtTime(freq * 0.92, t + 0.05); env(g, t, peak, 0.002, dur);
  } else {                                                         // z: slow breath down a minor third
    o.frequency.exponentialRampToValueAtTime(freq * 0.84, t + dur * 0.8); env(g, t, peak, dur * 0.35, dur);
  }
}
function musicTick() {                                             // schedule notes 0.4 s ahead
  if (!music) return;
  const asleep = st.mood === 'SLEEPY';
  for (;;) {
    const e = SONG[music.i], t = music.t0 + (music.loop * TUNE.beats + e[0]) * SPB;
    if (t > ac.currentTime + 0.4) break;
    if (!asleep) musicNote(t, e[1], e[2], e[3], e[4]);
    else if (e[1] === 'k') musicNote(t, 'k', e[2], e[3] * 0.6, e[4]);  // asleep: the melody alone, softer
    if (++music.i >= SONG.length) { music.i = 0; music.loop++; }
  }
  if (music.g) grooveTick();
}
// Dance groove: 4 bars of eighths on the music pool, locked to the tune's beat grid. Shaker tick on every
// eighth (offbeats a touch louder), woodblock on beats 2 and 4, an FM bip on the "and" of 4.
function grooveTick() {
  const g = music.g;
  while (g.e < g.end) {
    const t = music.t0 + g.e * SPB / 2;
    if (t > ac.currentTime + 0.4) return;
    const i = g.e - g.e0, beat = (i >> 1) & 3, off = i & 1;
    if (t >= ac.currentTime - 0.02) {
      musicNote(t, 's', 5200, off ? 0.05 : 0.03, 0.045);
      if (!off && (beat & 1)) musicNote(t, 'w', degFreq(3), 0.1, 0.09);
      if (off && beat === 3) musicNote(t, 'f', degFreq([5, 6, 4, 5][(i >> 3) & 3]), 0.045, 0.18);
    }
    g.e++;
  }
  music.g = null;
}
function duckMusic(now, len) {                                     // music dips to 0.35 under cues
  if (!duck) return;
  duckUntil = Math.max(duckUntil, now + len);
  duck.gain.cancelScheduledValues(now);
  duck.gain.setTargetAtTime(0.35, now, 0.03); duck.gain.setTargetAtTime(1, duckUntil, 0.3);
}

// ---------- cues (scale-locked; taps <= 150 ms, reactions <= 600 ms, stings <= 2 s; no "wrong" sounds) ----------
const TAP_DEGS = [0, 2, 4, 3, 1];
function tapNote() { kalimba(degFreq(TAP_DEGS[st.taps % 5], 1), 0, 0.3, 0.15); st.taps++; }
// One motif per mood (Bolt's "words"): FM bleeps are his voice, the kalimba is the workshop's.
const MOTIF = {
  CALM() { kalimba(degFreq(0), 0, 0.4, 0.3); kalimba(degFreq(2), 0.12, 0.4, 0.3); },
  HAPPY() { [2, 3, 4, 5].forEach((d, i) => fmBlip(degFreq(d), i * 0.09, 0.8, i === 3 ? 0.3 : 0.1)); },        // rising bleeps
  SILLY() { [5, 3, 5, 3, 6].forEach((d, i) => fmBlip(degFreq(d) * 0.84, i * 0.075, 0.7, 0.09, 2, 0.9, degFreq(d))); }, // giggle
  YUMMY() {
    glide(degFreq(2), degFreq(4), 0.08, 0, 0.2, 0.12);                                   // cookie pops off the plate
    for (let i = 0; i < 3; i++) {                                                       // nom, nom, nom

  ctx.fillStyle = 'rgba(59,53,80,0.15)';                            // soft ink shadow
  ctx.beginPath(); ctx.ellipse(x, BOLT.y + 1, Math.max(30, 50 * (1 + q) - bolt.hop * 0.8), 6, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(x, BOLT.y - bolt.hop); ctx.rotate(bolt.ln.q); ctx.scale(1 + q, 1 - q);
  for (const s of [-1, 1]) {                                        // wheels: rolling hubs
    ctx.save(); ctx.translate(s * 30, -10); ctx.rotate(bolt.roll);
    ctx.fillStyle = '#5A5478'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill(); ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = HUE.cream[1]; ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = HUE.cream[0]; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-4.6, 0); ctx.lineTo(4.6, 0); ctx.moveTo(0, -4.6); ctx.lineTo(0, 4.6); ctx.stroke();
    ctx.restore();
  }
  ctx.translate(0, -20); ctx.scale(1 - br * 0.5, 1 + br); ctx.translate(0, 20);   // breathe (body and head)
  ctx.fillStyle = shade(0, -53, 50, 'sky'); roundRect(-46, -86, 92, 66, 18); ctx.fill();                 // body
  ctx.strokeStyle = HUE.sky[0]; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(-30, -79, 9, 2.4, -0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = HUE.cream[1]; roundRect(-30, -77, 60, 42, 10); ctx.fill();                            // chest panel
  ctx.strokeStyle = HUE.cream[0]; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = HUE.sky[0]; ctx.lineWidth = 2; roundRect(-18, -71, 32, 15, 4); ctx.stroke();       // battery meter
  ctx.fillStyle = HUE.sky[0]; roundRect(14, -67, 4, 7, 1.5); ctx.fill();
  for (let i = 0; i < 4; i++) {
    const f = clamp(st.chargeShow - i, 0, 1);
    ctx.fillStyle = 'rgba(59,53,80,0.12)'; ctx.fillRect(-15.5 + i * 7.25, -68.5, 5.5, 10);
    if (f > 0) { ctx.globalAlpha = f; ctx.fillStyle = HUE.green[1]; ctx.fillRect(-15.5 + i * 7.25, -68.5, 5.5, 10); ctx.globalAlpha = 1; }
  }
  for (const [s, hue] of [[-1, 'red'], [1, 'green']]) {             // the two lamps that pop out as yes/no buttons
    ctx.fillStyle = HUE[hue][1]; ctx.beginPath(); ctx.arc(s * 13, -45, 4.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = HUE[hue][0]; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.fillStyle = 'rgba(122,78,45,0.25)'; for (const y of [-49, -44, -39]) ctx.fillRect(-5, y, 10, 1.6);  // speaker grille
  drawArm(-1, bolt.arms[0]); drawArm(1, bolt.arms[1]);
  ctx.fillStyle = HUE.sky[0]; roundRect(-9, -98, 18, 16, 4); ctx.fill();                                // neck
  ctx.fillStyle = HUE.sky[2]; ctx.fillRect(-7, -93, 14, 2); ctx.fillRect(-7, -88, 14, 2);
  ctx.save(); ctx.translate(0, -90 + headY); ctx.rotate(bolt.tilt); ctx.translate(0, 90);              // head pivots on the neck
  const aa = 0.45 + bolt.an.q, bx = 26 + Math.sin(aa) * 15, by = -157 - Math.cos(aa) * 15;            // antenna
  ctx.strokeStyle = HUE.sky[0]; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(26, -156); ctx.quadraticCurveTo(26 + Math.sin(aa) * 4, by + 6, bx, by + 4); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = HUE.orange[1]; ctx.beginPath(); ctx.ellipse(bx, by + 6, 9 * Math.abs(Math.cos(bolt.spin)) + 1, 1.8, 0, 0, TAU); ctx.fill();  // spinner
  const hue = MOOD_HUE[st.mood], dh = discoHue().toFixed(0);
  const bg = ctx.createRadialGradient(bx - 2, by - 2.5, 0.5, bx, by, 7);
  if (bolt.tint) { bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(0.35, HUE[hue][2]); bg.addColorStop(1, HUE[hue][1]); }
  else { bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(0.35, `hsl(${dh},90%,80%)`); bg.addColorStop(1, `hsl(${dh},80%,58%)`); }
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25 + (st.sleepT >= 0 ? 0.1 * Math.sin(bolt.breath) : 0);
  ctx.fillStyle = bolt.tint ? HUE[hue][1] : `hsl(${dh},80%,60%)`; ctx.beginPath(); ctx.arc(bx, by, 11, 0, TAU); ctx.fill();   // bulb glow
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = bolt.tint ? HUE[hue][0] : `hsl(${dh},70%,40%)`; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = shade(0, -126, 58, 'sky'); roundRect(-58, -158, 116, 64, 20); ctx.fill();            // TV head
  ctx.strokeStyle = HUE.sky[0]; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = HUE.orange[1]; ctx.strokeStyle = HUE.orange[0]; ctx.lineWidth = 1.5;                 // dial ears
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 61, -126, 6.5, 0, TAU); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = '#26295A'; roundRect(-47, -150, 94, 48, 12); ctx.fill();                              // screen
  ctx.strokeStyle = HUE.sky[0]; ctx.lineWidth = 2.5; ctx.stroke();
  drawLED();
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath();                                            // glass sheen
  ctx.moveTo(-41, -146); ctx.lineTo(-18, -146); ctx.lineTo(-34, -106); ctx.lineTo(-43, -106); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-36, -154, 11, 2.4, -0.06, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
  if (st.phase === 'PLAY' && st.sleepT >= 0 && st.idle > TOK.idleWave) drawGlow(x, 100, 70, 42);       // "wake me" hint
}
function drawButtons() {                                            // "want to dance?" yes (check) / no (cross)
  const vis = prompt.show ? (reduced ? easeOutCubic : easeOutBack)(clamp(prompt.t / 0.3, 0, 1)) : prompt.out / 0.25;
  if (vis <= 0.01) return;
  const glow = prompt.show && prompt.idle > TOK.idleVisualHint;
  for (const [k, p, hue] of [['no', BTN.no, 'red'], ['yes', BTN.yes, 'green']]) {
    ctx.save(); ctx.translate(p[0], p[1] + Math.sin(time * 3 + (k === 'yes' ? 0 : 1.5)) * 1.5 * mm()); ctx.scale(vis, vis);
    if (glow) drawGlow(0, 0, 30, 30);
    ctx.fillStyle = shade(0, 0, BTN.r, hue); ctx.beginPath(); ctx.arc(0, 0, BTN.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = HUE[hue][0]; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = HUE.cream[2]; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    if (k === 'yes') { ctx.moveTo(-9, 1); ctx.lineTo(-3, 8); ctx.lineTo(10, -7); }
    else { ctx.moveTo(-7, -7); ctx.lineTo(7, 7); ctx.moveTo(7, -7); ctx.lineTo(-7, 7); }
    ctx.stroke(); ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-8, -12, 5, 2.4, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}
function drawFx() {
  for (const r of rings) {
    const k = r.t / r.dur; ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r0, r.r1, easeOutCubic(k)), 0, TAU); ctx.stroke();
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.fillStyle = p.color;
    if (p.shape === 'star') { starPath(p.x, p.y, p.size, p.size * 0.45, p.rot); ctx.fill(); }
    else if (p.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.shape === 'gear') { gearPath(p.x, p.y, p.size, p.size * 0.68, 6, p.rot); ctx.fill(); }
    else if (p.shape === 'note') {                                  // eighth note: head, stem and flag in one path
      const s = p.size;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.rot) * 0.3); ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.62, s * 0.46, -0.35, 0, TAU);
      ctx.moveTo(s * 0.36, 0); ctx.lineTo(s * 0.36, -s * 1.8); ctx.lineTo(s * 0.6, -s * 1.8); ctx.lineTo(s * 0.6, 0); ctx.closePath();
      ctx.moveTo(s * 0.6, -s * 1.8); ctx.quadraticCurveTo(s * 1.45, -s * 1.3, s * 1.1, -s * 0.75);
      ctx.quadraticCurveTo(s * 1.05, -s * 1.15, s * 0.6, -s * 1.25); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.shape === 'z') {                                   // sleepy "z": light under-stroke, purple core
      const s = p.size * (1 + 0.5 * (1 - p.life / p.max));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-s / 2, -s / 2); ctx.lineTo(s / 2, -s / 2); ctx.lineTo(-s / 2, s / 2); ctx.lineTo(s / 2, s / 2);
      ctx.strokeStyle = HUE.cream[2]; ctx.lineWidth = 4.4; ctx.stroke(); ctx.strokeStyle = HUE.purple[1]; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; ctx.restore();
    }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawChrome() {
  ctx.fillStyle = TOK.cream; roundRect(6, 6, 44, 44, 14); ctx.fill();               // Home
  ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.moveTo(28, 15); ctx.lineTo(41, 27); ctx.lineTo(37, 27); ctx.lineTo(37, 39);
  ctx.lineTo(19, 39); ctx.lineTo(19, 27); ctx.lineTo(15, 27); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.45; ctx.fillStyle = TOK.cream; roundRect(270, 6, 44, 44, 14); ctx.fill();   // Mic (disabled)
  ctx.fillStyle = TOK.ink; roundRect(287, 14, 10, 18, 5); ctx.fill();
  ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(292, 25, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(292, 34); ctx.lineTo(292, 40); ctx.stroke(); ctx.globalAlpha = 1;
}
// Mood badge (top band): a mini Bolt screen in the mood colour with that mood's eyes (shape + colour).
// Tap = AGAIN (replay the last mood), double tap = HELP (the props glow one by one).
function drawBadge() {
  if (st.phase === 'START' || st.phase === 'INTRO') return;
  const bob = Math.sin(time * 2.2) * 1.5 * (reduced ? 0.3 : 1);
  const press = 1 + clamp(-badge.sv * 0.012, -0.1, 0.12);
  ctx.save(); ctx.translate(160, 32 + bob); ctx.scale(press, 2 - press);
  if (st.hint >= 1 && st.sleepT < 0 && !dance.on) {
    ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 4; ctx.globalAlpha = 0.4 + 0.4 * Math.sin(time * TAU / TOK.glowPeriod);
    ctx.beginPath(); ctx.arc(0, 0, 29, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 2; ctx.stroke();
  const c = HUE[MOOD_HUE[st.mood]];
  ctx.strokeStyle = c[0]; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(9, -17); ctx.stroke();                              // antenna
  ctx.fillStyle = c[1]; ctx.beginPath(); ctx.arc(9.5, -18, 3, 0, TAU); ctx.fill();
  roundRect(-16, -11, 32, 24, 8); ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();                     // mini TV head
  ctx.fillStyle = '#26295A'; roundRect(-12, -7, 24, 16, 5); ctx.fill();
  const m = st.mood, arcAt = (x, y, r, a0, a1) => { ctx.moveTo(x + r * Math.cos(a0), y + r * Math.sin(a0)); ctx.arc(x, y, r, a0, a1); };
  ctx.strokeStyle = c[2]; ctx.fillStyle = c[2]; ctx.lineWidth = 1.8;
  if (m === 'CALM' || m === 'HELLO') {                              // dot eyes (HELLO winks with the right one)
    ctx.beginPath(); arcAt(-5, -1, 1.9, 0, TAU); if (m === 'CALM') arcAt(5, -1, 1.9, 0, TAU); ctx.fill();
  }
  ctx.beginPath();
  if (m === 'HAPPY' || m === 'YUMMY') { arcAt(-5, 1.5, 3, 1.15 * Math.PI, 1.85 * Math.PI); arcAt(5, 1.5, 3, 1.15 * Math.PI, 1.85 * Math.PI); }
  else if (m === 'SILLY') { ctx.moveTo(-8, -3); ctx.lineTo(-4, -0.5); ctx.lineTo(-8, 2); ctx.moveTo(8, -3); ctx.lineTo(4, -0.5); ctx.lineTo(8, 2); }
  else if (m === 'SLEEPY') { arcAt(-5, -1.5, 2.8, 0.15 * Math.PI, 0.85 * Math.PI); arcAt(5, -1.5, 2.8, 0.15 * Math.PI, 0.85 * Math.PI); }
  else if (m === 'HELLO') arcAt(5, 1, 3, 1.15 * Math.PI, 1.85 * Math.PI);
  if (m !== 'SLEEPY') arcAt(0, 3, m === 'YUMMY' ? 2.2 : 3, 0.2 * Math.PI, 0.8 * Math.PI);          // smile
  ctx.stroke(); ctx.lineCap = 'butt';
  ctx.restore();
}
function drawStart() {
  ctx.fillStyle = 'rgba(30,34,69,0.35)'; ctx.fillRect(0, 0, W, H);
  const p = 1 + Math.sin(time * 3) * 0.04;
  ctx.save(); ctx.translate(160, 120); ctx.scale(p, p);
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fill();
  ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(18, 0); ctx.lineTo(-10, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}
let fps = 60, frameMs = 0;
function drawHud() {
  if (!debug) return;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(176, 214, 144, 26);
  ctx.fillStyle = parts.length > TOK.deviceMaxParticles ? '#FF9A92' : '#FFFFFF'; ctx.font = '8px monospace';
  ctx.fillText(`fps ${fps.toFixed(0)} draw ${frameMs.toFixed(1)}ms p ${parts.length}/${maxParticles}`, 180, 224);
  ctx.fillText(`seed ${seed} ${st.phase} ${st.mood} r${st.reacts} hint ${st.hint} ${reduced ? 'RM' : ''}`, 180, 235);
}
// One full frame of the game scene (the golden harness calls this directly).
function drawScene() {
  drawBackground();
  drawGears(); drawDisco(); drawNight();
  drawFood(); drawMoon(); drawHello();
  drawBolt();
  drawSnack(); drawButtons(); drawFx(); drawBadge(); drawChrome();
}

// Test hook for tools/quality_bar_golden/sketch_check.mjs (not ported): the logical point a helpful player taps next, or null.
function autoTarget() {
  if (st.phase === 'START') return { x: 160, y: 120 };
  if (st.phase !== 'PLAY' || dance.on) return null;                 // the dance plays out by itself
  if (st.sleepT >= 0) return st.sleepT >= TOK.wakeGuard ? { x: TARGET_PT.head[0], y: TARGET_PT.head[1] } : null;
  if (prompt.show) {
    if (prompt.t <= TOK.maxInputBlock) return null;
    const b = prompt.n % 2 ? BTN.yes : BTN.no;                      // alternate yes / no between prompts
    return { x: b[0], y: b[1] };
  }
  if (bolt.act && bolt.act.kind !== 'wave') return null;            // let the reaction finish
  const p = TARGET_PT[CYCLE[st.total % CYCLE.length]];
  return { x: p[0], y: p[1] };
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); if (ac) musicTick();
  const t0 = performance.now();
  drawScene();
  if (st.phase === 'START') drawStart();
  frameMs = lerp(frameMs, performance.now() - t0, 0.1); fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
