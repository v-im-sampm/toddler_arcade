<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Little Arcade v2 – reference sketch (Feed the Monster)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html (Color Pop) and
  hatch_a_pet.html. Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs,
  ellipses, bezier/quadratic curves, linear/radial gradients, globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene.
  Audio nodes: sine oscillators (additive partials kept below 7.6 kHz, sine LFOs), linear-attack /
  exponential-decay gains, exponential pitch glides, white noise through one band-pass biquad for
  the crunches, an original bouncy looping score (E-flat major pentatonic, 4/4 at 100 bpm,
  tuba-pluck bass) on its own small voice pool that ducks under the cues, one compressor.
  All art is procedural and original (Munch is an original Toy Box Island monster); no external
  resources, no network, no storage, no mic.
  Play: Munch shows N fingers and N dots in its thought bubble. Drag a snack into its mouth, or tap a
  snack and it hops in; a dot card feeds 1, 2 or 3 snacks with counting. Extra snacks only make
  Munch giggle. Tap the bubble to hear the request again.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap,
  1 / 2 / 3 = voice ONE / TWO / THREE stand-ins (same as the dot cards), A = AGAIN, H = HELP.
  URL ?seed=N.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1E2245; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #note { position: fixed; left: 8px; bottom: 6px; color: #9DB8FA; font: 12px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Feed the Monster reference sketch"></canvas></div>
<div id="note">v2 reference sketch · Feed the Monster · 320×240 logical stage · D debug · R reduced motion · P particle cap · 1 2 3 / A / H voice stand-ins (ONE TWO THREE / AGAIN / HELP)</div>
<script>
'use strict';
// ---------- tokens (same subset as quality_bar.html / hatch_a_pet.html) ----------
const W = 320, H = 240;
const TOK = {
  ink: '#3B3550', paper: '#FFF8EC', cream: '#FFF3D6', creamLight: '#FFFBEF', creamLine: '#D9C7A3', hintGlow: '#FFE066',
  wallTop: '#FFD8B8', wallBot: '#FFB5A7', wood: '#FFC07F', woodDeep: '#FF8A2A', woodLine: '#C2621B',
  squashPress: [1.12, 0.88], wiggleDeg: 6, wiggleMs: 360, glowPeriod: 0.9,
  idleVisualHint: 6, idleSpokenHint: 12, maxInputBlock: 0.3, autoHelpMisses: 2,
  springBouncy: { k: 380, c: 14 }, dragFollow: { k: 520, c: 40 }, breathScale: 0.025, bob: 2,
  tapDebounce: 0.08, dragDeadZone: 12, hitSlop: 6,
  instant: 0.06, quick: 0.14, base: 0.22, gentle: 0.4, scene: 0.45, celebrate: 1.5,
  chew: 0.35, giggle: 0.5, full: 0.8, cardStep: 0.42, refill: 0.6,
  deviceMaxParticles: 96, webMaxParticles: 400,
};
// Munch: an original round fuzzy monster (purple fur, cream horns, one big mouth).
const FUR = { shadow: '#6236A6', base: '#8F5BE0', light: '#C9AEF5', deep: '#4B2470', belly: '#DCCBFA' };
// Original snacks with distinct silhouettes (berry, carrot, cookie): colour is never the only cue.
const SNACKS = [
  { name: 'BERRY',  line: '#9E2A31', shade: '#B8323A', base: '#EF4B4F', light: '#FF9A92' },
  { name: 'CARROT', line: '#A4521A', shade: '#C2621B', base: '#FF8A2A', light: '#FFC07F' },
  { name: 'COOKIE', line: '#7A4E2D', shade: '#B07A4F', base: '#DDB892', light: '#F3DDBA' },
];
// Stage geometry (logical px; boxes from the game doc §3.3).
const BOWL = [8, 72, 112, 96];                         // bowl hit box: the nearest ready snack is picked
const RIM = { x: 64, y: 126, rx: 54, ry: 11 };         // bowl rim ellipse
const SLOTS = [[45, 107], [83, 107], [27, 124], [64, 128], [101, 124]];   // back row first
const MUNCH = { x: 224, y: 120, r: 44 };               // body centre; feet on the counter at y 164
const MUNCH_BOX = [136, 72, 176, 96], MOUTH_HIT = [176, 88, 96, 64];
const MOUTH = { x: 224, y: 128 };                      // where snacks go in
const BUBBLE = [120, 4, 80, 56];                       // thought bubble = prompt badge (tap: AGAIN)
const CLOUD = [[141, 32, 18], [160, 25, 19], [179, 32, 18], [150, 42, 13], [170, 42, 13]];
const TRAIL = [[207, 61, 4], [216, 70, 2.6]];
const HAND = { x: 143, y: 35 }, DOTS = { x: 178, y: 34 };
// Munch's paw in the bubble. Fingers rise in this order: index, middle, ring, pinky, thumb (base, tip).
const FINGERS = [[-3, 0, -5, -12], [1, -1, 1, -14], [5, 0, 7, -12], [8, 3, 12, -7], [-7, 5, -13, -2]];
const CARDS = [[36, 176, 72, 56], [124, 176, 72, 56], [212, 176, 72, 56]];   // dot cards 1 / 2 / 3
const COUNTER_Y = 164;

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const popEase = t => reduced ? easeOutCubic(t) : easeOutBack(t);   // reduced motion: no overshoot
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];
const grow = (r, s) => [r[0] - s, r[1] - s, r[2] + 2 * s, r[3] + 2 * s];
const crossed = (t, dt, at) => t >= at && t - dt < at;               // a logic-time event fires this frame

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- audio (Web Audio, E-flat major pentatonic, conservative gain) ----------
let ac = null, master = null, voices = [], noiseBuf = null;
const PENT = [0, 2, 4, 7, 9];
function degFreq(deg, oct = 0) {                                   // degree 0 = E-flat 5
  const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5;
  return 622.25 * Math.pow(2, (PENT[i] + 12 * (o + oct)) / 12);
}
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
  // White noise for the crunches (fixed seed, never grng; the device uses its own noise generator).
  const nr = mulberry32(99), len = Math.floor(ac.sampleRate * 0.25);
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = nr() * 2 - 1;
}
function voiceOk(len) {
  const now = ac.currentTime; voices = voices.filter(e => e > now);
  if (voices.length >= 8) return false;                        // voice limit
  voices.push(now + len); duckMusic(now, len); return true;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function marimba(freq, when = 0, vel = 1, dur = 0.55) {
  if (!ac || !voiceOk(when + dur)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.45 * vel, 0.003, dur);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  o1.connect(g); g.connect(master); o1.start(t); o1.stop(t + dur + 0.05);
  if (freq * 3.99 < 7600) {                                    // bright partial only while it stays < 7.6 kHz
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 3.99;
    const g2 = ac.createGain(); env(g2, t, 0.18 * vel, 0.003, 0.09);
    o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + dur + 0.05);
  }
}
// Pitched sine with an exponential glide (boing, hop-back, giggle chirps all use this voice).
function glide(f0, f1, glideS, when, peak, dur) {
  if (!ac || !voiceOk(when + dur)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, 0.003, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.04);
}
// Woodblock knock: short body with a slight pitch drop plus a bright inharmonic tick.
function woodblock(freq, when = 0, vel = 1) {
  glide(freq, freq * 0.92, 0.05, when, 0.42 * vel, 0.12);
  glide(freq * 2.76, freq * 2.76, 0.01, when, 0.14 * vel, 0.04);
}
// Tuba-ish pluck: fundamental + soft 2nd harmonic, quick attack, exponential decay.
function tuba(freq, when = 0, vel = 1, dur = 0.3) {
  if (!ac || !voiceOk(when + dur)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.34 * vel, 0.012, dur);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
  const g2 = ac.createGain(); g2.gain.value = 0.45;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
// Crunch: white noise through one band-pass biquad whose centre falls (no pitch, so key-neutral).
function crunch(when = 0, vel = 1, f = 2400) {
  if (!ac || !noiseBuf || !voiceOk(when + 0.09)) return;
  const t = ac.currentTime + when;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(f, t); bp.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.07);
  const g = ac.createGain(); env(g, t, 0.55 * vel, 0.002, 0.08);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + 0.1);
}
// "Mmm": sine glide between two degrees with a gentle vibrato (sine LFO on frequency).
function hum(f0, f1, when, peak, dur) {
  if (!ac || !voiceOk(when + dur)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.5);
  const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 6;
  const lg = ac.createGain(); lg.gain.value = f0 * 0.012; lfo.connect(lg); lg.connect(o.frequency);
  const g = ac.createGain(); env(g, t, peak, 0.05, dur);
  o.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
}
// Happy burp: low glide B-flat 3 -> E-flat 3 with a gain flutter (sine LFO on a pre-envelope gain).
function burpSound() {
  if (!ac || !voiceOk(0.36)) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(degFreq(3, -2), t); o.frequency.exponentialRampToValueAtTime(degFreq(0, -2), t + 0.26);
  const trem = ac.createGain(); trem.gain.value = 0.7;
  const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 22;
  const lg = ac.createGain(); lg.gain.value = 0.3; lfo.connect(lg); lg.connect(trem.gain);
  const g = ac.createGain(); env(g, t, 0.34, 0.02, 0.34);
  o.connect(trem); trem.connect(g); g.connect(master);
  o.start(t); lfo.start(t); o.stop(t + 0.4); lfo.stop(t + 0.4);
}
const tapNote = () => marimba(degFreq(0, 1), 0, 0.3, 0.25);
const pickSound = () => glide(degFreq(2), degFreq(4), 0.06, 0, 0.18, 0.12);           // lift: little up-chirp
const hopSound = () => glide(degFreq(0, -1), degFreq(3, -1), 0.12, 0, 0.26, 0.15);     // boing into the mouth
const gulpSound = () => glide(degFreq(3, -1), degFreq(0, -1), 0.06, 0, 0.22, 0.1);     // drop: quick gulp
const backSound = () => glide(degFreq(3, -1), degFreq(0, -1), 0.14, 0, 0.16, 0.16);    // hop back (never a buzzer)
const landSound = () => woodblock(degFreq(0, -1), 0, 0.35);
const refillSound = () => marimba(degFreq(2, 1), 0, 0.1, 0.12);
const cardSound = i => woodblock(degFreq(2 * i, -1), 0, 0.8);
// Count crunch k: crunch-crunch + marimba and tuba at degree 0, 2, 4, 6, 8 (rises with the count).
function countSound(k) {
  const d = 2 * (k - 1);
  crunch(0, 0.8); crunch(0.09, 0.55, 1800);
  marimba(degFreq(d), 0, 0.85, 0.5); tuba(degFreq(d, -2), 0, 0.6, 0.3);
}
// Request motif note i (the same pitches as the counts): plays as finger i rises in the bubble.
const requestNote = i => { marimba(degFreq(2 * i), 0, 0.5, 0.3); tuba(degFreq(2 * i, -2), 0, 0.3, 0.22); };
function giggleSound() { for (let i = 0; i < 4; i++) glide(degFreq(8 - i), degFreq(9 - i), 0.05, i * 0.08, 0.18, 0.1); }
const yumSound = () => hum(degFreq(2, -1), degFreq(4, -1), 0, 0.2, 0.5);
const askHum = () => hum(degFreq(2, -1), degFreq(3, -1), 0, 0.16, 0.32);                  // spoken-hint stand-in
const helloSound = () => { hum(degFreq(0, -1), degFreq(3, -1), 0, 0.14, 0.45); glide(degFreq(4), degFreq(5), 0.08, 0.5, 0.18, 0.12); };
function jingle() {                                                 // celebrate: 1.2 s, 7 voices
  [0, 2, 4, 5, 7].forEach((d, i) => marimba(degFreq(d), i * 0.1, 0.7, 0.35));
  marimba(degFreq(5), 0.62, 0.6, 0.6); tuba(degFreq(0, -2), 0.62, 0.7, 0.5);
}

// ---------- music bed (original tune; E-flat major pentatonic, 4/4 at 100 bpm, 8 bars = 19.2 s loop) ----------
// melody: [beat, degree, beats] at octave -1 (soft pluck); bass: tuba-pluck oom-pah [root, other] per bar, octave -2.
const SCORE = { spb: 60 / 100, beats: 32, voices: 6,
  melody: [[0, 2, .5], [.5, 3, .5], [1, 4, 1], [2, 3, .5], [2.5, 2, .5], [3, 0, 1],
           [4, 1, .5], [4.5, 2, .5], [5, 3, 1], [6, 2, 2],
           [8, 4, .5], [8.5, 4, .5], [9, 5, 1], [10, 4, .5], [10.5, 3, .5], [11, 2, 1],
           [12, 3, .5], [12.5, 4, .5], [13, 3, 1], [14, 2, 2],
           [16, 1, .5], [16.5, 2, .5], [17, 3, 1], [18, 4, .5], [18.5, 3, .5], [19, 2, 1],
           [20, 1, 1], [21, 3, .5], [21.5, 2, .5], [22, 1, 2],
           [24, 2, .5], [24.5, 3, .5], [25, 4, .5], [25.5, 5, .5], [26, 4, 1], [27, 3, 1],
           [28, 2, .5], [28.5, 1, .5], [29, 0, 1]],
  bass: [[0, 3], [0, 3], [-1, 2], [-1, 2], [1, 4], [3, 1], [0, 3], [3, 1]] };
// Events in time order: [beat, freq, peak, attack, dur, harmonic2]. Plucks: short attack, ringing tail.
const SONG = [];
for (const [b, d, n] of SCORE.melody) SONG.push([b, degFreq(d, -1), 0.06, 0.01, n * SCORE.spb * 0.8 + 0.25, 0]);
SCORE.bass.forEach(([r, o], bar) => { for (let i = 0; i < 4; i++) SONG.push([bar * 4 + i, degFreq(i % 2 ? o : r, -2), i % 2 ? 0.055 : 0.075, 0.01, 0.34, 0.45]); });
SONG.sort((a, b) => a[0] - b[0] || b[2] - a[2]);
let music = null, musicBus = null, duck = null, duckUntil = 0, musicVoices = [];
function startMusic() {
  if (!ac) return;
  if (!musicBus) { musicBus = ac.createGain(); duck = ac.createGain(); musicBus.connect(duck); duck.connect(master); }
  const now = ac.currentTime;
  musicBus.gain.cancelScheduledValues(now); musicBus.gain.setValueAtTime(0, now);
  musicBus.gain.setTargetAtTime(1, now + 0.5, 1.5);                // gentle fade-in, never a loud start
  music = { t0: now + 0.5, i: 0, loop: 0 }; musicVoices = [];
}
function stopMusic() {
  if (!music) return;
  musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(0, ac.currentTime, 0.15);
  music = null;
}
function musicVoiceOk(t, len) {                                    // own pool: never takes cue voices
  musicVoices = musicVoices.filter(e => e > t);
  if (musicVoices.length >= SCORE.voices) return false;
  musicVoices.push(t + len); return true;
}
function musicNote(t, freq, peak, attack, dur, h2) {
  if (!musicVoiceOk(t, dur)) return;
  const g = ac.createGain(); env(g, t, peak, attack, dur);
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  o.connect(g); o.start(t); o.stop(t + dur + 0.05);
  if (h2 > 0) {                                                    // tuba colour: soft octave partial
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
    const g2 = ac.createGain(); g2.gain.value = h2; o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + dur + 0.05);
  }
  g.connect(musicBus);
}
function musicTick() {                                             // schedule notes 0.4 s ahead
  if (!music) return;
  for (;;) {
    const e = SONG[music.i], t = music.t0 + (music.loop * SCORE.beats + e[0]) * SCORE.spb;
    if (t > ac.currentTime + 0.4) return;
    musicNote(t, e[1], e[2], e[3], e[4], e[5]);
    if (++music.i >= SONG.length) { music.i = 0; music.loop++; }
  }
}
function duckMusic(now, len) {                                     // music dips to 0.35 under cues
  if (!duck) return;
  duckUntil = Math.max(duckUntil, now + len);
  duck.gain.cancelScheduledValues(now);
  duck.gain.setTargetAtTime(0.35, now, 0.03); duck.gain.setTargetAtTime(1, duckUntil, 0.3);
}

// ---------- particles, rings ----------
let parts = [], rings = [];
function emit(x, y, n, o) {
  n = Math.max(1, Math.round(n * (reduced ? 0.5 : 1)));
  for (let i = 0; i < n; i++) {
    if (parts.length >= maxParticles) parts.shift();            // evict oldest, never exceed cap
    const a = frng() * Math.PI * 2, sp = lerp(o.speed[0], o.speed[1], frng()), life = lerp(o.life[0], o.life[1], frng());
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.gravity, life, max: life,
      shape: o.shape, color: o.colors[(frng() * o.colors.length) | 0], size: o.size * lerp(0.7, 1.3, frng()),
      rot: frng() * 6.28, vr: (frng() - 0.5) * 8, add: !!o.additive });
  }
}
const SPARKLE = { speed: [40, 110], life: [0.35, 0.7], gravity: 60, shape: 'star', size: 5, colors: ['#FFEB9C', '#FFFBEF'], additive: true };
const CONFETTI = { speed: [60, 170], life: [0.9, 1.5], gravity: 140, shape: 'rect', size: 6, up: 60,
  colors: [FUR.base, FUR.light, '#FFD23F', '#21B3B0', '#F06BB8', '#FFFBEF'] };
const CRUMBS = { speed: [40, 100], life: [0.4, 0.7], gravity: 300, shape: 'circle', size: 3, up: 40, colors: ['#DDB892', '#B07A4F'] };
const HEARTS = { speed: [30, 70], life: [0.7, 1.1], gravity: -40, shape: 'heart', size: 6, colors: ['#F06BB8', '#FF9A92'] };
const BURP = { speed: [30, 80], life: [0.6, 1.0], gravity: -30, shape: 'star', size: 5, up: 50, colors: ['#FFEB9C', '#C9AEF5', '#FFFBEF'], additive: true };
const ring = (x, y, r0, r1, dur, color, w) => rings.push({ x, y, r0, r1, t: 0, dur, color, w });

// ---------- entities ----------
// bowl slots: state 'in' (ready), 'out' (a flyer from this slot is moving), 'empty' (refill timer running).
// bowlTap: time of the last pick; the 80 ms debounce covers the whole bowl, so a bounced touch on a snack
// that has just left cannot lift its neighbour as well.
let bowl = [], bowlTap = -9;
// flyers: snacks out of the bowl. mode 'held' (follows the finger on a spring), 'hop' (arc into the
// mouth), 'eat' (dropped on the mouth: quick tween in), 'back' (hops back to its slot).
let flyers = [], held = null;

fillBowl();

// ---------- input ----------
function toStage(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = toStage(e);
  touch.x = x; touch.y = y; touch.t = 1;
  if (st.phase === 'START') { startGame(); return; }
  if (ac && ac.state === 'suspended') ac.resume();
  if (inRect(x, y, [0, 0, 56, 56])) { home(); return; }
  if (inRect(x, y, [264, 0, 56, 56])) { ring(292, 28, 6, 24, 0.4, '#FFFFFF', 2); return; } // mic: disabled in sketch
  if (st.phase === 'INTRO') { st.t = 99; return; }               // intro skippable
  if (held) return;                                              // one snack in the hand at a time
  if (inRect(x, y, BUBBLE)) { tapBubble(); return; }
  for (let i = 0; i < 3; i++) if (inRect(x, y, grow(CARDS[i], TOK.hitSlop))) { tapCard(i); return; }
  if (inRect(x, y, grow(BOWL, TOK.hitSlop)) && pickSnack(x, y, e.pointerId)) return;
  if (inRect(x, y, MUNCH_BOX) && Math.hypot(x - MUNCH.x, y - MUNCH.y) < 54) { tickle(); return; }
  ring(x, y, 3, 22, 0.5, '#FFFFFF', 2); emit(x, y, 4, SPARKLE);

  held.moved = Math.max(held.moved, Math.hypot(x - held.sx, y - held.sy));

  if (k === 'r') reduced = !reduced;
  if (k === 'p') maxParticles = maxParticles === TOK.deviceMaxParticles ? TOK.webMaxParticles : TOK.deviceMaxParticles;

function dotPos(n, i) {                                             // counter dots in the bubble (dice layout for 4, 5)

  if (n === 4) return [DOTS.x + (i % 2 ? 6 : -6), DOTS.y + (i < 2 ? -6 : 6)];

// ---------- update ----------
function spring(o, target, dt) {                                    // 2 substeps (stable at 60 Hz)
  for (let i = 0; i < 2; i++) {
    const h = dt / 2, a = -TOK.springBouncy.k * (o.q - target) - TOK.springBouncy.c * o.qv;
    o.qv += a * h; o.q += o.qv * h;

function follow(f, dt) {                                            // held snack chases the finger (3 substeps)

}
function update(dt) {

    if (st.idle > TOK.idleVisualHint && st.hint < 1) st.hint = 1;                // Munch points at the bowl
    if (st.idle > TOK.idleSpokenHint && !st.spoken) spokenHint();                 // hum + counted request + help
    if (st.fullIn > 0) { st.fullIn -= dt; if (st.fullIn <= 0) startFull(); }
  } else if (st.phase === 'FULL') {

  } else if (st.phase === 'CELEBRATE') {
    if (st.t >= TOK.celebrate) newRound();

  if (st.queue > 0 && playing()) {
    st.qT -= dt;

      const i = nearestSlot(MOUTH.x, MOUTH.y);
      if (i >= 0) {

  // Munch: eyes follow the dragged / flying snack, the last touch, or the bowl when hinting
  let tx, ty;
  const fl = held || flyers.find(f => f.mode !== 'back') || flyers[0];
  if (fl) { tx = fl.x; ty = fl.y; }
  else if (touch.t > 0) { tx = touch.x; ty = touch.y; }

  else { tx = MUNCH.x + Math.sin(time * 0.45) * 90; ty = 150 + Math.sin(time * 0.31) * 30; }
  munch.look = [tx - MUNCH.x, ty - (MUNCH.y - 16)];
  munch.lookS[0] = lerp(munch.lookS[0], munch.look[0], Math.min(1, dt * 10));
  munch.lookS[1] = lerp(munch.lookS[1], munch.look[1], Math.min(1, dt * 10));
  // mouth: opens wider as a snack approaches; 3-frame chomp (open, half, shut) then chew
  let mt = 0;
  if (held) mt = clamp(1.2 - Math.hypot(held.x - MOUTH.x, held.y - MOUTH.y) / 120, 0.12, 1);
  for (const f of flyers) if (f.mode === 'hop' || f.mode === 'eat') mt = Math.max(mt, 0.55 + 0.45 * clamp(f.t / f.dur, 0, 1));
  if (st.queue > 0 || munch.giggle > 0) mt = Math.max(mt, 0.45);
  if (munch.lick > 0) mt = Math.max(mt, 0.3);

    munch.mo = munch.pend ? (munch.chompT < 0.03 ? 0.9 : 0.4) : 0;

  }

  munch.lick = Math.max(0, munch.lick - dt); munch.giggle = Math.max(0, munch.giggle - dt);
  if (playing() && !held && !flyers.length && munch.chompT < 0) {
    munch.nextLick -= dt; if (munch.nextLick <= 0) { munch.lick = 0.7; munch.nextLick = 5 + frng() * 4; }
  }
  spring(munch, 0, dt);

  // bowl: refills (FM-5), pop-in, landing squash, calm idle wiggles (more often while hinting)
  for (const b of bowl) {
    if (b.state === 'empty') { b.refill -= dt; if (b.refill <= 0) { b.state = 'in'; b.kind = randKind(); b.pop = 0; refillSound(); } }
    b.pop = Math.min(1, b.pop + dt / 0.3); b.wig = Math.max(0, b.wig - dt); spring(b, 0, dt);
  }
  st.wigT -= dt;
  if (st.wigT <= 0) {
    const ready = bowl.filter(b => b.state === 'in');
    if (ready.length && playing()) ready[(frng() * ready.length) | 0].wig = TOK.wiggleMs / 1000;
    st.wigT = st.hint >= 1 ? 1.6 : 3 + frng() * 2;
  }

  // bubble: fingers rise one by one with the request motif; counter dots pop when filled
  bubble.t += dt; bubble.pop = Math.min(1, bubble.pop + dt / 0.3);
  if (bubble.count && playing()) for (let i = 0; i < st.n; i++) if (crossed(bubble.t, dt, 0.2 + 0.3 * i)) requestNote(i);
  if (bubble.t > 0.35 + 0.3 * st.n) bubble.count = false;
  for (let i = 0; i < 5; i++) bubble.dot[i] = Math.max(0, bubble.dot[i] - dt);
  bubble.sv *= Math.pow(0.86, dt * 60);
  for (const c of cards) { c.sv *= Math.pow(0.86, dt * 60); if (c.litT > 0) { c.litT -= dt; if (c.litT <= 0) c.lit = 0; } }

  glint.t += dt; glint.next -= dt;
  if (glint.next <= 0) { glint.jar = (frng() * 3) | 0; glint.t = 0; glint.next = 4 + frng() * 4; }

// ---------- drawing helpers ----------
function starPath(cx, cy, ro, ri, rot) {

}

}
// Rounded rectangle as one subpath (arcTo), so several can share one path and one fill call.
function rrSub(x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  ctx.stroke();
  ctx.fillStyle = 'rgba(220,203,250,0.75)'; ctx.beginPath(); ctx.ellipse(0, 31, 21, 9, 0, 0, Math.PI * 2); ctx.fill();   // belly
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-22, -29, 8, 4.5, -0.6, 0, Math.PI * 2);
  circleSub(-12, -36, 1.8); ctx.fill();                                                      // shine
  // face: shifts a little toward what Munch is watching
  const ln = Math.hypot(munch.lookS[0], munch.lookS[1]) || 1;
  ctx.save(); ctx.translate(clamp(munch.lookS[0] * 0.025, -3, 3), clamp(munch.lookS[1] * 0.02, -2, 2));
  const lift = p.eyes === 'happy' ? -3 : asleep ? 2 : -2.5 * munch.mo;
  ctx.strokeStyle = FUR.deep; ctx.lineWidth = 2.6; ctx.beginPath();                          // brows
  for (const s of [-1, 1]) { ctx.moveTo(s * 17 - 6, -31 + lift); ctx.quadraticCurveTo(s * 17, -34 + lift, s * 17 + 6, -31 + lift); }
  ctx.stroke();
  if (p.eyes === 'open' && munch.blink >= 0) {
    ctx.beginPath(); ellipseSub(-17, -16, 10.5, 11.5); ellipseSub(17, -16, 10.5, 11.5);
    ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 1.5; ctx.stroke();
    const k = Math.min(1, ln / 50) * 4.2, lx = munch.lookS[0] / ln * k, ly = munch.lookS[1] / ln * k;
    ctx.fillStyle = TOK.ink; ctx.beginPath(); circleSub(-17 + lx, -16 + ly, 5.5); circleSub(17 + lx, -16 + ly, 5.5); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); circleSub(-19 + lx, -18.5 + ly, 1.9); circleSub(15 + lx, -18.5 + ly, 1.9); ctx.fill();
  } else {
    ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2.4; ctx.beginPath();
    for (const s of [-1, 1]) {
      if (p.eyes === 'happy') arcSub(s * 17, -12, 7, 1.15 * Math.PI, 1.85 * Math.PI);      // ^ ^
      else arcSub(s * 17, -20, 7, 0.2 * Math.PI, 0.8 * Math.PI);                            // closed (blink / asleep)
    }
    ctx.stroke();
  }
  const puff = munch.chompT >= 0 && !munch.pend ? 1.3 : 1;                                   // chewing: cheeks puff
  ctx.fillStyle = 'rgba(240,107,184,0.45)'; ctx.beginPath(); ellipseSub(-31, 0, 6 * puff, 4 * puff); ellipseSub(31, 0, 6 * puff, 4 * puff); ctx.fill();
  // the one big mouth: corners at (+-mw, 6); top lip arches up, jaw drops with mo
  const mo = clamp(munch.mo, 0, 1), mw = 15 + 9 * mo, ct = 2 - 4 * mo, cb = 12 + 36 * mo, yb = 3 + cb / 2;
  const mouthPath = () => { ctx.beginPath(); ctx.moveTo(-mw, 6); ctx.quadraticCurveTo(0, ct, mw, 6); ctx.quadraticCurveTo(0, cb, -mw, 6); ctx.closePath(); };
  const topY = x => { const s = (x / mw + 1) / 2; return (1 - s) * (1 - s) * 6 + 2 * s * (1 - s) * ct + s * s * 6; };
  mouthPath(); ctx.fillStyle = FUR.deep; ctx.fill();
  if (mo > 0.3) { ctx.fillStyle = '#F06BB8'; ctx.beginPath(); ctx.ellipse(0, yb - 3 - 2 * mo, 5 + 6 * mo, 2.5 + 3 * mo, 0, 0, Math.PI * 2); ctx.fill(); }
  if (mo > 0.2) {
    ctx.beginPath();
    for (const tx of [-8, 8]) { ctx.moveTo(tx - 4, topY(tx - 4) - 0.5); ctx.lineTo(tx + 4, topY(tx + 4) - 0.5); ctx.lineTo(tx, topY(tx) + 4 + 2 * mo); ctx.closePath(); }
    ctx.fillStyle = TOK.creamLight; ctx.fill(); ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 1; ctx.stroke();
  }
  mouthPath(); ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 2; ctx.stroke();
  if (munch.lick > 0 && mo < 0.5) {                                                          // tongue lick
    const k = Math.sin(Math.PI * (1 - munch.lick / 0.7));
    ctx.beginPath(); ctx.ellipse(mw * 0.55, 8 + 3 * k, 3 + 2.5 * k, 2.5 + 1.5 * k, 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#F06BB8'; ctx.fill(); ctx.strokeStyle = '#B23E86'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  if (asleep) {                                                                              // sleep bubble
    const s = 3 + 3 * (0.5 + 0.5 * Math.sin(time * 2));
    ctx.beginPath(); ctx.arc(mw + 5, 2 - s, s, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.restore();
  const L = pawAt(p.arms, -1), Rp = pawAt(p.arms, 1);                                         // arms + paws
  ctx.beginPath();
  for (const [s, [px, py]] of [[-1, L], [1, Rp]]) { ctx.moveTo(s * 31, 8); ctx.quadraticCurveTo((s * 31 + px) / 2 + s * 6, (8 + py) / 2 + 7, px, py); }
  ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 11; ctx.stroke(); ctx.strokeStyle = FUR.base; ctx.lineWidth = 7.5; ctx.stroke();
  if (p.arms === 'point') {                                                                  // pointing finger
    ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.lineTo(L[0] - 10, L[1] - 1);
    ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 5; ctx.stroke(); ctx.strokeStyle = FUR.base; ctx.lineWidth = 2.6; ctx.stroke();
  }
  ctx.beginPath(); circleSub(L[0], L[1], 6.5); circleSub(Rp[0], Rp[1], 6.5);
  ctx.fillStyle = FUR.base; ctx.fill(); ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.restore();
}

// ---------- thought bubble: Munch's paw shows N fingers, N dots fill as it eats (prompt badge, tap = AGAIN) ----------
function cloudPath(grow, dx, dy) {
  ctx.beginPath();
  for (const [x, y, r] of CLOUD) circleSub(x + dx, y + dy, r + grow);
  for (const [x, y, r] of TRAIL) circleSub(x + dx, y + dy, r + grow);
}
const fingerK = i => i < st.n ? popEase(clamp((bubble.t - 0.2 - 0.3 * i) / TOK.base, 0, 1)) : 0;
function drawBubble() {
  if (st.phase === 'START' || st.phase === 'INTRO') return;
  const sc = popEase(clamp(bubble.pop, 0, 1));
  if (sc < 0.02) return;
  const bob = Math.sin(time * 2.2) * 1.5 * (reduced ? 0.3 : 1), press = 1 + clamp(-bubble.sv * 0.012, -0.1, 0.12);
  ctx.save(); ctx.translate(160, 32 + bob); ctx.scale(sc * press, sc * (2 - press)); ctx.translate(-160, -32);
  ctx.fillStyle = 'rgba(59,53,80,0.12)'; cloudPath(1.8, 2, 3); ctx.fill();
  if (st.hint >= 1 && playing()) {
    ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 6; ctx.globalAlpha = 0.35 + 0.45 * glowPulse();
    cloudPath(1.8, 0, 0); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = TOK.creamLine; cloudPath(1.8, 0, 0); ctx.fill();                      // outline = union of bigger discs
  ctx.fillStyle = TOK.creamLight; cloudPath(0, 0, 0); ctx.fill();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();                                                                       // fingers (folded ones are knuckles)
  FINGERS.forEach(([bx, by, tx, ty], i) => {
    const k = lerp(0.3, 1, fingerK(i));
    ctx.moveTo(HAND.x + bx, HAND.y + by); ctx.lineTo(HAND.x + bx + (tx - bx) * k, HAND.y + by + (ty - by) * k);
  });
  ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 6.5; ctx.stroke(); ctx.strokeStyle = FUR.base; ctx.lineWidth = 4; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(HAND.x, HAND.y + 5, 9, 8, 0, 0, Math.PI * 2);
  ctx.fillStyle = FUR.base; ctx.fill(); ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(HAND.x - 3, HAND.y + 2, 3, 2, -0.5, 0, Math.PI * 2); ctx.fill();
  const n = st.n, r = n === 5 ? 4.5 : 5;
  ctx.beginPath();                                                                       // empty dots pulse with their finger
  for (let i = st.k; i < n; i++) { const [x, y] = dotPos(n, i); circleSub(x, y, r * (1 + 0.35 * Math.sin(Math.PI * clamp((bubble.t - 0.2 - 0.3 * i) / TOK.base, 0, 1)))); }
  ctx.fillStyle = 'rgba(143,91,224,0.16)'; ctx.fill(); ctx.strokeStyle = 'rgba(98,54,166,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  if (st.k > 0) {
    ctx.beginPath();                                                                     // filled dots pop in
    for (let i = 0; i < st.k; i++) { const [x, y] = dotPos(n, i), d = bubble.dot[i]; circleSub(x, y, r * (1 + (d > 0 ? Math.sin(Math.PI * (1 - d / 0.35)) * 0.45 : 0))); }
    ctx.fillStyle = FUR.base; ctx.fill(); ctx.strokeStyle = FUR.shadow; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath();
    for (let i = 0; i < st.k; i++) { const [x, y] = dotPos(n, i); circleSub(x - 1.6, y - 1.6, 1.3); }
    ctx.fill();
  }
  ctx.restore();
}

// ---------- dot cards 1 / 2 / 3 on the counter front ----------
function drawCards() {
  const target = st.hint >= 2 && playing() && !incoming() ? Math.min(3, st.n - st.k) - 1 : -1, m = reduced ? 0.3 : 1;
  for (let i = 0; i < 3; i++) {
    const [x, y, w, h] = CARDS[i], cd = cards[i], press = 1 + clamp(-cd.sv * 0.012, -0.1, 0.12);
    ctx.save(); ctx.translate(x + w / 2, y + h / 2 + Math.sin(time * 1.9 + i * 1.7) * 0.8 * m); ctx.scale(press, 2 - press);
    ctx.fillStyle = 'rgba(59,53,80,0.15)'; roundRect(-w / 2 + 2, -h / 2 + 4, w, h, 12); ctx.fill();
    if (i === target) {
      ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 5; ctx.globalAlpha = 0.35 + 0.5 * glowPulse();
      roundRect(-w / 2 - 3, -h / 2 - 3, w + 6, h + 6, 15); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = TOK.cream; roundRect(-w / 2, -h / 2, w, h, 12); ctx.fill();
    ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; roundRect(-w / 2 + 7, -h / 2 + 4, w - 14, 7, 3.5); ctx.fill();
    const dx = j => (j - i / 2) * 20;
    if (cd.lit > 0) {                                                                    // dots light one by one as it feeds
      ctx.fillStyle = 'rgba(255,224,102,0.7)'; ctx.beginPath();
      for (let j = 0; j < Math.min(cd.lit, i + 1); j++) circleSub(dx(j), 3, 12);
      ctx.fill();
    }
    ctx.beginPath();
    for (let j = 0; j <= i; j++) circleSub(dx(j), 3, j < cd.lit ? 9 : 8);
    ctx.fillStyle = FUR.base; ctx.fill(); ctx.strokeStyle = FUR.shadow; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath();
    for (let j = 0; j <= i; j++) circleSub(dx(j) - 2.5, 0.5, 2.2);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- snacks in flight, help, effects ----------
function drawFlyers() {
  for (const f of flyers) {
    if (f.mode === 'held') { ctx.fillStyle = 'rgba(59,53,80,0.14)'; ctx.beginPath(); ctx.ellipse(f.x + 3, f.y + 19, 10, 3.5, 0, 0, Math.PI * 2); ctx.fill(); }
    drawSnack(f.kind, f.x, f.y, f.s, f.rot, clamp(f.q, -0.3, 0.3), 0);
  }
}
function drawHelperHand() {
  if (!playing() || st.hint < 2 || held || incoming() > 0) return;                       // hidden while snacks fly
  const i = nearestSlot(MOUTH.x, MOUTH.y);
  if (i < 0) return;
  const [sx, sy] = SLOTS[i], k = (time % 1.6) / 1.6;
  ctx.fillStyle = '#FFFFFF';                                                              // dotted path into the mouth
  for (let j = 1; j <= 4; j++) {
    const u = j / 5, a = Math.sin(Math.PI * clamp(k * 2 - u, 0, 1));
    ctx.globalAlpha = 0.25 + 0.6 * a; ctx.beginPath();
    ctx.arc(lerp(sx, MOUTH.x, u), lerp(sy, MOUTH.y, u) - Math.sin(Math.PI * u) * 48, 2.5 + a, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const y = sy + 10 + Math.abs(Math.sin(time * 4)) * -6 * (reduced ? 0.4 : 1);
  ctx.save(); ctx.translate(sx + 12, y); ctx.rotate(-0.5);
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.5;
  roundRect(-4, -16, 8, 18, 4); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 6, 9, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawFx() {
  for (const r of rings) {
    const k = r.t / r.dur; ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r0, r.r1, easeOutCubic(k)), 0, Math.PI * 2); ctx.stroke();
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.fillStyle = p.color;
    if (p.shape === 'star') { starPath(p.x, p.y, p.size, p.size * 0.45, p.rot); ctx.fill(); }
    else if (p.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.shape === 'heart') { heartPath(p.x, p.y, p.size); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max), 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---------- chrome, start overlay, debug HUD (same as hatch_a_pet.html) ----------
function drawChrome() {
  ctx.fillStyle = TOK.cream; roundRect(6, 6, 44, 44, 14); ctx.fill();               // Home
  ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.moveTo(28, 15); ctx.lineTo(41, 27); ctx.lineTo(37, 27); ctx.lineTo(37, 39);
  ctx.lineTo(19, 39); ctx.lineTo(19, 27); ctx.lineTo(15, 27); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.45; ctx.fillStyle = TOK.cream; roundRect(270, 6, 44, 44, 14); ctx.fill();   // Mic (disabled)
  ctx.fillStyle = TOK.ink; roundRect(287, 14, 10, 18, 5); ctx.fill();
  ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(292, 25, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(292, 34); ctx.lineTo(292, 40); ctx.stroke(); ctx.globalAlpha = 1;
}
function drawStart() {
  ctx.fillStyle = 'rgba(30,34,69,0.35)'; ctx.fillRect(0, 0, W, H);
  const p = 1 + Math.sin(time * 3) * 0.04;
  ctx.save(); ctx.translate(160, 120); ctx.scale(p, p);
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fill();
  ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(18, 0); ctx.lineTo(-10, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}
let fps = 60, frameMs = 0;
function drawHud() {
  if (!debug) return;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(176, 214, 144, 26);
  ctx.fillStyle = parts.length > TOK.deviceMaxParticles ? '#FF9A92' : '#FFFFFF'; ctx.font = '8px monospace';
  ctx.fillText(`fps ${fps.toFixed(0)} draw ${frameMs.toFixed(1)}ms p ${parts.length}/${maxParticles}`, 180, 224);
  ctx.fillText(`seed ${seed} ${st.phase} N ${st.n} fed ${st.k} hint ${st.hint} ${reduced ? 'RM' : ''}`, 180, 235);
}
// One full frame of the game scene (the golden harness calls this directly).
function drawScene() {
  drawBackground();
  drawDecor();
  drawBowlBack(); drawBowlSnacks(); drawBowlFront();
  drawMunch();
  drawCards();
  drawBubble();
  drawFlyers();
  drawHelperHand(); drawFx(); drawChrome();
}

// Test hook for tools/quality_bar_golden/sketch_check.mjs (not ported): the logical point a helpful player taps next, or null.
function autoTarget() {
  if (!playing() || held || st.k + incoming() >= st.n) return null;
  const i = nearestSlot(MOUTH.x, MOUTH.y);
  return i < 0 ? null : { x: SLOTS[i][0], y: SLOTS[i][1] };
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); if (ac) musicTick();
  const t0 = performance.now();
  drawScene();
  if (st.phase === 'START') drawStart();
  frameMs = lerp(frameMs, performance.now() - t0, 0.1); fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
