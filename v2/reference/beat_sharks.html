<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Little Arcade v2 – reference sketch (Beat Sharks)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html (Color Pop) and
  hatch_a_pet.html. Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs,
  ellipses, bezier/quadratic curves, linear/radial gradients, globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene.
  The game is the music: there is no separate music bed. The 3 x 6 grid is the score, played by a
  look-ahead scheduler that follows a deterministic model step clock (see "sequencer" for the sync
  rule the port keeps). Audio nodes: sine oscillators (partials < 7.8 kHz), linear-attack /
  exponential-decay gains, exponential pitch glides, white noise through one biquad (clap, shaker,
  whoosh), the voice row's sample played at 0.75 / 1 / 1.5x (original built-in voices rendered
  procedurally into 16 kHz buffers), per-row voice stealing, one compressor. C major pentatonic.
  Rec is simulated: nothing is recorded. A gentle 3-dot countdown and a listening pose, then the
  take "captures" the next built-in voice (RAM only, forgotten on Home).
  All art is procedural and original; no external resources, no network, no storage, no mic.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap. URL ?seed=N.
  Hold Play for 1 s: the clear bubble pops and the starter beat comes back (let go earlier: no change).
-->
<style>
  html, body { margin: 0; height: 100%; background: #1E2245; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #note { position: fixed; left: 8px; bottom: 6px; color: #9DB8FA; font: 12px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Beat Sharks reference sketch"></canvas></div>
<div id="note">v2 reference sketch · Beat Sharks · 320×240 logical stage · D debug · R reduced motion · P particle cap · hold Play 1 s = clear</div>
<script>
'use strict';
// ---------- tokens (same subset as quality_bar.html) ----------
const W = 320, H = 240;
const TOK = {
  ink: '#3B3550', inkSoft: '#6F6888', paper: '#FFF8EC', cream: '#FFF3D6', creamLine: '#D9C7A3', creamLight: '#FFFBEF',
  hintGlow: '#FFE066', skyTop: '#BFE6FF', skyBot: '#EAF7FF', seaFar: '#93DAF2', seaFarLine: '#C4EEF9',
  squashPress: [1.12, 0.88], wiggleDeg: 6, wiggleMs: 360, glowPeriod: 0.9,
  idleVisualHint: 6, idleSpokenHint: 12, maxInputBlock: 0.3, holdMs: 0.35, clearHold: 1,
  springBouncy: { k: 380, c: 14 }, breathScale: 0.025, bob: 2, tapDebounce: 0.08,
  quick: 0.14, base: 0.22, gentle: 0.4, scene: 0.45, celebrate: 1.5,
  deviceMaxParticles: 96, webMaxParticles: 400,
};
// Rows, top to bottom. Each row has its own hue, body mark and lane icon: colour is never the only cue.
const ROWS = [
  { id: 'voice', base: '#F06BB8', shadow: '#B23E86', light: '#FBB6DC', mark: 'stars' },    // sings the voice sample
  { id: 'taps',  base: '#FF8A2A', shadow: '#C2621B', light: '#FFC07F', mark: 'stripes' },  // clap / woodblock / shaker
  { id: 'drums', base: '#8F5BE0', shadow: '#6236A6', light: '#C9AEF5', mark: 'spots' },    // boom / tom / bongo
];
const FINN = { base: '#93A9C9', shadow: '#566C8C', light: '#D6E1EE', tie: '#EF4B4F', tieShadow: '#B8323A' };   // band leader
const WHALE = { base: '#3A6FE8', shadow: '#2448A8', light: '#9DB8FA' };                                          // FULL_OCEAN guest
// Wave flats, back to front (theatre waves: each lane's sharks float behind their own flat).
const FLATS = [
  { body: '#6CCBEA', crest: '#A8E6F5', line: '#52B5DD' },
  { body: '#4FB4E4', crest: '#8FD6F2', line: '#3C9DD1' },
  { body: '#3A9CD8', crest: '#7CC7EE', line: '#2B85C0' },
];
// Grid: 3 rows x 6 steps. Visual cell {6+52c, 62+60r, 48, 52}; hit {4+52c, 58+60r, 52, 60}: no gaps.
const COLS = 6, ROWN = 3;
const colX = c => 30 + 52 * c;                       // cell centre x
const laneY = r => 98 + 60 * r;                      // wave crest of lane r (sharks float on it)
const SIZE_S = [0, 1, 0.8, 0.62];                    // 1 big, 2 medium, 3 small
const LEAP_H = [0, 14, 18, 22];                      // leap height: small sharks jump highest
const SPLASH_N = [0, 8, 6, 4];                       // splash drops: big sharks splash most
const LEAP_T = 0.42;                                 // leap time (shorter than the 6-step loop at 107 BPM)
const STARTER = [[2, 0, 1], [2, 3, 1]];              // [row, step, size]: booms on steps 1 and 4
const TEMPI = [60, 80, 107];                         // turtle / walker (crab) / rabbit, eighth-note steps
const stepDur = i => 30 / TEMPI[i];                  // 0.5 / 0.375 / 0.28 s
// Deterministic fill order used by the hints and the test hook: backbeat claps, voice on 1 and 4, ...
const ORDER = [[1, 1], [1, 4], [0, 0], [0, 3], [2, 5], [1, 2], [0, 5], [2, 2], [1, 0], [0, 2], [2, 1], [1, 3],
  [0, 1], [2, 4], [1, 5], [0, 4], [2, 0], [2, 3]];
const TEMPO_PLAN = [1, 2, 0];                        // test hook: tempo a helper picks as the lagoon fills
const BTN = { home: [0, 0, 56, 56], play: [60, 0, 56, 56], rec: [120, 0, 56, 56], tempo: [180, 0, 80, 56], mic: [264, 0, 56, 56] };
const PLAY_C = [88, 28], REC_C = [148, 28], TEMPO_C = [220, 28];
const TAKE = { dot: 0.4, listen: 1.2, max: 2.7, sing: 0.9 };   // simulated take: 3 dots, listen <= 1.5 s, sing
const INTRO_T = 2.4;

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- audio (Web Audio, C major pentatonic, conservative gain) ----------
let ac = null, master = null, voices = [], noiseBuf = null, voiceBufs = [], noiseAt = 0;
const PENT = [0, 2, 4, 7, 9];
function degFreq(deg, oct = 0) {
  const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5;
  return 523.25 * Math.pow(2, (PENT[i] + 12 * (o + oct)) / 12);
}
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
  noiseBuf = renderNoise(); voiceBufs = VOICES.map(renderVoice);
}
function voiceOk(len) {
  const now = ac.currentTime; voices = voices.filter(e => e > now);
  if (voices.length >= 8) return false;                        // cue voice limit (the score has its own pool)
  voices.push(now + len); return true;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
// Building blocks take an output node and an absolute start time, so one instrument definition serves
// both the tap preview (now) and the sequencer (a scheduled step time).
function tone(out, t, f0, f1, glideS, peak, attack, dur) {         // one sine with an optional exponential glide
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, attack, dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.04);
}
function hiss(out, t, type, f0, q, peak, attack, dur, f1 = f0) {   // white noise through one biquad
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const b = ac.createBiquadFilter(); b.type = type; b.Q.value = q;
  b.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) b.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain(); env(g, t, peak, attack, dur);
  s.connect(b); b.connect(g); g.connect(out);
  noiseAt = (noiseAt + 0.173) % 0.5;                             // deterministic read offset into the 2 s buffer
  s.start(t, noiseAt); s.stop(t + dur + 0.04);
}
function renderNoise() {                                         // 2 s of white noise from a fixed seed
  const n = 32000, b = ac.createBuffer(1, n, 16000), d = b.getChannelData(0), r = mulberry32(0xB5);
  for (let i = 0; i < n; i++) d[i] = r() * 2 - 1;
  return b;
}
// Built-in voices (original, procedural): a C4 glottal tone as harmonic sines weighted by three formant
// resonances that glide from a consonant onset into the vowel, then a gentle release. Rendered once into
// 16 kHz buffers; the voice row plays them at 0.75 / 1 / 1.5x = G3 / C4 / G4. Harmonics stay < 5 kHz, so
// 1.5x playback stays < 7.8 kHz. "doo" is the default; each take captures the next of the other three.
const VOICES = [
  { id: 'doo',  dur: 0.42, on: [[300, 1], [1700, 0.5], [2600, 0.15]], f: [[340, 1], [870, 0.42], [2400, 0.1]], bend: [1, 1], burst: 0.2, close: 0, mouth: 'oo' },
  { id: 'bah',  dur: 0.36, on: [[260, 0.6], [800, 0.4], [2300, 0.1]], f: [[850, 1], [1300, 0.7], [2800, 0.2]], bend: [1.03, 0.98], burst: 0.12, close: 0, mouth: 'ah' },
  { id: 'boop', dur: 0.4,  on: [[260, 0.6], [700, 0.4], [2300, 0.1]], f: [[380, 1], [1000, 0.5], [2500, 0.1]], bend: [0.95, 1.04], burst: 0.12, close: 1, mouth: 'oo' },
  { id: 'dee',  dur: 0.38, on: [[300, 1], [1900, 0.5], [2800, 0.2]], f: [[320, 1], [2500, 0.5], [3200, 0.28]], bend: [1, 1.02], burst: 0.2, close: 0, mouth: 'ee' },
];
function renderVoice(v, idx) {
  const sr = 16000, n = Math.round(v.dur * sr), buf = ac.createBuffer(1, n, sr), d = buf.getChannelData(0);
  let ph = 0, peak = 1e-6;
  for (let i = 0; i < n; i++) {
    const t = i / sr, k = clamp(t / 0.06, 0, 1);                  // consonant -> vowel over 60 ms
    const f0 = 261.63 * lerp(v.bend[0], v.bend[1], t / v.dur) * (1 + 0.01 * Math.sin(2 * Math.PI * 5.5 * t));
    ph += 2 * Math.PI * f0 / sr;
    let s = 0;
    for (let h = 1; h * f0 < 5000; h++) {
      let a = 0;
      for (let j = 0; j < 3; j++) {
        const F = lerp(v.on[j][0], v.f[j][0], k), x = (h * f0 - F) / (70 + 0.1 * F);
        a += lerp(v.on[j][1], v.f[j][1], k) / (1 + x * x);
      }
      s += a * Math.sin(h * ph) / Math.sqrt(h);
    }
    let e = Math.min(1, t / 0.015, (v.dur - t) / 0.12);           // attack 15 ms, release 120 ms
    if (v.close) e *= clamp((v.dur - 0.05 - t) / 0.06, 0, 1);       // lips close on the "p"
    d[i] = s * e; peak = Math.max(peak, Math.abs(d[i]));
  }
  const r = mulberry32(77 + idx);
  let lp = 0;
  for (let i = 0; i < n; i++) {
    const t = i / sr;
    lp += 0.6 * ((r() * 2 - 1) - lp);                             // softened noise for the consonants
    d[i] *= 0.8 / peak;
    if (t < 0.012) d[i] += lp * v.burst * (1 - t / 0.012);                      // "d" / "b" onset
    if (v.close && t > v.dur - 0.045 && t < v.dur - 0.03) d[i] += lp * 0.12;    // tiny "p" pop
    d[i] = clamp(d[i], -1, 1);
  }
  for (let i = 0; i < 80; i++) { d[i] *= i / 80; d[n - 1 - i] *= i / 80; }      // 5 ms edge fades: no clicks
  return buf;
}
// Drums row (big boom / medium tom / small bongo): glides that land on C pentatonic notes.
function boom(out, t, v) { tone(out, t, 196, 65.41, 0.09, 0.75 * v, 0.003, 0.2); tone(out, t, 392, 130.81, 0.07, 0.3 * v, 0.003, 0.12); }
function tom(out, t, v) { tone(out, t, 293.66, 196, 0.08, 0.6 * v, 0.003, 0.16); }
function bongo(out, t, v) { tone(out, t, 587.33, 523.25, 0.03, 0.42 * v, 0.003, 0.1); tone(out, t, 1567.98, 1567.98, 0, 0.06 * v, 0.002, 0.03); }
// Taps row (big clap / medium woodblock / small shaker).
function clap(out, t, v) { for (let i = 0; i < 3; i++) hiss(out, t + i * 0.011, 'bandpass', 1400, 1.1, (i < 2 ? 0.45 : 0.7) * v, 0.002, i < 2 ? 0.03 : 0.13); }
function wood(out, t, v) { tone(out, t, 1046.5, 1046.5, 0, 0.42 * v, 0.002, 0.11); tone(out, t, 3135.96, 3135.96, 0, 0.1 * v, 0.002, 0.035); }
function shaker(out, t, v) { hiss(out, t, 'bandpass', 5000, 1.4, 0.32 * v, 0.012, 0.06); hiss(out, t + 0.07, 'bandpass', 5000, 1.4, 0.2 * v, 0.006, 0.05); }
// Voice row: the voice sample at 0.75 / 1 / 1.5x (big = lowest).
function sing(out, t, v, rate, k) {
  const s = ac.createBufferSource(); s.buffer = voiceBufs[k]; s.playbackRate.value = rate;
  const g = ac.createGain(); g.gain.value = 0.8 * v;
  s.connect(g); g.connect(out); s.start(t);
}
const RATE = [0, 0.75, 1, 1.5], VEL = [0, 1, 0.85, 0.72];
const HIT_LEN = [[0, 0, 0, 0], [0, 0.17, 0.12, 0.13], [0, 0.2, 0.16, 0.1]];      // taps / drums, seconds
const hitLen = (r, size, k) => r === 0 ? VOICES[k].dur / RATE[size] : HIT_LEN[r][size];
function instrument(r, size, out, t, k) {
  if (r === 0) sing(out, t, VEL[size], RATE[size], k);
  else (r === 1 ? [clap, wood, shaker] : [boom, tom, bongo])[size - 1](out, t, VEL[size]);
}
// The score's own voice pool: one slot per row and the newest hit wins (a 6 ms fade steals the old one),
// so the score never takes cue voices and at most 3 step voices sound at once (plus fading tails).
const rowSlot = [null, null, null];
function rowOut(r, t, len) {
  const old = rowSlot[r];
  if (old && old.end > t) old.g.gain.setTargetAtTime(0, t, 0.006);
  const g = ac.createGain(); g.connect(master);
  rowSlot[r] = { g, end: t + len };
  return g;
}
function playStep(e, t) {
  for (let r = 0; r < ROWN; r++) if (e.sizes[r]) instrument(r, e.sizes[r], rowOut(r, t, hitLen(r, e.sizes[r], e.voice)), t, e.voice);
}
function silenceRows() {
  if (ac) for (const s of rowSlot) if (s) s.g.gain.setTargetAtTime(0, ac.currentTime, 0.01);
  rowSlot.fill(null);
}
// Cues (feedback) go through the 8-voice limit; taps <= 150 ms, celebrations <= 2 s.
const quiet = () => !!rec && rec.phase !== 'sing';    // countdown + listening: the speaker stays silent (no feedback)
const cue = len => !!ac && !quiet() && voiceOk(len);
function marimba(freq, when = 0, vel = 1, dur = 0.55) {
  if (!cue(dur)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.45 * vel, 0.003, dur);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 3.99;
  const g2 = ac.createGain(); env(g2, t, 0.18 * vel, 0.003, 0.09);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function glide(f0, f1, glideS, when, peak, dur) { if (cue(dur)) tone(master, ac.currentTime + when, f0, f1, glideS, peak, 0.003, dur); }
const plop = (when = 0, vel = 1, oct = 0) => glide(783.99 * Math.pow(2, oct), 261.63 * Math.pow(2, oct), 0.07, when, 0.32 * vel, 0.14);
function preview(r, size) { if (cue(hitLen(r, size, st.voice))) instrument(r, size, master, ac.currentTime + 0.003, st.voice); }
const playCue = () => glide(523.25, 783.99, 0.08, 0, 0.26, 0.14);           // rising C5 -> G5
const pauseCue = () => marimba(392, 0, 0.35, 0.14);                          // one soft G4
const tempoCue = i => marimba(degFreq(i * 2), 0, 0.4, 0.13);                 // C5 / E5 / A5: slow -> fast
const bloop = () => glide(392, 196, 0.08, 0, 0.22, 0.13);                    // a shark dives away (G4 -> G3)
const hintCue = () => { marimba(degFreq(2), 0, 0.32, 0.25); marimba(degFreq(3), 0.22, 0.32, 0.3); };   // neutral E5 G5
function captureCue(k) { plop(0, 0.8); if (cue(0.5)) sing(master, ac.currentTime + 0.12, 0.9, 1, k); }
function newSoundCue() { [0, 2, 4, 5].forEach((d, i) => marimba(degFreq(d), 0.6 + i * 0.08, 0.45, 0.3)); }
function whoosh() { if (cue(0.5)) hiss(master, ac.currentTime, 'lowpass', 2400, 0.8, 0.16, 0.04, 0.5, 300); plop(0.3, 0.7); plop(0.42, 0.6, 1); }
function waveWash() { if (cue(1.4)) hiss(master, ac.currentTime, 'lowpass', 700, 0.7, 0.025, 0.5, 1.4, 400); }
function fullOceanCue() {
  glide(130.81, 196, 0.35, 0, 0.32, 0.7);                                    // the whale says hello: C3 -> G3
  if (cue(0.8)) hiss(master, ac.currentTime + 0.35, 'lowpass', 1800, 0.8, 0.12, 0.05, 0.8, 500);   // spout
  [0, 1, 2, 3, 4, 5].forEach((d, i) => marimba(degFreq(d), 0.55 + i * 0.09, 0.42, 0.35));          // rainbow C5..C6
}

// ---------- sequencer: the grid is the score ----------
// Sync rule (the port keeps it): ONE deterministic model step clock, seq.t, advances by the frame dt
// while the band plays. Each step is committed LOOKAHEAD (0.12 s) early into seq.queue with a snapshot
// of its column (sizes and voice), so what is heard is exactly what is shown. seqTick() runs after
// update() every frame and maps model time to audio time through an anchor (audio time a0 = model time
// m0); it schedules each committed step at its exact audio time, so steps stay evenly spaced even when
// frames jitter. A step's visuals (fish, leaps, splashes, Finn's bob, tempo hop) fire when seq.t reaches
// the step time: picture and sound follow the same clock. If the anchor drifts by more than 30 ms (a
// long frame, a hidden tab) it re-anchors, and a step that is already late is dropped, never played in
// a burst. Tempo changes apply from the next committed step. Pause keeps the position; resume finishes
// the interrupted step. On the device the audio task owns the clock instead: it renders each committed
// step at its sample position and reports it, and the UI fires the same visuals from that queue entry.
const LOOKAHEAD = 0.12;
const seq = { t: 0, next: 0, nextAt: 0, queue: [], cur: COLS - 1, curAt: -9, curDur: stepDur(1), a0: 0, m0: 0, anchored: false };
const running = () => st.phase !== 'START' && st.playing && !rec;
function seqStart() {
  seq.queue.length = 0; seq.anchored = false;
  seq.nextAt = seq.t + clamp(seq.curAt + seq.curDur - seq.t, 0.06, 0.6);   // finish the interrupted step
}
function seqStop() {
  if (seq.queue.length) seq.next = seq.queue[0].step;              // the step the fish was swimming to
  seq.queue.length = 0; seq.anchored = false;
  silenceRows();
}
function seqUpdate(dt) {
  if (!running()) return;
  seq.t += dt;
  while (seq.nextAt <= seq.t + LOOKAHEAD) {
    const s = seq.next, d = stepDur(st.tempo);
    seq.queue.push({ step: s, at: seq.nextAt, dur: d, sizes: cells.map(row => row[s].size), voice: st.voice, sent: false });
    seq.nextAt += d; seq.next = (s + 1) % COLS;
  }
  while (seq.queue.length && seq.queue[0].at <= seq.t) fireStep(seq.queue.shift());
}
function seqTick() {                                               // audio scheduler (after update, every frame)
  if (!seq.queue.length) return;
  const now = ac.currentTime;
  if (ac.state !== 'running') { for (const e of seq.queue) e.sent = true; return; }   // no audio clock: skip, never burst
  if (!seq.anchored || Math.abs(seq.a0 + (seq.t - seq.m0) - now) > 0.03) { seq.a0 = now; seq.m0 = seq.t; seq.anchored = true; }
  for (const e of seq.queue) {
    if (e.sent) continue;
    e.sent = true;
    const t = seq.a0 + (e.at - seq.m0);
    if (t >= now - 0.02) playStep(e, Math.max(t, now));
  }
}

  }
  whalePath(); ctx.fillStyle = WHALE.base; ctx.fill();
  ctx.fillStyle = WHALE.light; ctx.beginPath(); ctx.ellipse(6, -17, 22, 4.5, -0.04, 0, 7); ctx.fill();
  whalePath(); ctx.strokeStyle = WHALE.shadow; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.ellipse(27, -6, 2.6, 3.2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(27.8, -7.2, 1, 0, 7); ctx.fill();
  ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(31, -1, 8, 0.15 * Math.PI, 0.55 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(239,75,79,0.35)'; ctx.beginPath(); ctx.ellipse(22, 3, 4, 2.4, 0, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- the take, the top-band controls ----------
function drawTake() {                                          // simulated take: 3 silent dots, then Finn listens
  if (!rec) return;
  if (rec.phase === 'count') {
    ctx.fillStyle = 'rgba(255,251,239,0.88)'; roundRect(122, 106, 76, 26, 13); ctx.fill();
    ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 1.5; ctx.stroke();
    if (rec.dots < 3) { ctx.fillStyle = TOK.creamLine; ctx.beginPath(); for (let i = rec.dots; i < 3; i++) dotTo(136 + i * 24, 119, 4.5); ctx.fill(); }
    if (rec.dots) {                                            // lit dots are bigger as well as red
      ctx.fillStyle = '#EF4B4F'; ctx.beginPath();
      for (let i = 0; i < rec.dots; i++) dotTo(136 + i * 24, 119, 7 * (reduced ? 1 : easeOutBack(clamp((rec.t - i * TAKE.dot) / 0.2, 0, 1))));
      ctx.fill();
    }
  } else if (rec.phase === 'listen') {
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {                              // sound flows into Finn's ear
      const k = reduced ? 0.25 + i * 0.25 : (time * 1.4 + i / 3) % 1;
      ctx.globalAlpha = Math.sin(k * Math.PI) * 0.9;
      ctx.beginPath(); ctx.arc(124, 176, 21 - 13 * k, 0.72 * Math.PI, 1.28 * Math.PI); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const n = Math.floor(clamp((rec.t - TAKE.listen) / (TAKE.max - TAKE.listen), 0, 1) * 12);   // how long it listens
    for (const [lit, col, rr] of [[true, '#EF4B4F', 2.4], [false, 'rgba(111,104,136,0.45)', 1.6]]) {
      ctx.fillStyle = col; ctx.beginPath();
      for (let i = 0; i < 12; i++) if ((i < n) === lit) { const a = -Math.PI / 2 + i * Math.PI / 6; dotTo(REC_C[0] + Math.cos(a) * 25.5, REC_C[1] + Math.sin(a) * 25.5, rr); }
      ctx.fill();
    }
  }
}
function btnXf(o, x, y) {                                      // button transform: hint wiggle + press squash
  ctx.translate(x, y);
  if (o.wig < TOK.wiggleMs / 1000 && !reduced) ctx.rotate(Math.sin(o.wig / (TOK.wiggleMs / 1000) * 6 * Math.PI) * TOK.wiggleDeg * Math.PI / 180);
  ctx.scale(1 - o.q, 1 + o.q);
}
function tempoIcon(i) {                                        // turtle / walking crab / rabbit (stroke then fill = outer outline)
  if (i === 0) {
    ctx.fillStyle = '#A6D13B'; ctx.strokeStyle = '#6E9A1F'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ellTo(-7, 5, 3.2, 2.4); ellTo(5, 5, 3.2, 2.4); dotTo(11, -1, 4.2); ctx.stroke(); ctx.fill();
    ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-12, 4); ctx.bezierCurveTo(-12, -13, 9, -13, 9, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1E8452'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#8EE0B4'; ctx.beginPath(); dotTo(-6, -1.5, 2.1); dotTo(1.5, -2, 2.1); dotTo(-2, -6.5, 1.6); ctx.fill();
    ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.arc(12.4, -2, 1.1, 0, 7); ctx.fill();
  } else if (i === 1) {
    ctx.strokeStyle = '#C2621B'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const s of [-1, 1]) {
      for (let k = 0; k < 3; k++) { ctx.moveTo(s * 5, 2 + k * 1.8); ctx.lineTo(s * (10 + k * 0.8), 5 + k * 2.4); }
      ctx.moveTo(s * 3, -3); ctx.lineTo(s * 4, -8); ctx.moveTo(s * 7, -1); ctx.lineTo(s * 10, -5);
    }
    ctx.stroke();
    ctx.fillStyle = '#FF8A2A'; ctx.lineWidth = 2.6; ctx.beginPath(); ellTo(0, 1.5, 8.5, 5.8); dotTo(-11, -7, 3.3); dotTo(11, -7, 3.3);
    ctx.stroke(); ctx.fill();
    ctx.fillStyle = TOK.cream; ctx.beginPath();                // pincer notches
    for (const s of [-1, 1]) { ctx.moveTo(s * 11, -7); ctx.lineTo(s * 12.4, -11.2); ctx.lineTo(s * 8.6, -10.6); ctx.closePath(); }
    ctx.fill();
    ctx.fillStyle = '#FFC07F'; ctx.beginPath(); ctx.ellipse(-2, -1.5, 4, 1.6, -0.15, 0, 7); ctx.fill();
    ctx.fillStyle = TOK.ink; ctx.beginPath(); dotTo(-4, -9, 1.7); dotTo(4, -9, 1.7); ctx.fill();
    ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 1.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  } else {
    ctx.strokeStyle = TOK.inkSoft; ctx.lineWidth = 1.4; ctx.beginPath();                 // speed lines
    ctx.moveTo(-19, -2); ctx.lineTo(-15, -2); ctx.moveTo(-20, 4); ctx.lineTo(-15.5, 4); ctx.stroke();
    ctx.fillStyle = '#C9AEF5'; ctx.strokeStyle = '#8F5BE0'; ctx.lineWidth = 2.6; ctx.beginPath();
    ellTo(-2, 3, 9, 5.8); dotTo(7, -2, 5); ellTo(4, -10, 2.3, 6, -0.3); ellTo(9.5, -10.5, 2.3, 6, 0.25); dotTo(-11, 1, 2.6);
    ctx.stroke(); ctx.fill();
    ctx.fillStyle = '#FBB6DC'; ctx.beginPath(); ellTo(4.2, -10.5, 1, 3.8, -0.3); ellTo(9.6, -11, 1, 3.8, 0.25); ctx.fill();   // inner ears
    ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.arc(8.6, -3, 1.2, 0, 7); ctx.fill();
  }
}
function drawButtons() {
  const m = reduced ? 0 : 1;
  ctx.save(); btnXf(btn.play, PLAY_C[0], PLAY_C[1]);                                    // Play / pause
  if (st.phase === 'PLAY' && st.hint >= 1 && !rec && hintTarget() === 'play') {
    ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 4; ctx.globalAlpha = 0.4 + 0.4 * Math.sin(time * 2 * Math.PI / TOK.glowPeriod);
    ctx.beginPath(); ctx.arc(0, 0, 25, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill(); ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 2; ctx.stroke();
  if (st.playing) { ctx.fillStyle = TOK.ink; ctx.beginPath(); rrTo(-8, -9, 6, 18, 2.5); rrTo(2, -9, 6, 18, 2.5); ctx.fill(); }
  else {
    const p = 1 + Math.sin(time * 4) * 0.06 * m; ctx.scale(p, p);
    ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(11, 0); ctx.lineTo(-6, 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1E8452'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  }
  ctx.restore();
  ctx.save(); btnXf(btn.rec, REC_C[0], REC_C[1]);                                       // Rec: a red dot
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill(); ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 2; ctx.stroke();
  const rr = 9.5 + (rec && rec.phase !== 'sing' ? Math.sin(time * 2 * Math.PI) * 1.5 * m : 0);   // 1 Hz pulse during a take
  ctx.fillStyle = '#EF4B4F'; ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.fill(); ctx.strokeStyle = '#B8323A'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.ellipse(-3.2, -3.4, 2.6, 1.6, -0.6, 0, 7); ctx.fill();
  ctx.restore();
  ctx.save(); btnXf(btn.tempo, TEMPO_C[0], TEMPO_C[1]);                                 // Tempo: animal + level bars
  ctx.fillStyle = TOK.cream; roundRect(-34, -22, 68, 44, 14); ctx.fill(); ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 2; ctx.stroke();
  const hop = running() ? Math.sin(clamp(btn.hop / 0.16, 0, 1) * Math.PI) * 2.5 * m : 0;   // the animal steps with the beat
  ctx.save(); ctx.translate(-9, 3 - hop); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; tempoIcon(st.tempo); ctx.restore();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); for (let i = 0; i <= st.tempo; i++) rrTo(17 + i * 5.5, 9 - (5 + i * 4), 4, 5 + i * 4, 1.5); ctx.fill();
  if (st.tempo < 2) { ctx.fillStyle = TOK.creamLine; ctx.beginPath(); for (let i = st.tempo + 1; i < 3; i++) rrTo(17 + i * 5.5, 9 - (5 + i * 4), 4, 5 + i * 4, 1.5); ctx.fill(); }
  ctx.restore();
}
function drawHoldBubble() {                                    // holding Play: the clear bubble inflates, pops at 1 s
  if (!hold.on || hold.t < TOK.holdMs) return;
  const k = clamp((hold.t - TOK.holdMs) / (TOK.clearHold - TOK.holdMs), 0, 1), [x, y] = PLAY_C;
  const r = lerp(24, 28, easeOutCubic(k)) + Math.sin(time * 9) * 0.5 * (reduced ? 0 : 1);
  ctx.fillStyle = `rgba(169,219,251,${(0.25 + 0.35 * k).toFixed(3)})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ellTo(x - r * 0.45, y - r * 0.5, r * 0.22, r * 0.11, -0.6); dotTo(x + r * 0.5, y + r * 0.42, r * 0.07); ctx.fill();
}
function drawHelperHand() {                                    // hint 2 (12 s idle): the helper hand points at the next thing
  if (st.phase !== 'PLAY' || st.hint < 2 || rec) return;
  const h = hintTarget(); if (!h) return;
  const [tx, ty] = h === 'play' ? [PLAY_C[0] + 10, PLAY_C[1] + 22] : [colX(h[1]) + 10, laneY(h[0]) + 8];
  ctx.save(); ctx.translate(tx, ty + Math.abs(Math.sin(time * 4)) * -6 * (reduced ? 0 : 1)); ctx.rotate(-0.5);
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.5;
  roundRect(-4, -16, 8, 18, 4); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 6, 9, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ---------- fx, chrome, start, HUD ----------
function drawFx() {
  for (const r of rings) {
    const k = r.t / r.dur, rr = lerp(r.r0, r.r1, easeOutCubic(k));
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * r.sy, 0, 0, 7); ctx.stroke();
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.fillStyle = p.color;
    if (p.shape === 'star') { starPath(p.x, p.y, p.size, p.size * 0.45, p.rot); ctx.fill(); }
    else if (p.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.shape === 'note') { notePath(p.x, p.y, p.size); ctx.fill(); }
    else if (p.shape === 'ring') { ctx.strokeStyle = p.color; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawChrome() {
  ctx.fillStyle = TOK.cream; roundRect(6, 6, 44, 44, 14); ctx.fill();               // Home
  ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.moveTo(28, 15); ctx.lineTo(41, 27); ctx.lineTo(37, 27); ctx.lineTo(37, 39);
  ctx.lineTo(19, 39); ctx.lineTo(19, 27); ctx.lineTo(15, 27); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.45; ctx.fillStyle = TOK.cream; roundRect(270, 6, 44, 44, 14); ctx.fill();   // Mic (disabled)
  ctx.fillStyle = TOK.ink; roundRect(287, 14, 10, 18, 5); ctx.fill();
  ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(292, 25, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(292, 34); ctx.lineTo(292, 40); ctx.stroke(); ctx.globalAlpha = 1;
}
function drawStart() {
  ctx.fillStyle = 'rgba(30,34,69,0.35)'; ctx.fillRect(0, 0, W, H);
  const p = 1 + Math.sin(time * 3) * 0.04;
  ctx.save(); ctx.translate(160, 120); ctx.scale(p, p);
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fill();
  ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(18, 0); ctx.lineTo(-10, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}
let fps = 60, frameMs = 0;
function drawHud() {
  if (!debug) return;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(96, 214, 224, 26);
  ctx.fillStyle = parts.length > TOK.deviceMaxParticles ? '#FF9A92' : '#FFFFFF'; ctx.font = '8px monospace';
  ctx.fillText(`fps ${fps.toFixed(0)} draw ${frameMs.toFixed(1)}ms p ${parts.length}/${maxParticles} seed ${seed}`, 100, 224);
  ctx.fillText(`${st.phase}${rec ? '/' + rec.phase : ''} ${TEMPI[st.tempo]}bpm step ${seq.cur + 1} ${st.playing ? 'play' : 'stop'} hint ${st.hint} ${VOICES[st.voice].id} ${reduced ? 'RM' : ''}`, 100, 235);
}
// One full frame of the game scene (the golden harness calls this directly). Back to front: sky and
// island, then each lane's sharks behind their own wave flat (Finn and the whale surface behind the front
// flat), lane icons, the playhead light and fish, the take, effects, controls, the helper hand, chrome.
function drawScene() {
  drawBackground();
  drawSky();
  for (let r = 0; r < ROWN; r++) {
    drawLane(r);
    if (r === ROWN - 1) { drawWhale(); drawFinn(); }
    drawFlat(r); drawLaneFront(r);
  }
  drawColumnLight(); drawLaneIcons(); drawFish(); drawTake(); drawFx();
  drawButtons(); drawHoldBubble(); drawHelperHand(); drawChrome();
}

// Test hook for tools/quality_bar_golden/sketch_check.mjs (not ported): the logical point a helpful player taps next, or null.
function autoTarget() {
  if (st.phase === 'START') return null;
  if (st.phase === 'INTRO') return { x: 160, y: 150 };                     // any tap skips the intro
  if (rec) return { x: REC_C[0], y: REC_C[1] };                            // skip the dots, then finish the take
  if (!st.playing) return { x: PLAY_C[0], y: PLAY_C[1] };
  let filled = 0, sum = 0;
  for (const row of cells) for (const o of row) { if (o.size) filled++; sum += o.size; }
  if (!st.takes && filled >= 6) return { x: REC_C[0], y: REC_C[1] };       // once the band has a groove, record
  if (st.tempo !== TEMPO_PLAN[Math.floor(filled / 6) % 3]) return { x: TEMPO_C[0], y: TEMPO_C[1] };
  for (const [r, c] of ORDER) if (!cells[r][c].size) return { x: colX(c), y: laneY(r) - 10 };
  const [r, c] = ORDER[sum % ORDER.length];                                // full: keep cycling sizes
  return { x: colX(c), y: laneY(r) - 10 };
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); if (ac) seqTick();
  const t0 = performance.now();
  drawScene();
  if (st.phase === 'START') drawStart();
  frameMs = lerp(frameMs, performance.now() - t0, 0.1); fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
