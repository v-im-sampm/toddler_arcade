<title>Little Arcade v2 – reference sketch (Animal Sounds)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html and hatch_a_pet.html.
  Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs, ellipses,
  bezier/quadratic curves, linear/radial gradients, globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene: animals hide behind bushes,
  barn half doors and pond water purely by draw order (back layer, animal, front occluder).
  Audio nodes: sine oscillators (additive partials), linear-attack/exponential-decay gains,
  exponential pitch glides, sine LFOs on gain or frequency, white noise through one biquad,
  an original looping farm tune (ukulele plucks + soft whistle, A major pentatonic, 90 BPM)
  on its own small voice pool that ducks under the cues, one compressor.
  The eight animal calls are original synthesized voices: no recordings, no speech.
  All art is procedural and original; no external resources, no network, no storage, no mic.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap,
        M = mute (audio-off mode: the horn badge shows the hidden animal's silhouette).
  URL ?seed=N.
-->

<script>

const HAB = {
  BUSH: { occ: 42, max: 66, out: 46, hint: 5, auto: 10 },
  POND: { occ: 56, max: 72, out: 56, hint: 6, auto: 10 },
  BARN: { occ: 61, max: 80, out: 77, hint: 5, auto: 10 },

const BADGE = [132, 4, 56, 56];                          // replay horn (doc §3.3)
const PARADE = { y: 210, gap: 46, speed: 272, s: 1 };    // farm parade: feet line, spacing, px/s, scale

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- audio (Web Audio, A major pentatonic, conservative gain) ----------
let ac = null, master = null, voices = [], muted = false, noiseBuf = null;
const PENT = [0, 2, 4, 7, 9];
function degFreq(deg, oct = 0) {                          // deg 0 = A4; A B C# E F#
  const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5;
  return 440 * Math.pow(2, (PENT[i] + 12 * (o + oct)) / 12);

function initAudio() {

  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(muted ? 0 : 0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);           // 1 s of white noise, fixed seed
  const d = noiseBuf.getChannelData(0), nr = mulberry32(99);
  for (let i = 0; i < d.length; i++) d[i] = nr() * 2 - 1;
}
function setMuted(on) {                                   // M key: audio-off mode (the badge shows a silhouette)
  muted = on;
  if (!ac) return;
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(on ? 0 : 0.35, ac.currentTime, 0.05);
}
function voiceOk(len, prio = false) {
  const now = ac.currentTime; voices = voices.filter(e => e > now);
  if (voices.length >= 8) {                               // voice limit; an animal call steals the oldest voice
    if (!prio) return false;
    voices.sort((a, b) => a - b); voices.shift();
  }
  voices.push(now + len); duckMusic(now, len); return true;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
// Sustained voice (calls, whistle): linear attack, gentle sag to 60 %, short exponential release.
function env2(g, t, peak, attack, dur) {
  const rel = Math.min(0.08, dur * 0.4);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(peak * 0.6, t + dur - rel);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
// Ukulele-like pluck: sine plus fast-decaying octave and twelfth partials.
function pluck(freq, when = 0, vel = 1, dur = 0.4) {
  if (!ac || !voiceOk(when + dur)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.36 * vel, 0.003, dur); g.connect(master);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq; o1.connect(g);
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
  const g2 = ac.createGain(); env(g2, t, 0.22 * vel, 0.002, Math.min(dur, 0.1)); o2.connect(g2); g2.connect(g);
  const o3 = ac.createOscillator(); o3.type = 'sine'; o3.frequency.value = freq * 3;
  const g3 = ac.createGain(); env(g3, t, 0.1 * vel, 0.002, Math.min(dur, 0.05)); o3.connect(g3); g3.connect(g);
  for (const o of [o1, o2, o3]) { o.start(t); o.stop(t + dur + 0.05); }
}
// Pitched sine with an exponential glide (plop, plip and the woodblock use this voice).
function glide(f0, f1, glideS, when, peak, dur) {
  if (!ac || !voiceOk(when + dur)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, 0.003, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.04);
}
const plop = (when = 0, vel = 1, hi = 1) => glide(760 * hi, 230 * hi, 0.07, when, 0.35 * vel, 0.14);
// Woodblock knock: short body with a slight pitch drop plus a bright inharmonic tick.
function woodblock(freq, when = 0, vel = 1) {
  glide(freq, freq * 0.92, 0.05, when, 0.42 * vel, 0.12);
  glide(freq * 2.76, freq * 2.76, 0.01, when, 0.14 * vel, 0.04);

// White noise through one biquad (snort, woof breath, leaf rustle, water).
function noiseBurst(t, type, freq, len, peak, dst = master) {
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const bq = ac.createBiquadFilter(); bq.type = type; bq.frequency.value = freq; bq.Q.value = type === 'bandpass' ? 1.2 : 0.7;
  const g = ac.createGain(); env(g, t, peak, 0.01, len);
  src.connect(bq); bq.connect(g); g.connect(dst); src.start(t); src.stop(t + len + 0.05);
}
// ---------- animal calls (original synthesized voices; glide end points are A major pentatonic degrees) ----------
// Syllable: t start (s), d length, f glide degrees [start, (peak,) end], m peak point (fraction of d), h partial gains,
// a attack, v peak gain, vib [Hz, depth as a fraction of f], trem [Hz, depth], nz [filter, Hz, length, peak].
const CALLS = [
  [{ t: 0, d: 0.9, f: [-7, -5, -7], m: 0.35, h: [1, 0.55, 0.3, 0.15], a: 0.08, v: 0.34, vib: [5, 0.012] }],             // COW moo
  [{ t: 0, d: 0.16, f: [-1, -3], h: [1, 0.8, 0.6, 0.45, 0.3], a: 0.01, v: 0.3 },                                      // DUCK quack
   { t: 0.24, d: 0.16, f: [-1, -3], h: [1, 0.8, 0.6, 0.45, 0.3], a: 0.01, v: 0.3 }],                                  //      quack
  [{ t: 0, d: 0.75, f: [-2, -3], h: [1, 0.6, 0.35, 0.2], a: 0.03, v: 0.32, trem: [9, 0.6] }],                        // SHEEP baa
  [{ t: 0, d: 0.18, f: [-4, -2, -3], m: 0.4, h: [1, 0.7, 0.5], a: 0.01, v: 0.3, nz: ['lowpass', 900, 0.14, 0.12] },  // PIG oink
   { t: 0.26, d: 0.18, f: [-4, -2, -3], m: 0.4, h: [1, 0.7, 0.5], a: 0.01, v: 0.3, nz: ['lowpass', 900, 0.14, 0.12] }],
  [{ t: 0, d: 0.14, f: [-3, -2, -5], m: 0.3, h: [1, 0.5, 0.3], a: 0.008, v: 0.34, nz: ['bandpass', 800, 0.1, 0.14] }, // DOG woof
   { t: 0.28, d: 0.14, f: [-3, -2, -5], m: 0.3, h: [1, 0.5, 0.3], a: 0.008, v: 0.34, nz: ['bandpass', 800, 0.1, 0.14] }],
  [{ t: 0, d: 0.6, f: [1, 3, 1], m: 0.45, h: [1, 0.35, 0.15], a: 0.05, v: 0.26, vib: [6, 0.015] }],                  // CAT meow
  [{ t: 0, d: 0.13, f: [-5, -4, -5], m: 0.5, h: [1, 0.6, 0.4, 0.2], a: 0.01, v: 0.34, trem: [28, 0.85] },            // FROG rib-
   { t: 0.2, d: 0.12, f: [-3, -4], h: [1, 0.6, 0.4, 0.2], a: 0.01, v: 0.34, trem: [28, 0.85] }],                     //      bit
  [{ t: 0, d: 0.34, f: [-2, -3], h: [1, 0.08], a: 0.06, v: 0.3, nz: ['bandpass', 1200, 0.2, 0.03] },                 // OWL hoo
   { t: 0.5, d: 0.18, f: [-2, -3], h: [1, 0.08], a: 0.04, v: 0.26 },                                                 //     hoo-
   { t: 0.74, d: 0.32, f: [-2, -3], h: [1, 0.08], a: 0.05, v: 0.28 }],                                               //     hoo
];
function syllable(s, t0, bus) {
  const t = t0 + s.t, end = t + s.d + 0.05, f = s.f.map(d => degFreq(d)), sum = s.h.reduce((a, b) => a + b, 0);
  const out = ac.createGain(); env2(out, t, s.v, s.a, s.d); out.connect(bus);
  let dst = out, vib = null;
  if (s.trem) {                                           // tremolo: sine LFO on a series gain (1 - depth/2 ± depth/2)
    const tg = ac.createGain(); tg.gain.value = 1 - s.trem[1] / 2; tg.connect(out); dst = tg;
    const l = ac.createOscillator(); l.type = 'sine'; l.frequency.value = s.trem[0];
    const lg = ac.createGain(); lg.gain.value = s.trem[1] / 2; l.connect(lg); lg.connect(tg.gain); l.start(t); l.stop(end);
  }
  if (s.vib) { vib = ac.createOscillator(); vib.type = 'sine'; vib.frequency.value = s.vib[0]; vib.start(t); vib.stop(end); }
  s.h.forEach((hg, n) => {                                // additive partials, each gliding with the fundamental
    const m = n + 1, o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f[0] * m, t);
    if (f.length > 2) o.frequency.exponentialRampToValueAtTime(f[1] * m, t + s.d * s.m);
    o.frequency.exponentialRampToValueAtTime(f[f.length - 1] * m, t + s.d);
    if (vib) { const vg = ac.createGain(); vg.gain.value = f[0] * m * s.vib[1]; vib.connect(vg); vg.connect(o.frequency); }

}
const callSyl = (k, short) => short ? [{ ...CALLS[k][0], d: Math.min(0.32, CALLS[k][0].d) }] : CALLS[k];
const callLen = (k, short = false) => Math.max(...callSyl(k, short).map(s => s.t + s.d));
let calls = [];                                           // live calls: one bus each, so a new pick can hush them
function playCall(k, when = 0, short = false) {           // a whole call is one cue voice (short = parade)
  if (!ac || !voiceOk(when + callLen(k, short), true)) return;
  const t = ac.currentTime + when, bus = ac.createGain(); bus.connect(master);
  for (const s of callSyl(k, short)) syllable(s, t, bus);
  calls = calls.filter(c => c.end > ac.currentTime); calls.push({ bus, end: t + callLen(k, short) });
}
function hushCalls() {                                    // only one animal speaks at a time (30 ms fade)
  if (!ac) return;
  const now = ac.currentTime;
  for (const c of calls) if (c.end > now) { c.bus.gain.cancelScheduledValues(now); c.bus.gain.setTargetAtTime(0, now, 0.03); }

function callEnv(k, u, short = false) {                   // 0..1 loudness of a call u s after its start (mouth, horn)
  let e = 0;
  for (const s of callSyl(k, short)) {
    const x = u - s.t, rel = Math.min(0.08, s.d * 0.4);
    if (x < 0 || x > s.d) continue;
    e = Math.max(e, x < s.a ? x / s.a : x < s.d - rel ? Math.pow(0.6, (x - s.a) / (s.d - rel - s.a))

// ---------- farm tune (original; A major pentatonic, 4/4 at 90 bpm, 8 bars = 21.3 s loop) ----------
// Ukulele plucks: bass on beats 1 and 3, a soft three-string strum on beats 2 and 4; a soft whistle on top.
const TUNE = { spb: 60 / 90, beats: 32, voices: 6,
  chords: [[-2, 0, 2], [-1, 0, 2], [-2, 0, 2], [-2, 0, 1], [-2, 0, 2], [-1, 0, 2], [-2, 0, 1], [-2, 0, 2]],  // A F#m A Esus A F#m Esus A
  bass: [0, -1, 0, -2, 0, -1, -2, 0],
  melody: [[0, 2, 1], [1, 3, 1], [2, 4, 2], [4, 3, 1.5], [5.5, 2, 0.5], [6, 0, 2], [8, 1, 1], [9, 2, 1], [10, 3, 1],
           [11, 2, 1], [12, 1, 3], [16, 3, 1], [17, 5, 1], [18, 4, 1], [19, 3, 1], [20, 2, 1.5], [21.5, 3, 0.5],

// Events in time order: [beat, freq, peak, attack, dur, kind]; kind 0 = pluck, 1 = whistle.
const SONG = [];

SONG.sort((a, b) => a[0] - b[0] || b[2] - a[2]);
let music = null, musicBus = null, duck = null, duckUntil = 0, musicVoices = [];
function startMusic() {
  if (!ac) return;
  if (!musicBus) { musicBus = ac.createGain(); duck = ac.createGain(); musicBus.connect(duck); duck.connect(master); }
  const now = ac.currentTime;
  musicBus.gain.cancelScheduledValues(now); musicBus.gain.setValueAtTime(0, now);
  musicBus.gain.setTargetAtTime(1, now + 0.5, 1.5);                // gentle fade-in, never a loud start

}

  if (!music) return;
  musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(0, ac.currentTime, 0.15);

}
function musicVoiceOk(t, len) {                                    // own pool: never takes cue voices
  musicVoices = musicVoices.filter(e => e > t);

    env2(g, t, peak, attack, dur);

    const lg = ac.createGain(); lg.gain.value = freq * 0.006; l.connect(lg); lg.connect(o.frequency);

    const g2 = ac.createGain(); env(g2, t, peak * 0.5, attack, dur * 0.3);

}

// ---------- animals (body centre 0,0, radius ~21, feet at y = +21; drawn at AS inside a hiding place) ----------
// ey/sp/er: eye height, half spacing, radius; mx/my/mr: mouth (mr 0 = the bill or beak is the mouth).
const FACES = [
  { ey: -6, sp: 8, er: 4.8, mx: 0, my: 13, mr: 3.4 },    // COW
  { ey: -6, sp: 8, er: 5, mx: 0, my: 6, mr: 0 },         // DUCK
  { ey: -3, sp: 5.5, er: 4, mx: 0, my: 10.5, mr: 2.8 },  // SHEEP
  { ey: -8, sp: 8, er: 4.6, mx: 0, my: 14, mr: 3.2 },    // PIG
  { ey: -6, sp: 8, er: 4.8, mx: 0, my: 11, mr: 3.4 },    // DOG
  { ey: -5, sp: 8, er: 5, mx: 0, my: 10, mr: 3.2 },      // CAT
  { ey: -14, sp: 10, er: 5.5, mx: 0, my: 5, mr: 6 },     // FROG
  { ey: -7, sp: 7.5, er: 5.4, mx: 0, my: 0, mr: 0 },     // OWL
];
let flat = false;                                         // silhouette mode (audio-off badge): ink shapes, white details
function bodyGrad(c, r) {
  const g = ctx.createRadialGradient(-10, -12, 4, 0, 0, r);
  g.addColorStop(0, c.light); g.addColorStop(0.55, c.base); g.addColorStop(1, c.shadow);
  return g;
}
function finishBody(c, r, g) {
  if (flat) { ctx.fillStyle = TOK.ink; ctx.fill(); return; }
  ctx.fillStyle = g || bodyGrad(c, r); ctx.fill();
  ctx.strokeStyle = c.shadow; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
}
function paint(fill, line, w = 2) {                       // silhouette part: fill (+ darker outline)
  ctx.fillStyle = flat ? TOK.ink : fill; ctx.fill();
  if (line && !flat) { ctx.strokeStyle = line; ctx.lineWidth = w; ctx.stroke(); }
}
function detail(fill, line, w = 1.5) {                    // inner feature: white line art in silhouette mode
  if (flat) { ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.6; ctx.stroke(); return; }
  ctx.fillStyle = fill; ctx.fill();
  if (line) { ctx.strokeStyle = line; ctx.lineWidth = w; ctx.stroke(); }
}
function shine(x, y) {
  if (flat) return;
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(x, y, 5, 3, -0.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 6, y - 4, 1.3, 0, TAU); ctx.fill();
}
// Face: eyes follow `look`, blink, rosy cheeks; the mouth opens with the call envelope mo (0..1).
function face(f, look, blink, mo, happy) {
  const ln = Math.hypot(look[0], look[1]) || 1, lx = look[0] / ln * f.er * 0.35, ly = look[1] / ln * f.er * 0.35;
  ctx.lineCap = 'round';
  if (flat) { ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); circ(-f.sp, f.ey, f.er * 0.55); circ(f.sp, f.ey, f.er * 0.55); ctx.fill(); return; }
  if (happy || blink < 0) {
    ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2.2; ctx.beginPath();
    for (const s of [-1, 1]) {
      const ex = s * f.sp, r = f.er * 0.75;
      if (happy) { ctx.moveTo(ex + Math.cos(1.15 * Math.PI) * r, f.ey + 2 + Math.sin(1.15 * Math.PI) * r); ctx.arc(ex, f.ey + 2, r, 1.15 * Math.PI, 1.85 * Math.PI); }
      else { ctx.moveTo(ex - f.er * 0.7, f.ey); ctx.lineTo(ex + f.er * 0.7, f.ey); }

    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); circ(-f.sp, f.ey, f.er); circ(f.sp, f.ey, f.er); ctx.fill();
    ctx.strokeStyle = 'rgba(59,53,80,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = TOK.ink; ctx.beginPath(); circ(-f.sp + lx, f.ey + ly, f.er * 0.5); circ(f.sp + lx, f.ey + ly, f.er * 0.5); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath();
    circ(-f.sp + lx - f.er * 0.18, f.ey + ly - f.er * 0.2, f.er * 0.17); circ(f.sp + lx - f.er * 0.18, f.ey + ly - f.er * 0.2, f.er * 0.17); ctx.fill();
  }

    ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.ellipse(f.mx, f.my + 1, f.mr * (0.7 + 0.3 * mo), f.mr * (0.3 + 0.9 * mo), 0, 0, TAU); ctx.fill();
    if (mo > 0.35) { ctx.fillStyle = HUE.pink.base; ctx.beginPath(); ctx.ellipse(f.mx, f.my + 1 + f.mr * 0.55 * mo, f.mr * 0.5, f.mr * 0.3 * mo, 0, 0, TAU); ctx.fill(); }
  } else { ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.mx, f.my - 2, happy ? f.mr * 1.3 : f.mr, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
}
function drawPaw(k, c) {                                  // friendly wave: right arm (or wing) swings up and out at ~1.4 Hz

  else if (k === 4) {                                                // DOG: wagging tail, floppy ears, eye patch, muzzle
    ctx.save(); ctx.translate(16, 9); ctx.rotate(-0.4 + Math.sin(time * 11) * 0.35 * m);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(10, -1, 12, -11);
    ctx.strokeStyle = flat ? TOK.ink : c.shadow; ctx.lineWidth = 6.5; ctx.stroke();
    if (!flat) { ctx.strokeStyle = c.base; ctx.lineWidth = 3.5; ctx.stroke(); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); finishBody(c, 21);
    shine(-10, -13);
    if (!flat) { ctx.beginPath(); circ(8, -6, 7.5); paint(c.light); }
    ctx.beginPath(); ell(-18, -3, 6, 12, 0.3); ell(18, -3, 6, 12, -0.3); paint(c.shadow, '#5E3B22');
    ctx.beginPath(); ctx.ellipse(0, 8, 10, 7, 0, 0, TAU); detail(c.light, c.shadow);
    ctx.beginPath(); ctx.ellipse(0, 4, 3.8, 2.8, 0, 0, TAU); paint(TOK.ink);
    if (!flat) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); circ(-1.2, 3, 1); ctx.fill(); }
    face(f, look, blink, mo, happy);
  } else if (k === 5) {                                                // CAT: pointy ears, striped forehead, whiskers, tail
    ctx.save(); ctx.translate(-16, 10); ctx.rotate(Math.sin(time * 2.2) * 0.15 * m);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-14, -2, -11, -20);
    ctx.strokeStyle = flat ? TOK.ink : c.shadow; ctx.lineWidth = 6.5; ctx.stroke();
    if (!flat) { ctx.strokeStyle = c.base; ctx.lineWidth = 3.5; ctx.stroke(); }
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(-5, -19); ctx.lineTo(-15, -30); ctx.lineTo(-20, -10); ctx.closePath();
    ctx.moveTo(5, -19); ctx.lineTo(15, -30); ctx.lineTo(20, -10); ctx.closePath(); paint(c.base, c.shadow);
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); finishBody(c, 21);
    if (!flat) {
      ctx.beginPath(); ctx.moveTo(-9, -20.5); ctx.lineTo(-14.5, -27); ctx.lineTo(-17, -15.5); ctx.closePath();
      ctx.moveTo(9, -20.5); ctx.lineTo(14.5, -27); ctx.lineTo(17, -15.5); ctx.closePath(); paint(HUE.pink.light);
      ctx.strokeStyle = c.shadow; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(-5, -18); ctx.lineTo(-4, -13); ctx.moveTo(0, -20); ctx.lineTo(0, -14); ctx.moveTo(5, -18); ctx.lineTo(4, -13); ctx.stroke();
      ctx.beginPath(); circ(-4, 7, 5); circ(4, 7, 5); paint(HUE.cream.light);
    }
    shine(-12, -9);
    ctx.strokeStyle = flat ? '#FFFFFF' : TOK.inkSoft; ctx.lineWidth = 1; ctx.beginPath();
    for (const s of [-1, 1]) { ctx.moveTo(s * 8, 6); ctx.lineTo(s * 24, 3); ctx.moveTo(s * 8, 9); ctx.lineTo(s * 23, 11); }
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2.5, 3); ctx.lineTo(2.5, 3); ctx.lineTo(0, 5.5); ctx.closePath(); paint(HUE.pink.base);
    face(f, look, blink, mo, happy);
  } else if (k === 6) {                                                // FROG: eye bumps, wide body, belly, throat pouch
    const g = flat ? null : bodyGrad(c, 26);
    ctx.beginPath(); circ(-10, -14, 9); circ(10, -14, 9); finishBody(c, 26, g);
    ctx.beginPath(); ctx.ellipse(0, 3, 24, 18, 0, 0, TAU); finishBody(c, 26, g);
    if (!flat) {
      ctx.beginPath(); ctx.ellipse(0, 11, 14, 7.5, 0, 0, TAU); paint(c.light);
      ctx.beginPath(); circ(-17, 1, 2.6); circ(18, 5, 2.2); circ(-11, 6, 1.6); circ(14, -3, 1.6); paint('rgba(30,132,82,0.5)');
      if (mo > 0.05) { ctx.beginPath(); ctx.ellipse(0, 12 + 3 * mo, 4 + 6 * mo, 3 + 5 * mo, 0, 0, TAU); paint(HUE.green.light, c.shadow, 1.5); }
    }
    shine(-14, -3);
    face(f, look, blink, mo, happy);
  } else {                                                             // OWL: ear tufts, face discs, chevron belly, beak
    ctx.beginPath(); ctx.moveTo(-4, -18); ctx.lineTo(-15, -30); ctx.lineTo(-17, -12); ctx.closePath();
    ctx.moveTo(4, -18); ctx.lineTo(15, -30); ctx.lineTo(17, -12); ctx.closePath(); paint(c.base, c.shadow);
    ctx.beginPath(); ell(-17, 6, 7, 12, 0.35); if (!wave) ell(17, 6, 7, 12, -0.35); paint(c.shadow, '#4A2880');
    ctx.beginPath(); ctx.ellipse(0, -1, 20, 22, 0, 0, TAU); finishBody(c, 24);
    ctx.beginPath(); circ(-7.5, -7, 8.5); circ(7.5, -7, 8.5); detail(c.light);
    ctx.beginPath(); ctx.ellipse(0, 11, 11, 8, 0, 0, TAU); detail(HUE.cream.base, c.light, 1);
    if (!flat) {
      ctx.strokeStyle = c.base; ctx.lineWidth = 1.5; ctx.beginPath();
      for (const [x, y] of [[-5, 9], [5, 9], [0, 14]]) { ctx.moveTo(x - 2.5, y - 1.5); ctx.lineTo(x, y + 1); ctx.lineTo(x + 2.5, y - 1.5); }
      ctx.stroke();
    }
    shine(-13, 4);
    face(f, look, blink, mo, happy);
    const o = mo * 3;                                                  // the beak is the mouth: the lower half drops
    if (o > 0.3 && !flat) { ctx.beginPath(); ctx.ellipse(0, 1.5 + o * 0.5, 2.4, 0.8 + o * 0.6, 0, 0, TAU); paint(TOK.ink); }
    ctx.beginPath(); ctx.moveTo(-2.6, 2 + o * 0.5); ctx.lineTo(2.6, 2 + o * 0.5); ctx.lineTo(0, 5 + o); ctx.closePath(); detail(HUE.orange.base, HUE.orange.shadow, 1);
    ctx.beginPath(); ctx.moveTo(-3.5, -3); ctx.lineTo(3.5, -3); ctx.lineTo(0, 3); ctx.closePath(); detail(HUE.yellow.base, HUE.orange.shadow, 1);
  }
  if (wave) drawPaw(k, c);
}

// ---------- hiding spots with their animals, and the farm parade ----------
function spotScale(s) {                                   // pop-in (easeOutBack, 0.3 s) and shrink-out at the end of a round
  if (s.appear < 0) return 0;
  const a = Math.min(1, s.appear / 0.3), k = reduced ? easeOutCubic(a) : easeOutBack(a);
  return s.leave < 0 ? k : k * (1 - easeOutCubic(Math.min(1, s.leave / 0.3)));
}
function drawSpotAnimal(s, feet) {
  const f = FACES[s.k], m = reduced ? 0.3 : 1;
  let rot = 0, hop = 0;
  const u = s.wig / (TOK.wiggleMs / 1000);                // hint wiggle: 3 cycles of ±6° in 360 ms, decaying
  if (u < 1) rot += Math.sin(u * 6 * Math.PI) * TOK.wiggleDeg * Math.PI / 180 * (1 - u) * m;
  if (s.mode === 'WIN' && !reduced) { rot += Math.sin(s.mt * TAU * 1.1) * 0.12; hop = Math.abs(Math.sin(s.mt * Math.PI * 2.2)) * (s.slot < 3 ? 2 : 5); }
  const br = 1 + Math.sin(s.ph * TAU / (2.4 + (s.k % 5) * 0.2)) * TOK.breathScale * m;   // breathe 2.4-3.2 s
  const bob = s.mode === 'PEEK' ? Math.sin(s.ph * 1.7) * 0.8 * m : 0;
  const q = s.q * m;
  const hx = s.x + 48, hy = s.y + feet + (f.ey - 21) * AS;   // eyes follow the last touch; cheering friends watch the winner
  let tx = look[0], ty = look[1];
  if (s.mode === 'CHEER') { const w = spots.find(o => o.mode === 'WIN'); if (w) { tx = w.x + 48; ty = w.y + 30; } }
  let mo = callEnv(s.k, time - s.call);                   // the mouth opens with its own call...
  if (s.k === st.target && hintLevel() === 2) mo = Math.max(mo, callEnv(badge.callK, time - badge.callAt));  // ...or the mystery call (auto-help)
  const done = s.mt > 0.12 + callLen(s.k);
  ctx.save(); ctx.translate(48, feet - hop + bob); ctx.rotate(rot);
  ctx.scale(AS * (1 - q), AS * (1 + q) * br); ctx.translate(0, -21);
  drawAnimal(s.k, mo, [tx - hx, ty - hy], s.blink, s.mode === 'WIN' && done, s.mode === 'OUT' && done);
  ctx.restore();
}
function drawSpot(s) {
  const k = spotScale(s); if (k <= 0.001) return;
  const lv = s.k === st.target ? hintLevel() : 0, feet = peekY(s.k) - s.lift;
  ctx.save(); ctx.translate(s.x + 48, s.y + 78); ctx.scale(k, k); ctx.translate(-48, -78);
  const g = s.hab === 'POND' ? pondWater() : null;
  if (s.hab === 'BUSH') drawBushBack(); else if (s.hab === 'POND') drawPondBack(g); else drawBarnBack();
  const p = 0.5 + 0.5 * Math.sin(time * TAU / TOK.glowPeriod), hy = feet - 21 * AS;
  if (lv > 0) {                                           // hint: warm glow behind the hidden friend
    const gg = ctx.createRadialGradient(48, hy, 4, 48, hy, 36);
    gg.addColorStop(0, `rgba(255,224,102,${((lv === 2 ? 0.8 : 0.6) * (0.65 + 0.35 * p)).toFixed(3)})`); gg.addColorStop(1, 'rgba(255,224,102,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(48, hy, 36, 0, TAU); ctx.fill();
  }
  drawSpotAnimal(s, feet);
  if (lv > 0) {                                           // ...and a pulsing halo (a shape cue, not colour only)
    ctx.globalAlpha = 0.45 + 0.4 * p; ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(48, hy, 27 + 2 * p, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (s.hab === 'BUSH') drawBushFront(s); else if (s.hab === 'POND') drawPondFront(s, g); else drawBarnFront(s);
  ctx.restore();
}
function drawSpots() { for (const s of spots) drawSpot(s); }
function drawParade() {                                   // found friends hop left to right, each calling on its beat
  for (const p of paraders) {
    const x = -30 - p.i * PARADE.gap + st.t * PARADE.speed;
    if (x < -40 || x > W + 40) continue;
    shadowEll(x, PARADE.y + 1, 18 - p.hop * 0.8, 3.5);
    const q = p.q * (reduced ? 0.3 : 1);
    ctx.save(); ctx.translate(x, PARADE.y - p.hop); ctx.scale(PARADE.s * (1 - q), PARADE.s * (1 + q)); ctx.translate(0, -21);
    drawAnimal(p.k, callEnv(p.k, time - p.call, true), [1, 0.2], p.blink, false, false);
    ctx.restore();
  }
}

// ---------- effects, helper hand, chrome, replay badge ----------
function drawFx() {
  ctx.lineCap = 'round';
  for (const r of rings) {
    const k = r.t / r.dur; ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r0, r.r1, easeOutCubic(k)), 0, TAU); ctx.stroke();
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.fillStyle = p.color;
    if (p.shape === 'star') { starPath(p.x, p.y, p.size, p.size * 0.45, p.rot); ctx.fill(); }
    else if (p.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.shape === 'heart') { heartPath(p.x, p.y, p.size); ctx.fill(); }
    else if (p.shape === 'leaf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); leafPath(p.size); ctx.fill(); ctx.restore(); }
    else if (p.shape === 'bubble') { ctx.strokeStyle = p.color; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke(); }
    else if (p.shape === 'note') {                        // eighth note: head, stem, flag
      const s = p.size;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, s * 0.5, s * 0.36, -0.4, 0, TAU);
      ctx.moveTo(p.x + s * 0.32, p.y - s * 1.5); ctx.quadraticCurveTo(p.x + s * 1.1, p.y - s * 1.2, p.x + s * 0.9, p.y - s * 0.6);
      ctx.lineTo(p.x + s * 0.32, p.y - s * 1.05); ctx.closePath(); ctx.fill();
      ctx.fillRect(p.x + s * 0.32, p.y - s * 1.5, 1.4, s * 1.5);
    }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max), 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawHelperHand() {                               // auto-help: a bobbing hand points at the right hiding place
  if (hintLevel() !== 2) return;
  const s = spots.find(o => o.k === st.target && o.leave < 0); if (!s) return;
  const y = s.y + 62 + Math.abs(Math.sin(time * 4)) * -6 * (reduced ? 0.3 : 1);
  ctx.save(); ctx.translate(s.x + 70, y); ctx.rotate(-0.5);
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.5;
  roundRect(-4, -16, 8, 18, 4); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 6, 9, 8, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawChrome() {
  ctx.fillStyle = TOK.cream; roundRect(6, 6, 44, 44, 14); ctx.fill();               // Home
  ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.moveTo(28, 15); ctx.lineTo(41, 27); ctx.lineTo(37, 27); ctx.lineTo(37, 39);
  ctx.lineTo(19, 39); ctx.lineTo(19, 27); ctx.lineTo(15, 27); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.45; ctx.fillStyle = TOK.cream; roundRect(270, 6, 44, 44, 14); ctx.fill();   // Mic (disabled)
  ctx.fillStyle = TOK.ink; roundRect(287, 14, 10, 18, 5); ctx.fill();
  ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(292, 25, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(292, 34); ctx.lineTo(292, 40); ctx.stroke(); ctx.globalAlpha = 1;
}
function drawHorn(e) {                                    // brass speaker-horn; wiggles and swells with the mystery call (e 0..1)
  const m = reduced ? 0.3 : 1;
  ctx.save(); ctx.translate(-3, 0); ctx.rotate(Math.sin(time * 18) * 0.12 * e * m); ctx.scale(1 + 0.15 * e, 1 + 0.15 * e);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = HUE.sky.shadow; ctx.lineWidth = 2; ctx.globalAlpha = 0.3 + 0.6 * e; ctx.beginPath();   // sound arcs
  ctx.moveTo(9 + 9 * Math.cos(-0.6), 9 * Math.sin(-0.6)); ctx.arc(9, 0, 9, -0.6, 0.6);
  ctx.moveTo(9 + 14 * Math.cos(-0.6), 14 * Math.sin(-0.6)); ctx.arc(9, 0, 14, -0.6, 0.6); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.moveTo(-15, -3); ctx.lineTo(-4, -3); ctx.lineTo(7, -12); ctx.lineTo(7, 12); ctx.lineTo(-4, 3); ctx.lineTo(-15, 3); ctx.closePath();
  ctx.fillStyle = HUE.yellow.base; ctx.fill(); ctx.strokeStyle = HUE.yellow.shadow; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(7, 0, 3.5, 12, 0, 0, TAU); ctx.fillStyle = HUE.yellow.light; ctx.fill(); ctx.stroke();   // bell rim
  ctx.beginPath(); circ(-16, 0, 3.5); ctx.fillStyle = HUE.yellow.shadow; ctx.fill();                                     // mouthpiece
  ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.beginPath(); ctx.ellipse(-1, -3.5, 4, 1.2, -0.55, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawBadge() {
  if (st.phase === 'START' || st.phase === 'INTRO') return;
  const bob = Math.sin(time * 2.2) * 1.5 * (reduced ? 0.3 : 1);
  const press = 1 + clamp(-badge.sv * 0.012, -0.1, 0.12);
  const e = badge.callAt > -9 ? callEnv(badge.callK, time - badge.callAt) : 0;
  ctx.save(); ctx.translate(160, 32 + bob); ctx.scale(press, 2 - press);
  if (hintLevel() > 0 || (st.spoken && choosing())) {    // "listen again here"
    ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 4; ctx.globalAlpha = 0.4 + 0.4 * Math.sin(time * TAU / TOK.glowPeriod);
    ctx.beginPath(); ctx.arc(0, 0, 29, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 2; ctx.stroke();
  if (badge.heart > 0) { ctx.fillStyle = HUE.pink.base; heartPath(0, 2, 13); ctx.fill(); ctx.strokeStyle = HUE.pink.shadow; ctx.lineWidth = 1.5; ctx.stroke(); }
  else if (badge.happy > 0 && badge.happyK >= 0) {        // the friend just found, smiling
    ctx.save(); ctx.translate(0, 3); ctx.scale(0.6, 0.6); drawAnimal(badge.happyK, 0, [0, 1], 1, true, false); ctx.restore();
  } else if (muted) {                                      // audio-off mode: the hidden friend's silhouette (doc §6)
    const w = Math.sin(time * 18) * 0.1 * e * (reduced ? 0.3 : 1), k = 0.6 * (1 + 0.1 * e);
    ctx.save(); ctx.translate(0, 3); ctx.rotate(w); ctx.scale(k, k);
    flat = true; drawAnimal(st.target, 0, [0, 1], 1, false, false); flat = false; ctx.restore();
    ctx.save(); ctx.translate(20, 19);                                                                   // muted-speaker pip
    ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = TOK.inkSoft; ctx.beginPath();
    ctx.moveTo(-5, -1.6); ctx.lineTo(-2.8, -1.6); ctx.lineTo(-0.2, -4); ctx.lineTo(-0.2, 4); ctx.lineTo(-2.8, 1.6); ctx.lineTo(-5, 1.6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = TOK.inkSoft; ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(1.8, -2.6); ctx.lineTo(5, 2.6); ctx.stroke(); ctx.restore();
  } else drawHorn(e);
  ctx.restore();
}

function drawStart() {
  ctx.fillStyle = 'rgba(30,34,69,0.35)'; ctx.fillRect(0, 0, W, H);
  const p = 1 + Math.sin(time * 3) * 0.04;
  ctx.save(); ctx.translate(160, 120); ctx.scale(p, p);
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 36, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(18, 0); ctx.lineTo(-10, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}
let fps = 60, frameMs = 0;
function drawHud() {
  if (!debug) return;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(150, 203, 170, 37);
  ctx.fillStyle = parts.length > TOK.deviceMaxParticles ? '#FF9A92' : '#FFFFFF'; ctx.font = '8px monospace';
  ctx.fillText(`fps ${fps.toFixed(0)} draw ${frameMs.toFixed(1)}ms p ${parts.length}/${maxParticles}`, 154, 213);
  ctx.fillText(`seed ${seed} ${st.phase} r${st.round} spots ${st.count} miss ${st.misses} found ${st.successes}`, 154, 224);
  ctx.fillText(`hint ${hintLevel()} idle ${st.idle.toFixed(1)} ${ANIMALS[st.target].name}${muted ? ' MUTE' : ''}${reduced ? ' RM' : ''}`, 154, 235);
}
// One full frame of the game scene (the golden harness calls this directly).
function drawScene() {
  drawBackground();                                       // static layer (device: restored from the backdrop buffer)
  drawAmbient();
  drawSpots();
  drawParade();
  drawHelperHand(); drawFx(); drawBadge(); drawChrome();
}

// Test hook for tools/quality_bar_golden/sketch_check.mjs (not ported): the logical point a helpful player taps next, or null.
function autoTarget() {
  if (st.phase !== 'PLAY' && st.phase !== 'HINT' && st.phase !== 'AUTO_HELP') return null;
  const s = spots.find(o => o.k === st.target && o.leave < 0 && o.appear >= 0);
  return s ? { x: s.x + 48, y: s.y + 44 } : null;
}

// ---------- loop ----------
attract();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); if (ac) musicTick();
  const t0 = performance.now();
  drawScene();
  if (st.phase === 'START') drawStart();
  frameMs = lerp(frameMs, performance.now() - t0, 0.1); fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
