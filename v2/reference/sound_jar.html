<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Little Arcade v2 – reference sketch (Sound Jar)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html (Color Pop).
  Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs, ellipses,
  bezier/quadratic curves, linear/radial gradients, globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene.
  Audio nodes: sine oscillators, linear-attack/exponential-decay gains, exponential pitch
  glides, one compressor. The child is the music: there is no music bed, only a sparse,
  deterministic cave-drip ambience on its own small voice pool that ducks under cues and
  under the jar's voice and stops on Home.
  Sampler DSP (game-intrinsic, games/sound_jar.md §2): 16 kHz AudioBuffer playback with a
  rate change per pad and a detune bend, a reversed copy (Backwards), one 250 ms delay with
  0.45 feedback (Echo), a 55 Hz sine ring modulator (Robot), a 6 Hz sine vibrato LFO of
  ±1.5 semitones (Wobble), and one noise buffer through one biquad for the bin whoosh.
  NO MICROPHONE in this sketch: a "recording" replays one of four original built-in takes
  synthesised at load (sines with formant-like partials and envelopes) in a seeded rotation;
  every 4th take is a whisper that is too quiet and gets the friendly retry. Before any
  recording the jar holds a built-in frog sound, so the pads always play.
  All art is procedural and original; no external resources, no network, no storage.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap. URL ?seed=N.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1E2245; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #note { position: fixed; left: 8px; bottom: 6px; color: #9DB8FA; font: 12px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Sound Jar reference sketch"></canvas></div>
<div id="note">v2 reference sketch · Sound Jar · 320×240 logical stage · no microphone (built-in takes) · D debug · R reduced motion · P particle cap</div>
<script>
'use strict';
// ---------- tokens (same subset as quality_bar.html) ----------
const W = 320, H = 240;
const TOK = {
  ink: '#3B3550', inkSoft: '#6F6888', paper: '#FFF8EC', cream: '#FFF3D6', creamLine: '#D9C7A3', hintGlow: '#FFE066',
  caveTop: '#383B78', caveBot: '#20234F', crystalA: '#5A5D9A', crystalB: '#444783', caveFloor: '#171A3D',
  rock: '#2B2E66', rockTop: '#3A3D80', rockRim: '#5A5D9A', rockDark: '#1D2049',
  squashPress: [1.12, 0.88], wiggleDeg: 6, wiggleMs: 360, glowPeriod: 0.9,
  idleVisualHint: 6, idleSpokenHint: 12, maxInputBlock: 0.3,
  springBouncy: { k: 380, c: 14 }, breathScale: 0.025, bob: 2, tapDebounce: 0.08,
  holdLoop: 0.35, dragDeadZone: 12, pxPerSemitone: 8, maxBend: 5,
  deviceMaxParticles: 96, webMaxParticles: 400,
};
// tokens.json hue triples: [light, base, shadow].
const HUE = {
  red: ['#FF9A92', '#EF4B4F', '#B8323A'], yellow: ['#FFEB9C', '#FFD23F', '#C99A0E'],
  green: ['#8EE0B4', '#2DB26E', '#1E8452'], teal: ['#8FE3DE', '#21B3B0', '#127A7D'],
  sky: ['#A9DBFB', '#4FB0F0', '#2B79B8'], blue: ['#9DB8FA', '#3A6FE8', '#2448A8'],
  purple: ['#C9AEF5', '#8F5BE0', '#6236A6'], pink: ['#FBB6DC', '#F06BB8', '#B23E86'],
  brown: ['#DDB892', '#B07A4F', '#7A4E2D'], cream: ['#FFFBEF', '#FFF3D6', '#D9C7A3'],
};
// Pads: biggest = lowest. Pitch, shape, colour and size all differ (colour is never the only cue).
const PADS = [
  { st: -12, shape: 'circle', hue: HUE.purple, s: 1.00 },
  { st: -5, shape: 'square', hue: HUE.blue, s: 0.90 },
  { st: 0, shape: 'triangle', hue: HUE.teal, s: 0.81 },
  { st: 7, shape: 'heart', hue: HUE.pink, s: 0.73 },
  { st: 12, shape: 'star', hue: HUE.yellow, s: 0.66 },
];
// Effect toggles in the top band between Home and Mic (hit 48×48 centred on (x, FX_Y)).
const FX = [
  { id: 'back', hue: HUE.sky, x: 82 }, { id: 'echo', hue: HUE.teal, x: 134 },
  { id: 'robot', hue: HUE.blue, x: 186 }, { id: 'wobble', hue: HUE.green, x: 238 },
];
const BACK = 0, ECHO = 1, ROBOT = 2, WOBBLE = 3;
// Stage geometry (logical px). Doc boxes: jar {112,60,96,96}, record {232,96,72,72}, bin {16,96,56,56},
// pads 64×72 hit boxes on y 168-240.
const JAR = { x: 160, y: 120, a: 44, b: 36, n: 2.6, hit: [112, 60, 96, 96] };   // body centre + superellipse
const LID = { x: 160, y: 70, restX: 102, restY: 128, restA: -1.25 };           // closed pose, resting pose
const REC = { x: 268, y: 128, r: 28, hit: [232, 96, 72, 72] };
const BIN = { x: 44, y: 128, hit: [16, 96, 56, 56] };
const LEDGE = 157;                                   // jar, bin and record button stand on the rock ledge
const PAD_FOOT = 232, PAD_R = 27;                    // pads stand on the cave floor; hit {64i, 168, 64, 72}
const FX_Y = 30, FX_R = 21;
const padX = i => 32 + 64 * i, padY = i => PAD_FOOT - PAD_R * PADS[i].s;

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- built-in takes (no microphone in this sketch) ----------
// Original voices synthesised once at load into 16 kHz Float32Arrays: harmonics of a gliding f0 shaped by
// three formant peaks (Lorentzian), linear attack / cosine release, optional AM (the frog's "rrr"),
// vibrato and a little deterministic breath noise; every partial stays below 7 kHz.
// raw = the level the "recording" arrives at (drives the mist and the too-quiet test, doc §2: a take is too
// quiet if its sustained level < 512 or it lasts < 150 ms); pcm = the processed clip the pads play
// (trimmed, normalised to -6 dBFS = peak 0.5, 5 ms fades). Takes are rooted on D (pads follow the root).
const SR = 16000, FRAME = 0.02, LOUD = 512 / 32768, ACTIVE = 0.002;
const VOW = {                                         // [F1, a1, F2, a2, F3, a3]: child-like formants
  a: [1000, 1, 1650, 0.6, 3100, 0.25], o: [620, 1, 1050, 0.6, 2800, 0.15], u: [430, 1, 1100, 0.45, 2700, 0.15],
  i: [420, 1, 2900, 0.5, 3700, 0.3], e: [620, 1, 2400, 0.5, 3300, 0.25], r: [380, 1, 950, 0.7, 2100, 0.2],
};
// syllables: [start s, length s, f0 from, f0 to (0 = unvoiced breath), vowel from, vowel to, options]
const TAKES = [
  { name: 'FROG', hue: HUE.green, mote: 'bubble', peak: 0.5, syl: [            // built-in: "rib-bit"
    [0.00, 0.20, 150, 132, 'r', 'o', { am: [32, 0.75], att: 0.012, rel: 0.05 }],
    [0.27, 0.15, 140, 176, 'e', 'i', { am: [28, 0.5], att: 0.008, rel: 0.05, burst: 0.3 }]] },
  { name: 'BADOO', hue: HUE.pink, mote: 'heart', peak: 0.42, syl: [            // "ba-doo!"
    [0.00, 0.24, 300, 330, 'a', 'a', { burst: 0.5, att: 0.015, rel: 0.05 }],
    [0.30, 0.36, 345, 290, 'o', 'u', { burst: 0.3, att: 0.02, rel: 0.12, vib: 25 }]] },
  { name: 'WHEE', hue: HUE.yellow, mote: 'star', peak: 0.5, syl: [             // "wheee!"
    [0.00, 0.10, 0, 0, 'u', 'u', { breath: 1, att: 0.03, rel: 0.05 }],
    [0.06, 0.72, 294, 588, 'u', 'i', { att: 0.06, rel: 0.16, vib: 30, breath: 0.1 }]] },
  { name: 'GIGGLE', hue: HUE.sky, mote: 'dot', peak: 0.38, syl: [0, 1, 2, 3].map(k =>   // "hee-hee-hee-hee"
    [k * 0.16, k === 3 ? 0.13 : 0.1, 520 - k * 20, 480 - k * 25, 'i', 'e', { breath: 0.35, att: 0.008, rel: 0.04 }]) },
  { name: 'WHISPER', hue: HUE.cream, mote: 'dot', peak: 0.011, syl: [          // "psst... hi" (too quiet)
    [0.00, 0.34, 0, 0, 'i', 'i', { breath: 1, att: 0.05, rel: 0.1 }],
    [0.44, 0.24, 0, 0, 'i', 'i', { breath: 1, att: 0.04, rel: 0.1 }]] },
];
const FROG = 0, WHISPER = 4;
function formantGain(f, va, vb, u) {
  let g = 0;
  for (let j = 0; j < 6; j += 2) {
    const F = lerp(va[j], vb[j], u), x = (f - F) / (80 + 0.08 * F);
    g += lerp(va[j + 1], vb[j + 1], u) / (1 + x * x);
  }
  return g;
}
function renderTake(tk) {
  const n = Math.ceil((Math.max(...tk.syl.map(s => s[0] + s[1])) + 0.04) * SR);
  const raw = new Float32Array(n), nz = mulberry32(99), amps = new Float32Array(64);
  for (const [t0, d, fa, fb, va, vb, o] of tk.syl) {
    const i0 = Math.round(t0 * SR), len = Math.round(d * SR), A = VOW[va], B = VOW[vb];
    let ph = 0, l1 = 0, l2 = 0;
    for (let k = 0; k < len && i0 + k < n; k++) {
      const u = k / len, tt = k / SR;
      let e = Math.min(1, tt / o.att) * (tt > d - o.rel ? 0.5 + 0.5 * Math.cos(Math.PI * (tt - d + o.rel) / o.rel) : 1);
      if (o.am) e *= 1 - o.am[1] * (0.5 + 0.5 * Math.cos(2 * Math.PI * o.am[0] * tt));
      let v = 0;
      if (fa > 0) {
        const vib = o.vib ? Math.pow(2, o.vib * Math.sin(2 * Math.PI * 5.5 * tt) * Math.min(1, tt * 4) / 1200) : 1;
        const f0 = fa * Math.pow(fb / fa, u) * vib;
        if ((k & 31) === 0) {                                     // control rate: harmonic amplitudes
          const K = Math.min(63, Math.floor(7000 / f0));
          for (let h = 1; h < 64; h++) amps[h] = h <= K ? formantGain(h * f0, A, B, u) / Math.pow(h, 0.35) : 0;
        }
        ph += 2 * Math.PI * f0 / SR; if (ph > 2 * Math.PI) ph -= 2 * Math.PI;
        const c2 = 2 * Math.cos(ph); let s0 = 0, s1 = Math.sin(ph);    // sin(h·ph) by the Chebyshev recurrence
        for (let h = 1; h < 64 && amps[h] > 0; h++) { v += amps[h] * s1; const s2 = c2 * s1 - s0; s0 = s1; s1 = s2; }
      }
      const w = nz() * 2 - 1; l1 += 0.85 * (w - l1); l2 += 0.45 * (l1 - l2);   // hiss band ~1.5-4.8 kHz
      const burst = o.burst && tt < 0.02 ? o.burst * 6 * (1 - tt / 0.02) : 0;
      raw[i0 + k] += v * e + (l1 - l2) * ((o.breath || 0) * e + burst) * 2;
    }
  }
  let pk = 0; for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(raw[i]));
  const kr = tk.peak / (pk || 1); for (let i = 0; i < n; i++) raw[i] *= kr;
  const lev = [], fl = SR * FRAME;                                   // 20 ms RMS level envelope
  for (let i = 0; i < n; i += fl) {
    let s = 0, c = 0; for (let j = i; j < Math.min(n, i + fl); j++) { s += raw[j] * raw[j]; c++; }
    lev.push(Math.sqrt(s / c));
  }
  const kp = 0.5 / tk.peak, fade = SR * 0.005, pcm = new Float32Array(n);
  for (let i = 0; i < n; i++) pcm[i] = raw[i] * kp * Math.min(1, i / fade, (n - 1 - i) / fade);
  tk.lev = lev; tk.playLev = lev.map(x => x * kp); tk.pcm = pcm; tk.dur = n / SR;
}
TAKES.forEach(renderTake);

// ---------- audio (Web Audio, D major pentatonic, conservative gain) ----------
let ac = null, master = null, voices = [];
const PENT = [0, 2, 4, 7, 9];
const ROOT = 293.66;                                  // D4: the takes' root; pad i sounds at ROOT·2^(st/12)
function degFreq(deg, oct = 0) {
  const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5;
  return 587.33 * Math.pow(2, (PENT[i] + 12 * (o + oct)) / 12);
}
// Sampler bus (game-intrinsic DSP, doc §5):
//   voice (rate + detune) -> sIn -> dry -------------------------------> sOut -> master
//                                \-> ring mod (gain driven by a 55 Hz sine) -> wet -/
//   sOut -> echo send -> delay 250 ms <-> feedback 0.45 -> master        (y = x + 0.45·y(t - 250 ms))
//   wobble: one 6 Hz sine LFO -> depth (0 or 150 cents) -> every voice's detune
let sIn = null, sDry = null, sWet = null, sOut = null, echoSend = null, wobDepth = null, noiseBuf = null;
const BUF = [];                                       // per take: [forward, reversed] 16 kHz AudioBuffers
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
  sIn = ac.createGain(); sDry = ac.createGain(); sWet = ac.createGain(); sOut = ac.createGain();
  const ringMul = ac.createGain(); ringMul.gain.value = 0;
  const ringOsc = ac.createOscillator(); ringOsc.type = 'sine'; ringOsc.frequency.value = 55;
  ringOsc.connect(ringMul.gain); ringOsc.start();
  sWet.gain.value = 0;
  sIn.connect(sDry); sDry.connect(sOut); sIn.connect(ringMul); ringMul.connect(sWet); sWet.connect(sOut);
  sOut.connect(master);
  echoSend = ac.createGain(); echoSend.gain.value = 0;
  const delay = ac.createDelay(1); delay.delayTime.value = 0.25;
  const fb = ac.createGain(); fb.gain.value = 0.45;
  sOut.connect(echoSend); echoSend.connect(delay); delay.connect(fb); fb.connect(delay); fb.connect(master);
  const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 6;
  wobDepth = ac.createGain(); wobDepth.gain.value = 0; lfo.connect(wobDepth); lfo.start();
  for (const tk of TAKES) {
    const n = tk.pcm.length, f = ac.createBuffer(1, n, SR), r = ac.createBuffer(1, n, SR);
    const fd = f.getChannelData(0), rd = r.getChannelData(0);
    for (let i = 0; i < n; i++) { fd[i] = tk.pcm[i]; rd[n - 1 - i] = tk.pcm[i]; }
    BUF.push([f, r]);
  }
  noiseBuf = ac.createBuffer(1, SR / 2, SR);
  const nd = noiseBuf.getChannelData(0), nr = mulberry32(5);
  for (let i = 0; i < nd.length; i++) nd[i] = nr() * 2 - 1;
  applyFx();
}
function voiceOk(len) {
  if (st.phase === 'RECORDING') return false;                  // the speaker stays silent while recording
  const now = ac.currentTime; voices = voices.filter(e => e > now);
  if (voices.length >= 8) return false;                        // voice limit
  voices.push(now + len); duckMusic(now, len); return true;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function marimba(freq, when = 0, vel = 1, dur = 0.55) {
  if (!ac || !voiceOk(dur)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.45 * vel, 0.003, dur);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  o1.connect(g); g.connect(master); o1.start(t); o1.stop(t + dur + 0.05);
  if (freq * 3.99 < 7600) {                                    // bright partial only while it stays < 7.8 kHz
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 3.99;
    const g2 = ac.createGain(); env(g2, t, 0.18 * vel, 0.003, 0.09);
    o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + dur + 0.05);
  }
}
// Pitched sine with an exponential glide (plop, chirp, pop, hum all use this voice).
function glide(f0, f1, glideS, when, peak, dur, attack = 0.003) {
  if (!ac || !voiceOk(dur)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, attack, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.04);
}
const plop = (when = 0, vel = 1, hi = 1) => glide(760 * hi, 230 * hi, 0.07, when, 0.35 * vel, 0.14);
function woodblock(freq, when = 0, vel = 1) {
  glide(freq, freq * 0.92, 0.05, when, 0.42 * vel, 0.12);
  glide(freq * 2.76, freq * 2.76, 0.01, when, 0.14 * vel, 0.04);
}
const chirp = (freq, when = 0, vel = 1) => glide(freq, freq * 1.5, 0.08, when, 0.25 * vel, 0.12);
const tapNote = () => marimba(degFreq(0, 1), 0, 0.3, 0.25);                        // empty-space tap
const padNote = i => marimba(ROOT * Math.pow(2, PADS[i].st / 12), 0, 0.35, 0.3);   // intro: pads wake up
const lidPop = () => { glide(degFreq(0, -1), degFreq(0), 0.06, 0, 0.3, 0.13); marimba(degFreq(4), 0.05, 0.3, 0.25); };
const lidShut = () => { plop(0, 1, 0.9); woodblock(degFreq(0, -1), 0.02, 0.5); };
const softShut = () => woodblock(degFreq(0, -1), 0, 0.35);
const tadaSound = () => [0, 2, 4, 5].forEach((d, i) => marimba(degFreq(d), i * 0.09, 0.7, 0.4));   // ≤ 600 ms
const hmmSound = () => { glide(degFreq(2, -1), degFreq(2, -1), 0.01, 0, 0.2, 0.26, 0.04);          // "hm-hm?":
  glide(degFreq(2, -1), degFreq(4, -1), 0.12, 0.3, 0.2, 0.34, 0.04); };                            // no failure sound
const hintSound = () => { glide(degFreq(0, -1), degFreq(0, -1), 0.01, 0, 0.2, 0.3, 0.06);           // the jar hums
  glide(degFreq(2, -1), degFreq(2, -1), 0.01, 0.34, 0.18, 0.36, 0.06); };
const fxOnSound = i => { chirp(degFreq(1 + i), 0, 0.7); marimba(degFreq(1 + i, 1), 0.06, 0.4, 0.3); };
const fxOffSound = () => plop(0, 0.6, 1.3);
const wakeSound = () => { chirp(degFreq(2), 0, 0.8); chirp(degFreq(4), 0.14, 0.7); };
function whoosh() {                                   // bin: noise through one band-pass sweeping down
  if (!ac || !noiseBuf || !voiceOk(0.5)) return;
  const t = ac.currentTime, src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(1800, t); bp.frequency.exponentialRampToValueAtTime(350, t + 0.42);
  env(g, t, 0.3, 0.08, 0.46);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t + 0.5);
  glide(degFreq(4), degFreq(0, -1), 0.35, 0.02, 0.08, 0.4);
}

// ---------- sampler voices (max 4; a JS mirror of each voice drives mouth, pad glow and loops) ----------
// pad -1 = the jar itself (jar tap, previews) at the clip's own pitch.
let svoices = [];
function startVoice(pad, loop) {
  const take = jar.sound, tk = TAKES[take];
  const live = svoices.filter(v => !v.rel);
  if (live.length >= 4) releaseVoice(live[0], 0.02);                      // steal the oldest
  const v = { pad, take, pos: 0, dur: tk.dur, loop, rate: Math.pow(2, (pad >= 0 ? PADS[pad].st : 0) / 12), bend: 0,
    rel: false, fade: 1, ended: false, rev: st.fx.includes(BACK), src: null, g: null };
  svoices.push(v);
  if (st.fx.includes(ECHO)) for (let n = 1; n <= 3; n++) ring(JAR.x, JAR.y, 30, 62, 0.5, HUE.teal[0], 2, 0.25 * n, 0.8 * Math.pow(0.45, n - 1));
  if (ac && sIn) {

  return s ? { x: s.x, y: s.y } : null;
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); if (ac) musicTick();
  const t0 = performance.now();
  drawScene();
  if (st.phase === 'START') drawStart();
  frameMs = lerp(frameMs, performance.now() - t0, 0.1); fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
