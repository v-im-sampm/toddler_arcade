<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Little Arcade v2 – reference sketch (Silly Faces)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html (Color Pop) and hatch_a_pet.html.
  World: Mirror Pond (scene_art mirror_pond palette). A friendly pond monster (4 original bodies) looks up
  from the water; tap its eyes or mouth to cycle 4 styles each. Matching eyes + mouth = a feeling
  (HAPPY, SLEEPY, SURPRISED, SAD) that the monster acts out, and a sticker flies to the sticker row.
  Buttons: Show (mirror: asks for a feeling), Mix (dice: random silly face), New (egg: new monster).
  Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs, ellipses,
  bezier/quadratic curves, linear/radial gradients, globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene. The monster stands in the water
  without clipping: a water-coloured half ellipse covers its base, then the reflection is drawn on top.
  Audio nodes (G major pentatonic, 110 bpm): sine oscillators, linear-attack/exponential-decay gains,
  exponential pitch glides, sine LFOs (boing wobble, slide-whistle vibrato), 2-operator sine FM for the
  kazoo (the doc asks for kazoo-like FM), one noise buffer (16 kHz) through one bandpass biquad for
  splashes, an original looping tune on its own small voice pool that ducks under the cues, one compressor.
  All art is procedural and original; no external resources, no network, no storage, no mic.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap. URL ?seed=N.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1E2245; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #note { position: fixed; left: 8px; bottom: 6px; color: #9DB8FA; font: 12px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Silly Faces reference sketch"></canvas></div>
<div id="note">v2 reference sketch · Silly Faces · 320×240 logical stage · D debug · R reduced motion · P particle cap</div>
<script>
'use strict';
// ---------- tokens (same subset as quality_bar.html, plus the mirror_pond palette) ----------
const W = 320, H = 240;
const TOK = {
  ink: '#3B3550', paper: '#FFF8EC', cream: '#FFF3D6', creamLine: '#D9C7A3', hintGlow: '#FFE066',
  skyTop: '#F8D8E9', skyBot: '#E8F4FF', waterTop: '#B6E9EB', waterBot: '#61C5CD', bankFar: '#A8DDA0', bankNear: '#7CCB7A',
  squashPress: [1.12, 0.88], wiggleDeg: 6, wiggleMs: 360, glowPeriod: 0.9,
  idleVisualHint: 8, idleSpokenHint: 12, autoHelpMisses: 2, maxInputBlock: 0.3,
  springBouncy: { k: 380, c: 14 }, breathScale: 0.025, bob: 2, tapDebounce: 0.08,
  deviceMaxParticles: 96, webMaxParticles: 400,
};
// Original pond monsters. T = crown height above the waterline, B = half width (monster-local px).
const MONSTERS = [
  { name: 'LILLOO',   base: '#2DB26E', light: '#8EE0B4', shadow: '#1E8452', T: -122, B: 88 },  // lily-leaf hat
  { name: 'PLUMBO',   base: '#8F5BE0', light: '#C9AEF5', shadow: '#6236A6', T: -128, B: 80 },  // horn buds, stripes
  { name: 'MARMALOO', base: '#FF8A2A', light: '#FFC07F', shadow: '#C2621B', T: -120, B: 96 },  // squat, big dots
  { name: 'JELLYPIP', base: '#F06BB8', light: '#FBB6DC', shadow: '#B23E86', T: -122, B: 86 },  // scalloped crest
];
// Feelings: eyes style e + mouth style e (the matching pair) acts out feeling e.
const HAPPY = 0, SLEEPY = 1, SURPRISED = 2, SAD = 3;
const ACT_DUR = [1.6, 1.8, 1.5, 2.4];                 // SAD: hug at 1.1 s, smile at 1.7 s (SF-2: <= 2.5 s)
// Stickers: [fill, rim, highlight] per feeling (sun, night-cap face, star burst, droplet with a heart).
const STICKER = [['#FFD23F', '#C99A0E', '#FFEB9C'], ['#C9AEF5', '#6236A6', '#EFE6FD'],
  ['#FF8A2A', '#C2621B', '#FFC07F'], ['#A9DBFB', '#2B79B8', '#FFFFFF']];
// Stage geometry (logical px). The doc's boxes are used as-is.
const MON = { x: 160, y: 182 };                       // monster waterline centre (body grows upwards)
const EYE_Y = -84, EYE_X = 36, EYE_R = 15, MOUTH_Y = -30; // face, monster-local (world eyes y 98, mouth y 152)
const EYES_HIT = [72, 64, 176, 56], MOUTH_HIT = [96, 128, 128, 56];
const HOME_HIT = [0, 0, 56, 56], MIC_HIT = [264, 0, 56, 56];
const SLOT_X = i => 100 + 40 * i, SLOT_Y = 28;        // sticker row: 4 slots x 40 px at x 80..240, y 0..56
const BUTTONS = [
  { id: 'show', hit: [24, 184, 64, 56], x: 56, y: 208 },
  { id: 'mix', hit: [128, 184, 64, 56], x: 160, y: 208 },
  { id: 'new', hit: [232, 184, 64, 56], x: 264, y: 208 },
];

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const bell = (t, a, b) => (t <= a || t >= b) ? 0 : Math.sin((t - a) / (b - a) * Math.PI);  // 0 -> 1 -> 0 on [a, b]
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];
function shuffled(n) {                  // grng shuffle bag 0..n-1
  const b = []; for (let i = 0; i < n; i++) b.push(i);
  for (let i = n - 1; i > 0; i--) { const j = (grng() * (i + 1)) | 0; [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- audio (Web Audio, G major pentatonic, conservative gain) ----------
// Degrees: 0 G4, 1 A4, 2 B4, 3 D5, 4 E5, 5 G5, 6 A5, 7 B5, 8 D6; -1 E4, -2 D4, -3 B3.
let ac = null, master = null, voices = [], noiseBuf = null;
const PENT = [0, 2, 4, 7, 9];
function degFreq(deg, oct = 0) {
  const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5;
  return 392.00 * Math.pow(2, (PENT[i] + 12 * (o + oct)) / 12);
}
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
}
// 8-voice cue limit: a voice is [start, end]; only voices overlapping the new one count.
function voiceOk(len, when = 0) {
  const now = ac.currentTime, s = now + when, e = s + len;
  voices = voices.filter(v => v[1] > now);
  let n = 0; for (const v of voices) if (v[0] < e && v[1] > s) n++;
  if (n >= 8) return false;                                    // voice limit
  voices.push([s, e]); duckMusic(now, when + len); return true;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function envHold(g, t, peak, attack, dur) {                    // sustained voices (slide, kazoo)
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(peak * 0.6, t + dur * 0.75);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function marimba(freq, when = 0, vel = 1, dur = 0.55) {        // keep freq <= A6 (3.99x partial < 7.8 kHz)
  if (!ac || !voiceOk(dur, when)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.45 * vel, 0.003, dur);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 3.99;
  const g2 = ac.createGain(); env(g2, t, 0.18 * vel, 0.003, 0.09);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
// Pitched sine with an exponential glide (plop, bloop, plink use this voice).
function glide(f0, f1, glideS, when, peak, dur) {
  if (!ac || !voiceOk(dur, when)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, 0.003, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.04);
}
const plop = (when = 0, vel = 1, hi = 1) => glide(760 * hi, 230 * hi, 0.07, when, 0.35 * vel, 0.14);
const bloop = (f, when = 0, vel = 1) => glide(f, f * 2, 0.06, when, 0.22 * vel, 0.12);
// Woodblock knock: short body with a slight pitch drop plus a bright inharmonic tick.
function woodblock(freq, when = 0, vel = 1) {
  glide(freq, freq * 0.92, 0.05, when, 0.42 * vel, 0.12);
  glide(freq * 2.76, freq * 2.76, 0.01, when, 0.14 * vel, 0.04);
}
// Boing: fast upward glide into the note plus a decaying 21 Hz sine LFO on the pitch (spring wobble).
function boing(f, when = 0, vel = 1) {
  if (!ac || !voiceOk(0.15, when)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f * 0.55, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.045);
  const l = ac.createOscillator(); l.type = 'sine'; l.frequency.value = 21;
  const lg = ac.createGain(); lg.gain.setValueAtTime(f * 0.09, t); lg.gain.exponentialRampToValueAtTime(f * 0.004, t + 0.15);
  l.connect(lg); lg.connect(o.frequency);
  const g = ac.createGain(); env(g, t, 0.32 * vel, 0.004, 0.15);
  o.connect(g); g.connect(master);
  o.start(t); l.start(t); o.stop(t + 0.2); l.stop(t + 0.2);
}
// Kazoo: 2-operator FM (one sine modulating one sine at ratio 1); the index swells, then settles.
function kazoo(f0, f1, when = 0, dur = 0.25, vel = 1) {
  if (!ac || !voiceOk(dur, when)) return;
  const t = ac.currentTime + when;
  const c = ac.createOscillator(), m = ac.createOscillator(); c.type = 'sine'; m.type = 'sine';
  for (const o of [c, m]) { o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.8); }
  const mg = ac.createGain();
  mg.gain.setValueAtTime(f0 * 0.4, t); mg.gain.linearRampToValueAtTime(f0 * 2.0, t + 0.03);
  mg.gain.linearRampToValueAtTime(f0 * 0.9, t + 0.12);
  m.connect(mg); mg.connect(c.frequency);
  const g = ac.createGain(); envHold(g, t, 0.16 * vel, 0.015, dur);
  c.connect(g); g.connect(master);
  c.start(t); m.start(t); c.stop(t + dur + 0.05); m.stop(t + dur + 0.05);
}
// Slide whistle: sine glide with a gentle 5.5 Hz vibrato (sine LFO, 1.2 % depth).
function slide(f0, f1, when = 0, dur = 0.45, vel = 1) {
  if (!ac || !voiceOk(dur, when)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.85);
  const l = ac.createOscillator(); l.type = 'sine'; l.frequency.value = 5.5;
  const lg = ac.createGain(); lg.gain.value = Math.max(f0, f1) * 0.012;
  l.connect(lg); lg.connect(o.frequency);
  const g = ac.createGain(); envHold(g, t, 0.2 * vel, 0.03, dur);
  o.connect(g); g.connect(master);
  o.start(t); l.start(t); o.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
}
// Splash: 0.6 s of seeded white noise rendered at the device rate, one bandpass sweeping down.
function splash(when = 0, vel = 1) {
  if (!ac || !voiceOk(0.55, when)) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, 9600, 16000);
    const d = noiseBuf.getChannelData(0), r = mulberry32(99);
    for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
  }
  const t = ac.currentTime + when;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(700, t + 0.45);
  const g = ac.createGain(); env(g, t, 0.22 * vel, 0.01, 0.55);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.6);
}

// ---------- music bed (original tune; G major pentatonic, 4/4 at 110 bpm, 8 bars = 17.5 s loop) ----------
// melody: [beat, degree, beats] at octave 0 (soft plucked sine); bass: [root, fifth] per bar at octave -1.
const TUNE = { spb: 60 / 110, beats: 32, voices: 6,
  melody: [[0, 0, .5], [.5, 2, .5], [1, 3, 1], [2, 1, .5], [2.5, 3, .5], [3, 2, 1],
           [4, 4, 1], [5, 3, .5], [5.5, 4, .5], [6, 5, 1.5],
           [8, 4, .5], [8.5, 3, .5], [9, 2, 1], [10, 1, .5], [10.5, 2, .5], [11, 0, 1],
           [12, 1, 1], [13, 2, .5], [13.5, 1, .5], [14, -1, 2],
           [16, 0, .5], [16.5, 2, .5], [17, 3, 1], [18, 4, .5], [18.5, 5, .5], [19, 6, 1],
           [20, 5, 1], [21, 4, .5], [21.5, 3, .5], [22, 4, 2],
           [24, 3, .5], [24.5, 2, .5], [25, 1, .5], [25.5, 2, .5], [26, 3, 1], [27, 4, 1],
           [28, 3, 1], [29, 2, .5], [29.5, 1, .5], [30, 0, 2]],
  bass: [[0, 3], [-1, 2], [0, 3], [1, 4], [0, 3], [-1, 2], [-2, 1], [0, 3]] };
// Events in time order: [beat, freq, peak, attack, dur].
const SONG = [];
for (const [b, d, n] of TUNE.melody) SONG.push([b, degFreq(d), 0.065, 0.01, n * TUNE.spb + 0.25]);
TUNE.bass.forEach(([r, f], i) => { SONG.push([i * 4, degFreq(r, -1), 0.07, 0.01, 0.5]); SONG.push([i * 4 + 2, degFreq(f, -1), 0.05, 0.01, 0.4]); });
SONG.sort((a, b) => a[0] - b[0] || b[2] - a[2]);
let music = null, musicBus = null, duck = null, duckUntil = 0, musicVoices = [];
function startMusic() {
  if (!ac) return;
  if (!musicBus) { musicBus = ac.createGain(); duck = ac.createGain(); musicBus.connect(duck); duck.connect(master); }
  const now = ac.currentTime;
  musicBus.gain.cancelScheduledValues(now); musicBus.gain.setValueAtTime(0, now);
  musicBus.gain.setTargetAtTime(1, now + 0.5, 1.5);                // gentle fade-in, never a loud start
  music = { t0: now + 0.5, i: 0, loop: 0 }; musicVoices = [];
}
function stopMusic() {
  if (!music) return;
  musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(0, ac.currentTime, 0.15);
  music = null;
}
function musicVoiceOk(t, len) {                                    // own pool: never takes cue voices
  musicVoices = musicVoices.filter(e => e > t);
  if (musicVoices.length >= TUNE.voices) return false;
  musicVoices.push(t + len); return true;
}
function musicNote(t, freq, peak, attack, dur) {
  if (!musicVoiceOk(t, dur)) return;
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  const g = ac.createGain(); env(g, t, peak, attack, dur);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.05);
}
function musicTick() {                                             // schedule notes 0.4 s ahead
  if (!music) return;
  for (;;) {
    const e = SONG[music.i], t = music.t0 + (music.loop * TUNE.beats + e[0]) * TUNE.spb;
    if (t > ac.currentTime + 0.4) return;
    musicNote(t, e[1], e[2], e[3], e[4]);
    if (++music.i >= SONG.length) { music.i = 0; music.loop++; }
  }
}
function duckMusic(now, len) {                                     // music dips to 0.35 under cues
  if (!duck) return;
  duckUntil = Math.max(duckUntil, now + len);
  duck.gain.cancelScheduledValues(now);
  duck.gain.setTargetAtTime(0.35, now, 0.03); duck.gain.setTargetAtTime(1, duckUntil, 0.3);
}

// ---------- cues (all pitches are scale degrees; no RNG except the cosmetic pond bloop) ----------
const EYE_DEG = [5, 3, 7, 1], MOUTH_DEG = [2, 0, 4, -1], TAP_DEGS = [0, 2, 4, 3, 1];
const partBoing = (eyes, style) => boing(degFreq(eyes ? EYE_DEG[style] : MOUTH_DEG[style]));
// Musical colour per feeling: HAPPY bright major run, SLEEPY slow descent, SURPRISED upward slide,
// SAD soft minor-ish descent (it resolves to the HAPPY run when the hug lands).
function motif(e, when = 0, vel = 0.7) {
  if (e === HAPPY) [0, 2, 3, 5].forEach((d, i) => marimba(degFreq(d), when + i * 0.09, vel, 0.4));
  else if (e === SLEEPY) [4, 3, 2, 0].forEach((d, i) => marimba(degFreq(d), when + i * 0.2, vel * 0.8, 0.5));
  else if (e === SURPRISED) slide(degFreq(0), degFreq(5), when, 0.45, vel);
  else [2, 1, -1].forEach((d, i) => marimba(degFreq(d), when + i * 0.22, vel * 0.6, 0.55));
}
const helloSound = () => { kazoo(degFreq(3), degFreq(3), 0, 0.14, 0.9); kazoo(degFreq(5), degFreq(4), 0.17, 0.24, 1); };
const promptSound = e => { kazoo(degFreq(3), degFreq(5), 0, 0.3, 0.8); motif(e, 0.38, 0.6); };   // "can you...?" + colour
const hmSound = () => kazoo(degFreq(2), degFreq(3), 0, 0.26, 0.7);
const plink = e => { marimba(degFreq(5 + e), 0, 0.5, 0.3); marimba(degFreq(8), 0.07, 0.3, 0.25); };
function sillySound(k) {
  if (k === 0) { kazoo(degFreq(3), degFreq(2), 0.1, 0.22, 0.9); kazoo(degFreq(2), degFreq(-1), 0.36, 0.3, 0.9); } // wah-wah
  else if (k === 1) { boing(degFreq(2), 0.1); boing(degFreq(4), 0.4); }                                          // hop hop
  else if (k === 2) { slide(degFreq(0), degFreq(5), 0.08, 0.28, 0.8); slide(degFreq(5), degFreq(0), 0.36, 0.3, 0.8); } // stretch
  else { bloop(degFreq(0), 0.08); bloop(degFreq(2), 0.22); bloop(degFreq(4), 0.36); }                          // bubbles
}
function mixSound() {
  slide(degFreq(0), degFreq(5), 0, 0.5, 0.6); slide(degFreq(5), degFreq(2), 0.5, 0.4, 0.5);
  for (let i = 0; i < 4; i++) woodblock(degFreq(i % 2 ? 3 : 0, -1), 0.08 + i * 0.12, 0.5);
}
function celebrateSound() {                                      // 1.6 s sting: kazoo run, chord, splashes
  [0, 2, 3, 5, 5].forEach((d, i) => kazoo(degFreq(d), degFreq(d), i * TUNE.spb / 2, 0.24, 0.9));
  [5, 7, 8].forEach(d => marimba(degFreq(d), 1.2, 0.5, 0.45));
  splash(0, 0.7); splash(0.5, 0.6); splash(1.0, 0.7);
}
const pondBloop = () => { const d = (frng() * 3) | 0; bloop(degFreq(d, -1), 0, 0.25); };   // cosmetic (frng)

// ---------- particles, rings ----------
let parts = [], rings = [], ripples = [], flights = [];
function emit(x, y, n, o) {
  n = Math.max(1, Math.round(n * (reduced ? 0.5 : 1)));
  for (let i = 0; i < n; i++) {
    if (parts.length >= maxParticles) parts.shift();            // evict oldest, never exceed cap
    const a = frng() * Math.PI * 2, sp = lerp(o.speed[0], o.speed[1], frng()), life = lerp(o.life[0], o.life[1], frng());
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.gravity, life, max: life,

    }
    ctx.stroke();
  }
  if (pose.front) { drawFace(v); drawHintGlow(); }
  ctx.fillStyle = v.base; ctx.strokeStyle = v.shadow; ctx.lineWidth = 2.5;     // fins: wave, or hug the belly
  for (const s of [-1, 1]) {
    const hug = pose.hug, fx = s * lerp(B - 4, 46, hug), fy = lerp(-16, -12, hug);
    ctx.save(); ctx.translate(fx, fy); ctx.rotate(s * ((-0.35 + pose.fin) * (1 - hug) + 0.3 * hug));
    ctx.beginPath(); ctx.ellipse(s * 10 * (1 - 2 * hug), 0, 13, 7.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = waterGrad(); ctx.beginPath(); ctx.ellipse(MON.x, MON.y, 122, 17, 0, 0, Math.PI); ctx.fill();   // water covers the base
  ctx.save(); ctx.translate(MON.x + pose.x, MON.y + 3 - pose.y * 0.35); ctx.rotate(-pose.ang); ctx.scale(pose.sx, -0.32 * pose.sy);
  bodyPath(mon.v); ctx.globalAlpha = 0.2; ctx.fillStyle = v.base; ctx.fill(); ctx.restore();                     // soft reflection
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.35; ctx.beginPath();
  for (const [y, w] of [[196, 50], [206, 38], [215, 24]]) { const o = Math.sin(time * 1.6 + y) * 3 * m; ctx.moveTo(MON.x - w + o, y); ctx.lineTo(MON.x + w + o, y); }
  ctx.stroke();
  ctx.globalAlpha = 0.7; ctx.lineWidth = 2; ctx.beginPath();                    // foam where the body meets the water
  ctx.ellipse(MON.x + pose.x, MON.y + 1, B * Math.abs(pose.sx) * 1.02 + 4, 5, 0, 0.1, Math.PI - 0.1); ctx.stroke();
  ctx.globalAlpha = 1;
  ripplePass(false);
}
function drawHintGlow() {                                      // pulsing glow around exactly the parts that need changing
  if (st.hint < 1 || (st.phase !== 'FREE' && st.phase !== 'SHOW_ME')) return;
  const g = nextGoal(); if (g < 0) return;
  ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 4;
  ctx.globalAlpha = 0.55 + 0.35 * Math.sin(time * Math.PI * 2 / TOK.glowPeriod); ctx.beginPath();
  if (mon.eyes !== g) { ctx.moveTo(64, EYE_Y); ctx.ellipse(0, EYE_Y, 64, 27, 0, 0, Math.PI * 2); }
  if (mon.mouth !== g) { ctx.moveTo(34, MOUTH_Y); ctx.ellipse(0, MOUTH_Y, 34, 22, 0, 0, Math.PI * 2); }
  ctx.stroke(); ctx.globalAlpha = 1;
}

// ---------- stickers (sun, night-cap, star burst, droplet-with-heart) ----------
function stickerPath(e) {
  if (e === HAPPY) { ctx.beginPath(); for (let i = 0; i <= 48; i++) { const a = i * Math.PI / 24, r = 13 + 1.6 * Math.cos(12 * a); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); }
  else if (e === SLEEPY) { ctx.beginPath(); ctx.arc(0, 2, 12.5, 0, 7); }
  else if (e === SURPRISED) starPath(0, 0, 16, 10.5, -Math.PI / 2, 8);
  else dropPath(0, 4, 10.5);
}
function drawSticker(e, x, y, s, rot, a) {
  const [fill, rim] = STICKER[e];
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha = a;
  stickerPath(e); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.stroke();        // die-cut white border
  ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = rim; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  if (e === HAPPY) {
    ctx.beginPath(); ctx.arc(-4.5, -2.5, 1.8, 0, 7); ctx.moveTo(6.3, -2.5); ctx.arc(4.5, -2.5, 1.8, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 1, 6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  } else if (e === SLEEPY) {
    ctx.beginPath(); ctx.arc(-4.5, 2, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.moveTo(7.4, 3); ctx.arc(4.5, 2, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 8.5, 2, 2.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#8F5BE0'; ctx.beginPath(); ctx.moveTo(-11, -6); ctx.quadraticCurveTo(-2, -14, 9, -19); ctx.quadraticCurveTo(7, -10, 10, -5);
    ctx.quadraticCurveTo(0, -9, -11, -6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(9.5, -19, 3, 0, 7); ctx.fill();
  } else if (e === SURPRISED) {
    ctx.beginPath(); ctx.arc(-4.5, -3, 2, 0, 7); ctx.moveTo(6.5, -3); ctx.arc(4.5, -3, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 5, 2.8, 3.8, 0, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(-3.6, 3, 1.6, 0, 7); ctx.moveTo(5.2, 3); ctx.arc(3.6, 3, 1.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 6, 3.4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    ctx.fillStyle = '#F06BB8'; heartPath(8, -6, 4); ctx.fill();
  }
  ctx.restore();
}
function drawStickers() {
  ctx.fillStyle = TOK.cream; roundRect(78, 6, 164, 44, 14); ctx.fill();
  ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 2; ctx.stroke();
  const pulse = Math.sin(time * Math.PI * 2 / TOK.glowPeriod);
  for (let i = 0; i < 4; i++) {
    const sl = slots[i], x = SLOT_X(i), target = st.phase === 'SHOW_ME' && st.target === i;
    if (sl.shown) {
      const w = sl.wig > 0 ? Math.sin(sl.wig * 30) * 0.15 * (sl.wig / 0.5) * (reduced ? 0.4 : 1) : 0;
      drawSticker(i, x, SLOT_Y, 1 - sl.q, w, 1);
      continue;
    }
    ctx.fillStyle = TOK.creamLine; ctx.beginPath();                                       // dotted empty slot
    for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6, px = x + Math.cos(a) * 17, py = SLOT_Y + Math.sin(a) * 17; ctx.moveTo(px + 1.3, py); ctx.arc(px, py, 1.3, 0, 7); }
    ctx.fill();
    if (target) {                                                                        // Show: the wanted sticker glows
      ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 4; ctx.globalAlpha = 0.55 + 0.35 * pulse;
      ctx.beginPath(); ctx.arc(x, SLOT_Y, 19, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    drawSticker(i, x, SLOT_Y, (1 - sl.q) * (target ? 1 + 0.06 * pulse * (reduced ? 0.4 : 1) : 0.9), 0, target ? 0.6 : 0.2);
  }
}

// ---------- buttons on lily pads: Show (mirror), Mix (dice), New (egg) ----------
let btnG = null;
function drawButtons() {
  const m = reduced ? 0.3 : 1;
  if (!btnG) { btnG = ctx.createRadialGradient(-7, -9, 2, 0, 0, 25); btnG.addColorStop(0, '#FFFFFF'); btnG.addColorStop(0.6, TOK.cream); btnG.addColorStop(1, TOK.creamLine); }
  ctx.fillStyle = '#2DB26E'; ctx.beginPath();                                            // the pads
  for (const b of BUTTONS) { ctx.moveTo(b.x, 226); ctx.ellipse(b.x, 226, 31, 9, 0, 1.75, 1.75 + Math.PI * 1.85); ctx.closePath(); }
  ctx.fill(); ctx.strokeStyle = '#8EE0B4'; ctx.lineWidth = 1.5; ctx.stroke();
  BUTTONS.forEach((b, i) => {
    const s = btns[i], bob = Math.sin(time * 2 + i * 1.3) * TOK.bob * m;
    ctx.save(); ctx.translate(b.x, b.y + bob); ctx.scale(1 - 0.5 * s.q, 1 + s.q);
    if (i === 0 && st.hint >= 1 && st.phase === 'FREE') {
      ctx.strokeStyle = TOK.hintGlow; ctx.lineWidth = 4; ctx.globalAlpha = 0.55 + 0.35 * Math.sin(time * Math.PI * 2 / TOK.glowPeriod);
      ctx.beginPath(); ctx.arc(0, 0, 27, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = btnG; ctx.beginPath(); ctx.arc(0, 0, 23, 0, 7); ctx.fill();
    ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 2; ctx.stroke();
    if (i === 0) {                                                                       // hand mirror with a tiny smile
      ctx.strokeStyle = '#C99A0E'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, 15); ctx.stroke();
      ctx.fillStyle = '#FFD23F'; ctx.beginPath(); ctx.arc(0, -4, 11, 0, 7); ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#A9DBFB'; ctx.beginPath(); ctx.arc(0, -4, 7.5, 0, 7); ctx.fill();
      ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.arc(-2.5, -6, 1.2, 0, 7); ctx.moveTo(3.7, -6); ctx.arc(2.5, -6, 1.2, 0, 7); ctx.fill();
      ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(0, -4, 3.2, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    } else if (i === 1) {                                                                // die, tumbles a quarter turn on Mix
      ctx.rotate((s.roll / 0.7) * Math.PI / 2 * (reduced ? 0.3 : 1));
      ctx.fillStyle = '#FFFFFF'; roundRect(-11, -11, 22, 22, 5); ctx.fill();
      ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = TOK.ink; ctx.beginPath();
      for (const [x, y] of [[-5, -5], [5, -5], [0, 0], [-5, 5], [5, 5]]) { ctx.moveTo(x + 2, y); ctx.arc(x, y, 2, 0, 7); }
      ctx.fill();
    } else {                                                                             // spotty egg (wobbles on New)
      ctx.rotate(Math.sin(s.roll * 25) * 0.25 * (s.roll / 0.5) * m);
      ctx.fillStyle = '#FFFBEF'; ctx.beginPath(); ctx.moveTo(0, -14); ctx.bezierCurveTo(9, -14, 12, 2, 11, 6);
      ctx.bezierCurveTo(10, 14, -10, 14, -11, 6); ctx.bezierCurveTo(-12, 2, -9, -14, 0, -14); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 1.5; ctx.stroke();
      MONSTERS.forEach((v, k) => { const [x, y, r] = [[-4, -6, 2.6], [5, -1, 3], [-4, 6, 2.4], [5, 8, 2]][k]; ctx.fillStyle = v.base; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
    }
    ctx.restore();
  });
}

// ---------- flights, helper hand, particles ----------
function drawFlights() {
  for (const f of flights) {
    const tx = SLOT_X(f.e);
    if (f.t < 0.2) { const k = f.t / 0.2; drawSticker(f.e, 160, 92, 1.4 * (reduced ? easeOutCubic(k) : easeOutBack(k)), 0, 1); continue; }
    const k = smooth((f.t - 0.2) / 0.75), cx = lerp(160, tx, 0.3), cy = 30;
    const x = (1 - k) * (1 - k) * 160 + 2 * (1 - k) * k * cx + k * k * tx, y = (1 - k) * (1 - k) * 92 + 2 * (1 - k) * k * cy + k * k * SLOT_Y;
    drawSticker(f.e, x, y, lerp(1.4, 1, k), Math.sin(k * Math.PI) * 0.3 * (reduced ? 0.3 : 1), 1);
  }
}
function drawHelperHand() {
  if (st.hint < 2) return;
  const p = autoTarget(); if (!p) return;
  const y = p.y + 16 + Math.abs(Math.sin(time * 4)) * -6 * (reduced ? 0.3 : 1);
  ctx.save(); ctx.translate(p.x + 10, y); ctx.rotate(-0.5);
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.5;
  roundRect(-4, -16, 8, 18, 4); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 6, 9, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawFx() {
  for (const r of rings) {
    const k = r.t / r.dur, rr = lerp(r.r0, r.r1, easeOutCubic(k));
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.w; ctx.beginPath();
    if (r.flat) ctx.ellipse(r.x, r.y, rr, rr * 0.35, 0, 0, 7); else ctx.arc(r.x, r.y, rr, 0, 7);
    ctx.stroke();
  }
  ctx.lineCap = 'round';
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1);
    ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
    ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
    if (p.shape === 'star') { starPath(p.x, p.y, p.size, p.size * 0.45, p.rot); ctx.fill(); }
    else if (p.shape === 'rect') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.shape === 'heart') { heartPath(p.x, p.y, p.size); ctx.fill(); }
    else if (p.shape === 'ring') { ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke(); }
    else if (p.shape === 'note') {
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 0.6, p.size * 0.45, -0.4, 0, 7); ctx.fill();
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x + p.size * 0.5, p.y); ctx.lineTo(p.x + p.size * 0.5, p.y - p.size * 1.6); ctx.stroke();
    }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * p.life / p.max), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---------- chrome, start, HUD ----------
function drawChrome() {
  ctx.fillStyle = TOK.cream; roundRect(6, 6, 44, 44, 14); ctx.fill();               // Home
  ctx.strokeStyle = TOK.creamLine; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.moveTo(28, 15); ctx.lineTo(41, 27); ctx.lineTo(37, 27); ctx.lineTo(37, 39);
  ctx.lineTo(19, 39); ctx.lineTo(19, 27); ctx.lineTo(15, 27); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.45; ctx.fillStyle = TOK.cream; roundRect(270, 6, 44, 44, 14); ctx.fill();   // Mic (disabled)
  ctx.fillStyle = TOK.ink; roundRect(287, 14, 10, 18, 5); ctx.fill();
  ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(292, 25, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(292, 34); ctx.lineTo(292, 40); ctx.stroke(); ctx.globalAlpha = 1;
}
function drawStart() {
  ctx.fillStyle = 'rgba(30,34,69,0.35)'; ctx.fillRect(0, 0, W, H);
  const p = 1 + Math.sin(time * 3) * 0.04;
  ctx.save(); ctx.translate(160, 120); ctx.scale(p, p);
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fill();
  ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(18, 0); ctx.lineTo(-10, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}
let fps = 60, frameMs = 0;
function drawHud() {
  if (!debug) return;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(176, 214, 144, 26);
  ctx.fillStyle = parts.length > TOK.deviceMaxParticles ? '#FF9A92' : '#FFFFFF'; ctx.font = '8px monospace';
  ctx.fillText(`fps ${fps.toFixed(0)} draw ${frameMs.toFixed(1)}ms p ${parts.length}/${maxParticles}`, 180, 224);
  ctx.fillText(`seed ${seed} ${st.phase} e${mon.eyes} m${mon.mouth} got ${st.got.filter(Boolean).length} hint ${st.hint} ${reduced ? 'RM' : ''}`, 180, 235);
}
// One full frame of the game scene (the golden harness calls this directly).
function drawScene() {
  drawBackground();
  drawAmbient();
  drawStickers();                // the shelf sits behind the monster: a raised tuft may poke over it
  drawMonster();
  drawButtons(); drawFlights(); drawHelperHand(); drawFx(); drawChrome();
}

// Test hook for tools/quality_bar_golden/sketch_check.mjs (not ported): the logical point a helpful player taps next, or null.
function autoTarget() {
  if (st.phase !== 'FREE' && st.phase !== 'SHOW_ME') return null;     // null while a feeling is acted out
  const g = nextGoal(); if (g < 0) return null;
  return mon.eyes !== g ? { x: 160, y: 92 } : { x: 160, y: 156 };
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); if (ac) musicTick();
  const t0 = performance.now();
  drawScene();
  if (st.phase === 'START') drawStart();
  frameMs = lerp(frameMs, performance.now() - t0, 0.1); fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
