<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Little Arcade v2 – reference sketch (Rocket Rescue)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html (Color Pop) and
  hatch_a_pet.html. Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs,
  ellipses, bezier/quadratic curves, linear/radial gradients, globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene.
  Audio nodes: sine oscillators, linear-attack/exponential-decay gains, exponential pitch
  glides, white noise (rendered once at 16 kHz) through one biquad lowpass per voice for the
  rocket whoosh and the brake/landing puffs, an original looping B-flat Lydian score (sine pads
  + glockenspiel) on its own small voice pool that ducks under the cues, one compressor.
  All art is procedural and original; no external resources, no network, no storage, no mic.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap. URL ?seed=N.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1E2245; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #note { position: fixed; left: 8px; bottom: 6px; color: #9DB8FA; font: 12px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Rocket Rescue reference sketch"></canvas></div>
<div id="note">v2 reference sketch · Rocket Rescue · 320×240 logical stage · D debug · R reduced motion · P particle cap</div>
<script>
'use strict';
// ---------- tokens (same subset as quality_bar.html / hatch_a_pet.html) ----------
const W = 320, H = 240;
const TOK = {
  ink: '#3B3550', inkSoft: '#6F6888', paper: '#FFF8EC', cream: '#FFF3D6', hintGlow: '#FFE066',
  skyTop: '#2C326D', skyBot: '#141A43',                       // scene_art space backdrop
  squashPress: [1.12, 0.88], wiggleDeg: 6, wiggleMs: 360, glowPeriod: 0.9,
  idleVisualHint: 6, idleSpokenHint: 12, maxInputBlock: 0.3, autoHelpMisses: 2,
  springBouncy: { k: 380, c: 14 }, breathScale: 0.025, bob: 2, tapDebounce: 0.08,
  deviceMaxParticles: 96, webMaxParticles: 400,
  glide: 2.5, starRespawn: 0.9, brake: 0.22, resume: 0.3,   // v1 glide/respawn; STOP halts within 300 ms
};
// tokens.json hue triples.
const HUE = {
  red:    { shadow: '#B8323A', base: '#EF4B4F', light: '#FF9A92' },
  orange: { shadow: '#C2621B', base: '#FF8A2A', light: '#FFC07F' },
  yellow: { shadow: '#C99A0E', base: '#FFD23F', light: '#FFEB9C' },
  lime:   { shadow: '#6E9A1F', base: '#A6D13B', light: '#D6EE95' },
  green:  { shadow: '#1E8452', base: '#2DB26E', light: '#8EE0B4' },
  teal:   { shadow: '#127A7D', base: '#21B3B0', light: '#8FE3DE' },
  sky:    { shadow: '#2B79B8', base: '#4FB0F0', light: '#A9DBFB' },
  purple: { shadow: '#6236A6', base: '#8F5BE0', light: '#C9AEF5' },
  pink:   { shadow: '#B23E86', base: '#F06BB8', light: '#FBB6DC' },
  cream:  { shadow: '#D9C7A3', base: '#FFF3D6', light: '#FFFBEF' },
};
// Original space friends (v1 roster). deg = call pitch (B-flat Lydian degree).
const FRIENDS = [
  { name: 'MOON_PUP',    ...HUE.sky,    deg: 2 },
  { name: 'STAR_BUNNY',  ...HUE.pink,   deg: 4 },
  { name: 'COMET_KITTY', ...HUE.yellow, deg: 3 },
];
// Planets: silhouette (ringed / round / oblate), pattern (ring / spots / stripes) and colour all differ.
const PLANETS = [
  { name: 'RINGED',  x: 110, y: 134, rx: 27, ry: 27, c: HUE.purple, deg: 0 },
  { name: 'SPOTTED', x: 192, y: 130, rx: 27, ry: 27, c: HUE.orange, deg: 2 },
  { name: 'STRIPED', x: 272, y: 136, rx: 29, ry: 25, c: HUE.teal,   deg: 4 },
];
// Stage geometry (logical px).
const PLANET_HIT = 36;                                // 72 px hit circle per planet (doc: >= 64x64)
const LAND_A = -122 * Math.PI / 180;                  // the rocket parks on a planet's upper-left shoulder
const STAND_A = -52 * Math.PI / 180;                  // friends and aliens stand on the upper-right shoulder
const FOOT = 22, SINK = 5;                            // rocket centre -> feet; sits SINK px into a planet's limb
const DOCK = { x: 36, y: 150 };                       // launch pad top on Star Hill
const GO = { x: 48, y: 180, w: 96, h: 56, cx: 96, cy: 208 };
const STOP = { x: 176, y: 180, w: 96, h: 56, cx: 224, cy: 208 };
const BADGE = [132, 4, 56, 56];
const SLOTS = [[13, 184], [35, 199], [14, 222]];      // dock party spots (feet), bottom-left of Star Hill
const STAR_AT = [0.3, 0.52, 0.74];                    // collectible stars along every course (path progress)
const PARTY_SCALE = 0.72, RIDE_SCALE = 0.5;

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOutSine = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
const smooth01 = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];
const inBox = (x, y, b) => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h;
// Ground profile of Star Hill: a mound under the dock (x 36) rolling off to the right.
const groundY = x => 174 - 22 * Math.exp(-Math.pow((x - 36) / 46, 2)) + 2.5 * Math.sin(x / 19 + 0.6);
// Planet surface radius along angle a (the striped planet is an oblate ellipse).
const surfR = (p, a) => 1 / Math.sqrt(Math.pow(Math.cos(a) / p.rx, 2) + Math.pow(Math.sin(a) / p.ry, 2));
// Rocket rest pose: centre + tilt (0 = nose up) on planet i, or on the dock pad when i < 0.
function landPose(i) {
  if (i < 0) return { x: DOCK.x, y: DOCK.y - FOOT, rot: 0 };
  const p = PLANETS[i], d = surfR(p, LAND_A) + FOOT - SINK;
  return { x: p.x + Math.cos(LAND_A) * d, y: p.y + Math.sin(LAND_A) * d, rot: LAND_A + Math.PI / 2 };
}
// Where a friend (or the local alien) stands on planet i: feet position + tilt.
function standPose(i) {
  const p = PLANETS[i], d = surfR(p, STAND_A) - 2;
  return { x: p.x + Math.cos(STAND_A) * d, y: p.y + Math.sin(STAND_A) * d, rot: STAND_A + Math.PI / 2 };
}
// Local point (lx, ly) of a body at (x, y) rotated by rot -> stage coordinates.
const toWorld = (x, y, rot, lx, ly) => [x + lx * Math.cos(rot) - ly * Math.sin(rot), y + lx * Math.sin(rot) + ly * Math.cos(rot)];
// Cubic bezier course from pose a to pose b: leaves along a's "up" and arrives along b's "down".
// Control points stay at y >= 92 so the rocket's nose never reaches the top band (badge, Home, Mic).
function courseCurve(a, b) {
  const L = clamp(0.45 * Math.hypot(b.x - a.x, b.y - a.y), 26, 70);
  return { p0: [a.x, a.y], p3: [b.x, b.y],
    c1: [a.x + Math.sin(a.rot) * L, Math.max(92, a.y - Math.cos(a.rot) * L)],
    c2: [b.x + Math.sin(b.rot) * L, Math.max(92, b.y - Math.cos(b.rot) * L)] };
}
const bez = (a, b, c, d, t) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };
const curvePt = (cv, t) => [bez(cv.p0[0], cv.c1[0], cv.c2[0], cv.p3[0], t), bez(cv.p0[1], cv.c1[1], cv.c2[1], cv.p3[1], t)];

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- audio (Web Audio, B-flat Lydian, conservative gain) ----------
let ac = null, master = null, voices = [], noiseBuf = null, whoosh = null;
const LYD = [0, 2, 4, 6, 7, 9, 11];                          // B-flat Lydian: Bb C D E F G A
function degFreq(deg, oct = 0) {
  const o = Math.floor(deg / 7), i = ((deg % 7) + 7) % 7;
  return 466.16 * Math.pow(2, (LYD[i] + 12 * (o + oct)) / 12);
}
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
  noiseBuf = ac.createBuffer(1, 16000, 16000);               // 1 s of white noise at 16 kHz, rendered once (fixed LCG)
  const d = noiseBuf.getChannelData(0);
  for (let i = 0, s = 7; i < d.length; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; d[i] = s / 2147483648 - 1; }
}
function voiceOk(len, when = 0) {                            // -> the voice's end time, or 0 when all 8 are busy
  const now = ac.currentTime; voices = voices.filter(e => e > now);
  if (voices.length >= 8) return 0;                          // voice limit
  const end = now + when + len; voices.push(end); duckMusic(now, when + len); return end;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
// Glockenspiel: sine fundamental plus a short, bright inharmonic sine partial (2.76x, kept < 7.6 kHz).
function glock(freq, when = 0, vel = 1, dur = 0.5) {
  if (!ac || !voiceOk(dur, when)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.3 * vel, 0.002, dur);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = Math.min(freq * 2.76, 7600);
  const g2 = ac.createGain(); env(g2, t, 0.45, 0.002, Math.min(0.15, dur));
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
// Pitched sine with an exponential glide (plop, beeps, friend calls and the brake fwump use this voice).
function glide(f0, f1, glideS, when, peak, dur) {
  if (!ac || !voiceOk(dur, when)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, 0.003, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.04);
}
// Noise puff: the 16 kHz noise table, looped, through one lowpass biquad whose cutoff glides down.
function puff(f0, f1, glideS, when, peak, dur) {
  if (!ac || !noiseBuf || !voiceOk(dur, when)) return;
  const t = ac.currentTime + when;
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.7;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, 0.005, dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.05);
}
// Rocket whoosh: one noise voice (<= 2 s) whose lowpass cutoff ("pitch") and loudness follow the speed.
function whooshStart(len) {
  whooshCut();
  len = Math.min(2, len);
  const end = ac && noiseBuf && len > 0.3 ? voiceOk(len) : 0;
  if (!end) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.7; f.frequency.setValueAtTime(320, t);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + len + 0.05);
  whoosh = { f, g, end, fc: 320, gv: 0.0001 };
}
function whooshSpeed(v) {                                    // every flight frame, v = speed 0..1
  if (!whoosh) return;
  const now = ac.currentTime, fade = clamp((whoosh.end - now - 0.1) / 0.35, 0, 1);
  const fc = 320 + 1300 * v, gv = Math.max(0.0001, 0.15 * v * fade);
  if (Math.abs(fc - whoosh.fc) > 25) { whoosh.fc = fc; whoosh.f.frequency.setTargetAtTime(fc, now, 0.05); }
  if (Math.abs(gv - whoosh.gv) > 0.004) { whoosh.gv = gv; whoosh.g.gain.setTargetAtTime(gv, now, 0.06); }
}
function whooshCut() {                                       // STOP, landing, Home: fade out now (no second stop())
  if (!whoosh) return;
  const now = ac.currentTime, i = voices.indexOf(whoosh.end);
  if (i >= 0) voices[i] = Math.min(whoosh.end, now + 0.2);   // hand its cue voice back early
  whoosh.g.gain.cancelScheduledValues(now); whoosh.g.gain.setTargetAtTime(0.0001, now, 0.04);
  whoosh = null;
}
// ---------- score (original tune; B-flat Lydian, 4/4 at 84 bpm, 8 bars = 22.9 s loop) ----------
// pads: one two-note sine chord per 2 bars at octave -1 (slow swell); glock: [beat, degree] melody;
// twinkle: very soft high glock answers.
const SCORE = { spb: 60 / 84, beats: 32, voices: 6,
  pads: [[0, 4], [1, 3], [-2, 2], [1, 5]],
  glock: [[0, 4], [1.5, 3], [2, 2], [4, 1], [5, 2], [6, 4], [8, 3], [9.5, 4], [10, 5], [12, 6], [13, 5], [14, 3],
          [16, 5], [17, 4], [18, 2], [20, 0], [21, 2], [22, 1], [24, 1], [25, 3], [26, 5], [27, 6], [28, 7], [30, 4]],
  twinkle: [[3.5, 9], [11.5, 8], [19.5, 7], [27.5, 9]] };
// Events in time order: [beat, freq, peak, attack, dur, partial ratio (0 = pure sine)].
const SONG = [];
for (const [b, d] of SCORE.glock) SONG.push([b, degFreq(d), 0.05, 0.004, 0.9, 2.76]);
SCORE.pads.forEach((ch, i) => { for (const d of ch) SONG.push([i * 8, degFreq(d, -1), 0.045, 2.0, 8 * SCORE.spb - 0.05, 0]); });
for (const [b, d] of SCORE.twinkle) SONG.push([b, degFreq(d), 0.022, 0.004, 1.2, 2.76]);
SONG.sort((a, b) => a[0] - b[0] || b[2] - a[2]);
let music = null, musicBus = null, duck = null, duckUntil = 0, musicVoices = [];
function startMusic() {
  if (!ac) return;
  if (!musicBus) { musicBus = ac.createGain(); duck = ac.createGain(); musicBus.connect(duck); duck.connect(master); }
  const now = ac.currentTime;
  musicBus.gain.cancelScheduledValues(now); musicBus.gain.setValueAtTime(0, now);
  musicBus.gain.setTargetAtTime(1, now + 0.5, 1.5);                // gentle fade-in, never a loud start
  music = { t0: now + 0.5, i: 0, loop: 0 }; musicVoices = [];
}
function stopMusic() {
  if (!music) return;
  musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(0, ac.currentTime, 0.15);
  music = null;
}
function musicVoiceOk(t, len) {                                    // own pool: never takes cue voices
  musicVoices = musicVoices.filter(e => e > t);
  if (musicVoices.length >= SCORE.voices) return false;
  musicVoices.push(t + len); return true;
}
function musicNote(t, freq, peak, attack, dur, partial) {
  if (!musicVoiceOk(t, dur)) return;
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  const g = ac.createGain(); env(g, t, peak, attack, dur);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.05);
  if (!partial) return;
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = Math.min(freq * partial, 7600);
  const g2 = ac.createGain(); env(g2, t, peak * 0.35, attack, 0.12);  // glockenspiel strike shimmer
  o2.connect(g2); g2.connect(musicBus); o2.start(t); o2.stop(t + 0.17);
}
function musicTick() {                                             // schedule notes 0.4 s ahead
  if (!music) return;
  for (;;) {
    const e = SONG[music.i], t = music.t0 + (music.loop * SCORE.beats + e[0]) * SCORE.spb;
    if (t > ac.currentTime + 0.4) return;
    musicNote(t, e[1], e[2], e[3], e[4], e[5]);
    if (++music.i >= SONG.length) { music.i = 0; music.loop++; }
  }
}
function duckMusic(now, len) {                                     // music dips to 0.35 under cues
  if (!duck) return;
  duckUntil = Math.max(duckUntil, now + len);
  duck.gain.cancelScheduledValues(now);
  duck.gain.setTargetAtTime(0.35, now, 0.03); duck.gain.setTargetAtTime(1, duckUntil, 0.3);
}
// ---------- cues (every pitch comes from the B-flat Lydian scale) ----------
const plop = (when = 0, vel = 1) => glide(degFreq(5), degFreq(0, -1), 0.07, when, 0.3 * vel, 0.14);
const tapNote = x => glock(degFreq(7 + Math.floor(clamp(x, 0, 319) / 64)), 0, 0.3, 0.15);   // empty tap: pitch by x
const beepBoop = () => { glide(degFreq(4), degFreq(4), 0.01, 0, 0.16, 0.07); glide(degFreq(0), degFreq(0), 0.01, 0.075, 0.16, 0.07); };
const softNote = d => glide(degFreq(d, -1), degFreq(d, -1), 0.01, 0, 0.14, 0.13);           // GO/STOP that has nothing to do
const courseSound = i => { const d = PLANETS[i].deg; glock(degFreq(d + 7), 0, 0.45, 0.09); glock(degFreq(d + 9), 0.06, 0.45, 0.09); };
const planetNote = i => glock(degFreq(PLANETS[i].deg + 7), 0, 0.35, 0.15);
function goSound() {                                               // "Go, rocket, go!": ignition swell + rising triad
  glide(degFreq(0, -1), degFreq(4, -1), 0.25, 0, 0.16, 0.35);
  [0, 2, 4].forEach((d, i) => glock(degFreq(d + 7), i * 0.08, 0.45 + i * 0.1, i < 2 ? 0.2 : 0.35));
}
function brakeSound() {                                            // brake "fwump"
  glide(degFreq(4, -1), degFreq(0, -1), 0.16, 0, 0.3, 0.22);
  puff(1200, 220, 0.15, 0, 0.1, 0.2);
}
function landSound() { glide(degFreq(2, -1), degFreq(0, -1), 0.06, 0, 0.3, 0.16); puff(800, 200, 0.1, 0, 0.08, 0.16); }
function chimeSound() { glock(degFreq(2 + st.chime % 8), 0, 0.55, 0.4); st.chime++; }  // stars climb the scale
function callSound(f) {                                            // a friend's "Help!" call (non-verbal motif)
  const d = FRIENDS[f].deg;
  if (f === 0) { glide(degFreq(d), degFreq(d + 2), 0.08, 0, 0.2, 0.14); glide(degFreq(d), degFreq(d + 2), 0.08, 0.2, 0.22, 0.16); } // pup: arf arf
  else if (f === 1) [7, 9, 8].forEach((x, i) => glock(degFreq(x), i * 0.11, 0.45, 0.22));                                           // bunny: tinkle
  else { glide(degFreq(d), degFreq(d + 2), 0.12, 0, 0.2, 0.16); glide(degFreq(d + 2), degFreq(d - 1), 0.22, 0.15, 0.2, 0.32); }    // kitty: mew
}
const cheerSound = (f, when = 0) => { const d = FRIENDS[f].deg + 4;
  glide(degFreq(d), degFreq(d + 3), 0.1, when, 0.2, 0.16); glide(degFreq(d), degFreq(d + 3), 0.1, when + 0.18, 0.2, 0.18); };
function rescueSound(f) {                                          // "You found <friend>!"
  [0, 2, 4, 7].forEach((d, i) => glock(degFreq(d), i * 0.07, 0.5 + i * 0.08, i < 3 ? 0.25 : 0.35)); cheerSound(f, 0.24);
}
const dockSound = () => [0, 2, 4, 6, 7].forEach((d, i) => glock(degFreq(d), i * 0.08, 0.5, i < 4 ? 0.25 : 0.5));
function alienSound() {                                            // the local alien's friendly "ba-loo"
  glide(degFreq(4, -1), degFreq(6, -1), 0.08, 0, 0.2, 0.14); glide(degFreq(6, -1), degFreq(2, -1), 0.16, 0.16, 0.2, 0.26);
}
const giftSound = () => { glock(degFreq(9), 0, 0.5, 0.3); glock(degFreq(11), 0.08, 0.5, 0.45); };
const goHint = () => { glock(degFreq(7), 0, 0.35, 0.18); glock(degFreq(11), 0.14, 0.35, 0.3); };   // idle with a course: "press GO" motif
