<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Little Arcade v2 – reference sketch (Bubble Aquarium)</title>
<!--
  REFERENCE SKETCH: the device port must match this file exactly (see docs/06 §4).
  Same visual language, motion tokens and audio graph as quality_bar.html (Color Pop) and hatch_a_pet.html.
  Canvas features are limited to what firmware ui/ctx2d supports: paths, arcs, ellipses,
  bezier/quadratic curves, linear/radial gradients (<= 4 stops), globalAlpha, 'lighter', transforms.
  No clip, drawImage, text, shadows or filters in the game scene.
  Simulation: fish, pellets, bubbles, the chest and visitors advance in fixed 50 ms steps (deterministic
  per seed and input sequence); drawing interpolates between the last two steps.
  Audio nodes: sine oscillators (additive partials kept below 7.8 kHz), linear-attack/exponential-decay
  gains, exponential pitch glides, one seeded noise buffer through one biquad per voice (shaker rattle,
  reef wash with a slow sine LFO), an original looping reef lullaby (E major pentatonic, 70 bpm; 60 bpm
  at bedtime) on its own small voice pool that ducks under the cues, one compressor.
  The calmest game: no stings, no buzzers; celebrations are gentle chimes.
  All art is procedural and original; no external resources, no network, no storage, no mic.
  Keys: D = debug HUD, R = reduced motion, P = toggle device/web particle cap,
        B = bedtime on/off (parent shortcut, same as the moon button). URL ?seed=N.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1E2245; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #note { position: fixed; left: 8px; bottom: 6px; color: #9DB8FA; font: 12px system-ui, sans-serif; opacity: .7; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Bubble Aquarium reference sketch"></canvas></div>
<div id="note">v2 reference sketch · Bubble Aquarium · 320×240 logical stage · D debug · R reduced motion · P particle cap · B bedtime</div>
<script>
'use strict';
// ---------- tokens (same subset as quality_bar.html / hatch_a_pet.html) ----------
const W = 320, H = 240, TAU = Math.PI * 2;
const TOK = {
  ink: '#3B3550', paper: '#FFF8EC', cream: '#FFF3D6', creamLine: '#D9C7A3', hintGlow: '#FFE066', night: '#1E2245',
  skyTop: '#BFE6FF', skyBot: '#E8F7FF', water0: '#A9E4F7', water1: '#75CBEF', water2: '#3F9FDA', water3: '#207AB8',
  sandTop: '#F3DDB0', sandBot: '#DDB892', sandLine: '#C49A6C',
  wiggleDeg: 6, wiggleMs: 360, glowPeriod: 0.9,
  idleVisualHint: 6, idleSpokenHint: 12, maxInputBlock: 0.3,
  springBouncy: { k: 380, c: 14 }, breathScale: 0.025, bob: 2, tapDebounce: 0.08, dragDeadZone: 12,
  dur: { instant: 0.06, quick: 0.14, base: 0.22, gentle: 0.4, scene: 0.45, celebrate: 1.5 },
  deviceMaxParticles: 96, webMaxParticles: 400,
};
// Stage geometry (logical px). Top band y 0-56: Home | food shaker | bedtime moon | bubble button | Mic.
const HOME = [0, 0, 56, 56], MIC = [264, 0, 56, 56];
const SHAKER = [72, 0, 56, 56], MOON = [132, 0, 56, 56], BUBBTN = [192, 0, 56, 56];
const SURF = 62, SAND = 206;                            // water surface and sand top (mean y)
const TANK = { x0: 40, x1: 280, y0: 88, y1: 196 };      // fish centre bounds while wandering
const CHEST = { x: 220, y: 228 }, CHEST_HIT = [190, 186, 60, 48];   // centre of the chest base; a tap = bubbles
const SPOUT = { x: 100, y: 50 };                        // shaker cap: pellets fall from here
const STEP = 0.05;                                      // fixed simulation step (doc: 50 ms substeps)
const PELLET_CAP = 6, BUBBLE_CAP = 8, PELLET_REST = 211, MEALS_PER_VISIT = 3;
// Original fish (v1 roster, Toy Box Island reef). deg = voice (E major pentatonic degree); hw/hh = hit
// half-size (>= 64x48, <= 6 px beyond the art); mouth = local mouth point when facing right (+x).
const FISH = [
  { name: 'STRIPEY', base: '#FF8A2A', shadow: '#C2621B', light: '#FFC07F', deg: 0, hw: 32, hh: 24, mouth: [25, 5],
    lane: [96, 160], home: [92, 122], bed: [80, 178], speed: 20, enter: [-44, 118] },
  { name: 'PUFFY', base: '#F06BB8', shadow: '#B23E86', light: '#FBB6DC', deg: 2, hw: 32, hh: 28, mouth: [26, 6],
    lane: [124, 186], home: [222, 158], bed: [150, 182], speed: 16, enter: [366, 162] },
  { name: 'LONGFIN', base: '#FFD23F', shadow: '#C99A0E', light: '#FFEB9C', deg: 4, hw: 40, hh: 24, mouth: [33, 4],
    lane: [92, 150], home: [176, 104], bed: [254, 166], speed: 24, enter: [374, 100],
    fin: '#C9AEF5', finLine: '#8F5BE0' },
];
// Visitors (one every 3 meals, in turn). phrase = lullaby degrees at octave -1, step = seconds per note.
const VISITORS = [
  { name: 'TURTLE', base: '#2DB26E', shadow: '#1E8452', light: '#8EE0B4',   phrase: [0, 2, 3, 2, 0], step: 0.36, y: 126, dir: 1, hw: 42, hh: 26 },
    { name: 'SEAHORSE', base: '#EF4B4F', shadow: '#B8323A', light: '#FF9A92', phrase: [3, 4, 5, 4, 3], step: 0.3, y: 122, dir: -1, hw: 24, hh: 38 },
    { name: 'JELLY', base: '#C9AEF5', shadow: '#8F5BE0', light: '#F1E8FF', phrase: [5, 4, 3, 4, 5], step: 0.34, y: 116, dir: 1, hw: 28, hh: 34 },
];

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth = t => t * t * (3 - 2 * t);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '1234', 10);
const grng = mulberry32(seed);          // gameplay RNG (deterministic per seed)
const frng = Math.random;               // cosmetic RNG (particles, blinks, fizz)
const inRect = (x, y, r) => x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[3];

// ---------- canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let debug = false, maxParticles = TOK.deviceMaxParticles;

// ---------- audio (Web Audio, E major pentatonic, conservative gain; no stings) ----------
let ac = null, master = null, voices = [], noiseBuf = null;
const PENT = [0, 2, 4, 7, 9];
const MAX_HZ = 7800;                   // the device renders at 16 kHz: every partial stays below 7.8 kHz
function degFreq(deg, oct = 0) {
  const o = Math.floor(deg / 5), i = ((deg % 5) + 5) % 5;
  return 659.26 * Math.pow(2, (PENT[i] + 12 * (o + oct)) / 12);          // degree 0 = E5
}
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 10; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);
  master.gain.setTargetAtTime(0.35, ac.currentTime, 0.1);   // ramp in: never a loud start
  const n = Math.round(ac.sampleRate);                       // 1 s of seeded white noise (shaker, reef wash)
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  const d = noiseBuf.getChannelData(0), nr = mulberry32(99);
  for (let i = 0; i < n; i++) d[i] = nr() * 2 - 1;
}
function voiceOk(len) {
  const now = ac.currentTime; voices = voices.filter(e => e > now);
  if (voices.length >= 8) return false;                        // voice limit
  voices.push(now + len); duckMusic(now, len); return true;
}
function env(g, t, peak, attack, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
// Soft bell: sine fundamental plus a short glassy partial (x2.76, dropped if it would reach 7.8 kHz).
function bell(freq, when = 0, vel = 1, dur = 0.5) {
  if (!ac || !voiceOk(dur)) return;
  const t = ac.currentTime + when;
  const g = ac.createGain(); env(g, t, 0.3 * vel, 0.004, dur); g.connect(master);
  const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq; o1.connect(g);
  o1.start(t); o1.stop(t + dur + 0.05);
  if (freq * 2.76 < MAX_HZ) {
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.76;
    const g2 = ac.createGain(); env(g2, t, 0.25 * vel, 0.003, Math.min(0.18, dur));
    o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + dur + 0.05);
  }
}
// Pitched sine with an exponential glide (plink, blub, chomp and hello all use this voice).
function glide(f0, f1, glideS, when, peak, dur) {
  if (!ac || !voiceOk(dur)) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + glideS);
  const g = ac.createGain(); env(g, t, peak, 0.003, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.04);
}
// Seeded noise through one bandpass: the food shaker's soft rattle.
function rattle(when = 0, vel = 1) {
  if (!ac || !voiceOk(0.08)) return;
  const t = ac.currentTime + when;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3000; f.Q.value = 1.2;
  const g = ac.createGain(); env(g, t, 0.2 * vel, 0.004, 0.07);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, frng() * 0.8); s.stop(t + 0.09);
}
// Cues: every pitch lands on E major pentatonic; taps <= 150 ms, meal/happy chimes <= 600 ms.
const plink = (freq, when = 0, vel = 1) => glide(freq * 0.75, freq, 0.03, when, 0.26 * vel, 0.13);   // bubble pop
const blub = (deg, when = 0, vel = 1) => glide(degFreq(deg - 2, -1), degFreq(deg, -1), 0.06, when, 0.2 * vel, 0.12);
const softTick = () => glide(degFreq(3) * 0.94, degFreq(3), 0.02, 0, 0.1, 0.1);                   // empty top band
const glassSound = () => glide(degFreq(-1, -1), degFreq(0, -1), 0.04, 0, 0.22, 0.14);              // soft "tup" on the glass
const shakeSound = vel => { rattle(0, vel); rattle(0.06, vel * 0.7); };
const plip = () => glide(degFreq(5) * 0.9, degFreq(5), 0.02, 0, 0.07, 0.06);                      // pellet meets the water
function fishSound(k, sleepy) {                         // two-note hello in the fish's own pitch
  const d = FISH[k].deg;
  if (sleepy) { glide(degFreq(d, -1) * 0.94, degFreq(d, -1), 0.04, 0, 0.12, 0.14); return; }
  glide(degFreq(d) * 0.9, degFreq(d), 0.03, 0, 0.24, 0.08);
  glide(degFreq(d + 2) * 0.9, degFreq(d + 2), 0.03, 0.07, 0.24, 0.08);
}
function gulpSound(k) {                                 // chomp + plink
  glide(degFreq(-2, -1), degFreq(0, -2), 0.05, 0, 0.26, 0.09);
  plink(degFreq(FISH[k].deg + 3), 0.08, 0.8);
}
function happySound(k) {                                // happy loop: soft rising three-note chime
  const d = FISH[k].deg;
  bell(degFreq(d), 0, 0.45, 0.3); bell(degFreq(d + 2), 0.11, 0.45, 0.3); bell(degFreq(d + 4), 0.22, 0.5, 0.34);
}
const helloSound = k => { const f = degFreq(FISH[k].deg + 1); glide(f * 0.85, f, 0.05, 0, 0.18, 0.12); };
function bedSound(on) {                                 // goodnight (falling) / good morning (rising) chime
  (on ? [3, 2, 0] : [0, 2, 3]).forEach((d, i) => bell(degFreq(d, on ? -1 : 0), i * 0.2, 0.4, 0.5));
}
function visitorPhrase(k) {                             // a short lullaby phrase (< 2 s) on the soft bell
  const V = VISITORS[k];
  V.phrase.forEach((d, i) => bell(degFreq(d, -1), i * V.step, 0.42, 0.5));
}
const hintChime = () => { bell(degFreq(3, -1), 0, 0.35, 0.4); bell(degFreq(0), 0.2, 0.35, 0.45); };  // narrator stand-in
const welcomeChime = () => [0, 2, 3].forEach((d, i) => bell(degFreq(d), i * 0.15, 0.32, 0.4));

// ---------- reef lullaby (original tune; E major pentatonic, 4/4 at 70 bpm, 8 bars = 27.4 s loop) ----------
// melody: [beat, degree, beats, bed] at octave -1 (soft bell); pad: one root per bar at octave -2 plus its
// fifth. Bedtime plays the same tune at 60 bpm, 25 % softer, keeping only the notes marked bed = 1.
// Peaks sit about 3 dB under hatch_a_pet's lullaby (doc: music -3 dB relative to the other games).
const LULLABY = { day: 60 / 70, night: 1.0, beats: 32, voices: 6,
  melody: [[0, 2, 2, 1], [2, 3, 2, 0], [4, 4, 3, 1], [7, 3, 1, 0], [8, 2, 2, 1], [10, 1, 2, 0], [12, 0, 4, 1],
           [16, 3, 2, 1], [18, 4, 1, 0], [19, 3, 1, 0], [20, 5, 3, 1], [23, 4, 1, 0], [24, 3, 2, 1], [26, 2, 1, 0],
           [27, 1, 1, 0], [28, 0, 4, 1]],
  pad: [0, -1, 1, -2, 0, -1, 1, 0] };
// Events in time order: [beat, freq, peak, attack, beats, tail, bell, bed]. Durations follow the tempo.
const SONG = [];
for (const [b, d, n, bed] of LULLABY.melody) SONG.push([b, degFreq(d, -1), 0.057, 0.02, n, 0.6, 1, bed]);
LULLABY.pad.forEach((d, i) => {
  SONG.push([i * 4, degFreq(d, -2), 0.042, 0.6, 4, 0.4, 0, 1]);
  SONG.push([i * 4, degFreq(d + 3, -2), 0.024, 0.8, 4, 0.4, 0, 1]);
});
SONG.sort((a, b) => a[0] - b[0] || b[2] - a[2]);
let music = null, musicBus = null, duck = null, duckUntil = 0, musicVoices = [], reef = null;
function startMusic() {
  if (!ac) return;
  if (!musicBus) { musicBus = ac.createGain(); duck = ac.createGain(); musicBus.connect(duck); duck.connect(master); }
  const now = ac.currentTime;
  musicBus.gain.cancelScheduledValues(now); musicBus.gain.setValueAtTime(0, now);
  musicBus.gain.setTargetAtTime(1, now + 0.5, 1.5);                // gentle fade-in, never a loud start
  music = { t0: now + 0.5, i: 0, loop: 0, spb: LULLABY.day, bed: false }; musicVoices = [];
  startReef();
}
function stopMusic() {
  if (!music) return;
  musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setTargetAtTime(0, ac.currentTime, 0.15);
  music = null;
}
function setTempo(bed) {                                           // re-anchor so the tune keeps its place
  if (!music) return;
  const now = ac.currentTime, spb = bed ? LULLABY.night : LULLABY.day, pos = (now - music.t0) / music.spb;
  music.t0 = now - pos * spb; music.spb = spb; music.bed = bed;
}
function musicVoiceOk(t, len) {                                    // own pool: never takes cue voices
  musicVoices = musicVoices.filter(e => e > t);
  if (musicVoices.length >= LULLABY.voices) return false;
  musicVoices.push(t + len); return true;
}
function musicNote(t, freq, peak, attack, dur, isBell) {
  if (!musicVoiceOk(t, dur)) return;
  const g = ac.createGain(); env(g, t, peak, attack, dur); g.connect(musicBus);
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq; o.connect(g);
  const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;     // soft octave partial
  const g2 = ac.createGain(); o2.connect(g2); g2.connect(g);
  if (isBell) env(g2, t, 0.5, 0.004, Math.min(0.4, dur)); else g2.gain.value = 0.15;      // bell: bright onset; pad: warm
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function musicTick() {                                             // schedule notes 0.4 s ahead
  if (!music) return;
  for (;;) {
    const e = SONG[music.i], t = music.t0 + (music.loop * LULLABY.beats + e[0]) * music.spb;
    if (t > ac.currentTime + 0.4) return;
    if (!music.bed || e[7]) musicNote(t, e[1], e[2] * (music.bed ? 0.75 : 1), e[3], e[4] * music.spb + e[5], e[6] && !music.bed);
    if (++music.i >= SONG.length) { music.i = 0; music.loop++; }
  }
}
function duckMusic(now, len) {                                     // music dips to 0.35 under cues
  if (!duck) return;
  duckUntil = Math.max(duckUntil, now + len);
  duck.gain.cancelScheduledValues(now);
  duck.gain.setTargetAtTime(0.35, now, 0.03); duck.gain.setTargetAtTime(1, duckUntil, 0.3);
}
// Reef wash: seeded noise -> one lowpass -> gain swelled by a slow sine LFO; rides the music bus (fades, ducks).
function startReef() {
  if (reef) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 360; f.Q.value = 0.4;
  reef = ac.createGain(); reef.gain.value = 0.016;
  const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.08;
  const depth = ac.createGain(); depth.gain.value = 0.01;
  lfo.connect(depth); depth.connect(reef.gain);
  s.connect(f); f.connect(reef); reef.connect(musicBus); s.start(); lfo.start();
}

// ---------- particles, rings, decor ----------
let parts = [], rings = [], decor = [];
function emit(x, y, n, o) {
  n = Math.max(1, Math.round(n * (reduced ? 0.5 : 1)));
  for (let i = 0; i < n; i++) {
    if (parts.length >= maxParticles) parts.shift();            // evict oldest, never exceed cap
    const a = frng() * Math.PI * 2, sp = lerp(o.speed[0], o.speed[1], frng()), life = lerp(o.life[0], o.life[1], frng());
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.gravity, life, max: life,
      shape: o.shape, color: o.colors[(frng() * o.colors.length) | 0], size: o.size * lerp(0.7, 1.3, frng()),
      rot: frng() * 6.28, vr: (frng() - 0.5) * 8, add: !!o.additive });
  }
}
const SPARKLE = { speed: [40, 110], life: [0.35, 0.7], gravity: 60, shape: 'star', size: 5, colors: ['#FFEB9C', '#FFFBEF'], additive: true };
const BUBBLES = { speed: [15, 35], life: [1.2, 2.4], gravity: -30, shape: 'ring', size: 3, colors: ['#FFFFFF', '#A9DBFB'] };   // tokens.json "bubbles"
const DROPS = { speed: [30, 70], life: [0.3, 0.55], gravity: 40, shape: 'circle', size: 2.4, colors: ['#FFFFFF', '#D8F1FF'] };
const CRUMBS = { speed: [14, 36], life: [0.5, 0.9], gravity: 25, shape: 'circle', size: 2.2, colors: ['#C98A4B', '#F2C27E'] };
const HEARTS = { speed: [20, 45], life: [0.8, 1.2], gravity: -30, shape: 'heart', size: 5, colors: ['#F06BB8', '#FF9A92'] };
const STARDUST = { speed: [20, 60], life: [0.6, 1.0], gravity: -10, shape: 'star', size: 4, colors: ['#FFE066', '#F1E8FF'], additive: true };
const ring = (x, y, r0, r1, dur, color, w) => rings.push({ x, y, r0, r1, t: 0, dur, color, w });
// Cosmetic decor (frng, outside the simulation): tiny reef bubbles (z = 0) and sleepy Zzz bubbles (z = 1).
function spawnFizz(x, y, z) {
  if (decor.length >= 24) decor.shift();
  const life = z ? 2.6 : 2 + frng();
  decor.push({ x, y, z, vy: z ? 9 : 16 + frng() * 10, ph: frng() * TAU, r: z ? 8.5 : 1.3 + frng() * 1.5, life, max: life });
}

// ---------- entities ----------
// Simulated objects keep x/y (this step) and ox/oy (previous step); drawing interpolates with simA = simAcc / STEP.
// fish: vx/vy px/s; face = +1 right / -1 left; fx = drawn facing (flips through edge-on when turning);
// ang = tilt (local, + = nose down); mode = swim | food | gulp | loop | visit | hello | sleep; tx/ty = steering
// target; food = claimed pellet; q/qv = squash spring; wig/happy/peek/yawn/chomp = reaction timers (s).
let fish = [], pellets = [], bubbles = [], visitor = null, drag = null;
const btns = { shaker: { r: SHAKER }, moon: { r: MOON }, bubb: { r: BUBBTN } };   // q/qv press spring, wig = wiggle left
const chest = { lid: 0, open: 0, q: 0, qv: 0 };                                   // lid 0..1, open = seconds left
const st = { phase: 'START', t: 0, idle: 0, hint: 0, spoken: false, nextWig: 0, bed: false, bedK: 0, meals: 0,
  vNext: 0, vPending: 0, stream: 0, streamT: 0, burp: 6, taps: 0, steps: 0, simAcc: 0, plipT: 0, introT: 0 };
let time = 0, simA = 1;

function makeFish(k) {
  const F = FISH[k], [x, y] = F.home, face = k === 1 ? -1 : 1;
  return { k, x, y, ox: x, oy: y, vx: 0, vy: 0, face, fx: face, ang: 0, oang: 0, mode: 'swim', tx: x, ty: y,
    wait: 0.8 + k * 0.5, food: null, mt: 0, nap: false, asleep: false, up: true, lx: 0, ly: 0,

  ctx.fillStyle = '#FF8A2A'; ctx.beginPath(); ctx.ellipse(1.5, -5, 4, 2.4, 0, 0, TAU);
  ctx.moveTo(-1.5, -5); ctx.lineTo(-5.5, -7.8); ctx.lineTo(-5.5, -2.2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1E8452'; ctx.lineWidth = 1.5; roundRect(-9, -16, 18, 23, 5); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; roundRect(-6.5, -14.5, 2.6, 4.5, 1.3); ctx.fill();
  ctx.fillStyle = '#FFD23F'; roundRect(-10.5, 6, 21, 8, 3); ctx.fill(); ctx.strokeStyle = '#C99A0E'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#C99A0E'; ctx.beginPath(); for (const x of [-5, 0, 5]) { ctx.moveTo(x + 1.3, 10); ctx.arc(x, 10, 1.3, 0, TAU); } ctx.fill();
  ctx.restore();

  buttonTile(btns.moon, 160, 28, false);           // bedtime: a sleepy moon; at night a smiling sun wakes everyone
  ctx.translate(0, Math.sin(time * 1.1) * 1.2 * m);
  if (k < 0.999) {
    ctx.globalAlpha = 1 - k; ctx.save(); ctx.rotate(-0.3);
    ctx.beginPath(); ctx.arc(0, 0, 13, -1.32, 1.32, true); ctx.quadraticCurveTo(-8, 0, 3.2, -12.6); ctx.closePath();
    ctx.fillStyle = '#FFE066'; ctx.fill(); ctx.strokeStyle = '#C99A0E'; ctx.lineWidth = 1.6; ctx.stroke();
    eye(-7.5, -2, 2.6, 1, 0, 0, '#C99A0E');
    ctx.strokeStyle = '#C99A0E'; ctx.lineWidth = 1.3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(-6.5, 3.5, 2.2, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); ctx.lineCap = 'butt';
    ctx.restore();
    ctx.fillStyle = '#C9AEF5'; starPath(10, -9, 3.6, 1.6, -Math.PI / 2); ctx.fill(); starPath(12, 7, 2.6, 1.2, -Math.PI / 2); ctx.fill();
  }
  if (k > 0.001) {
    ctx.globalAlpha = k; ctx.save(); ctx.rotate(time * 0.3 * m);
    ctx.strokeStyle = '#FF8A2A'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8, c = Math.cos(a), s = Math.sin(a); ctx.moveTo(c * 12.5, s * 12.5); ctx.lineTo(c * 16, s * 16); }
    ctx.stroke(); ctx.lineCap = 'butt'; ctx.restore();
    ctx.fillStyle = '#FFD23F'; circle(0, 0, 10); ctx.fill(); ctx.strokeStyle = '#C99A0E'; ctx.lineWidth = 1.6; ctx.stroke();
    eye(-3.6, -1.5, 2.2, 2, 0, 0, '#C99A0E'); eye(3.6, -1.5, 2.2, 2, 0, 0, '#C99A0E');
    ctx.strokeStyle = TOK.ink; ctx.lineWidth = 1.3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 2, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); ctx.lineCap = 'butt';
  }
  ctx.globalAlpha = 1; ctx.restore();

  buttonTile(btns.bubb, 220, 28, false);           // bubble maker: three clear bubbles that bob
  [[-5, 6, 9], [7, -3, 6.5], [-1, -13, 4.5]].forEach(([x, y, r], i) => {
    y += Math.sin(time * 2 + i * 2.1) * 1.2 * m;
    ctx.fillStyle = 'rgba(169,219,251,0.75)'; circle(x, y, r); ctx.fill(); ctx.strokeStyle = '#3F9FDA'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; oval(x - r * 0.35, y - r * 0.4, r * 0.32, r * 0.18, -0.7); ctx.fill();
  });
  ctx.restore();
}

function drawChrome() {
  ctx.fillStyle = TOK.cream; roundRect(6, 6, 44, 44, 14); ctx.fill();               // Home
  ctx.strokeStyle = '#D9C7A3'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = TOK.ink; ctx.beginPath(); ctx.moveTo(28, 15); ctx.lineTo(41, 27); ctx.lineTo(37, 27); ctx.lineTo(37, 39);
  ctx.lineTo(19, 39); ctx.lineTo(19, 27); ctx.lineTo(15, 27); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.45; ctx.fillStyle = TOK.cream; roundRect(270, 6, 44, 44, 14); ctx.fill();   // Mic (disabled)
  ctx.fillStyle = TOK.ink; roundRect(287, 14, 10, 18, 5); ctx.fill();
  ctx.strokeStyle = TOK.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(292, 25, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(292, 34); ctx.lineTo(292, 40); ctx.stroke(); ctx.globalAlpha = 1;
}
function drawStart() {
  ctx.fillStyle = 'rgba(30,34,69,0.35)'; ctx.fillRect(0, 0, W, H);
  const p = 1 + Math.sin(time * 3) * 0.04;
  ctx.save(); ctx.translate(160, 120); ctx.scale(p, p);
  ctx.fillStyle = TOK.cream; ctx.beginPath(); ctx.arc(0, 0, 36, 0, 7); ctx.fill();
  ctx.fillStyle = '#2DB26E'; ctx.beginPath(); ctx.moveTo(-10, -16); ctx.lineTo(18, 0); ctx.lineTo(-10, 16); ctx.closePath(); ctx.fill();
  ctx.restore();
}
let fps = 60, frameMs = 0;
function drawHud() {
  if (!debug) return;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(176, 202, 144, 38);
  ctx.fillStyle = parts.length > TOK.deviceMaxParticles ? '#FF9A92' : '#FFFFFF'; ctx.font = '8px monospace';
  ctx.fillText(`fps ${fps.toFixed(0)} draw ${frameMs.toFixed(1)}ms p ${parts.length}/${maxParticles}`, 180, 212);
  ctx.fillText(`seed ${seed} ${st.phase}${st.bed ? ' BED' : ''} meals ${st.meals} hint ${st.hint} ${reduced ? 'RM' : ''}`, 180, 224);
  ctx.fillText(fish.map(f => FISH[f.k].name[0] + ':' + f.mode).join(' ') + ` s${st.steps}`, 180, 236);
}
// One full frame of the game scene (the golden harness calls this directly).
function drawScene() {
  drawBackdrop();                                  // static reef: the device paints this once and caches it
  drawRays(); drawCaustics(); drawSeaweed(true); drawChest();
  drawNight(0.45);                                 // bedtime: the backdrop dims first (stars above the water)
  drawPellets(); drawShadows();
  for (const f of fish) drawFish(f);
  drawVisitor();                                   // the VISITOR overlay glides in front of the fish (they make room below)
  drawBubbles(); drawSeaweed(false); drawDecor(); drawSurface();
  drawNight(0.18);                                 // ...and a lighter veil over the swimmers
  drawFx(); drawHelperHand(); drawButtons(); drawChrome();
}

// Test hook for tools/quality_bar_golden/sketch_check.mjs (not ported): the logical point a helpful player taps next, or null.
function autoTarget() {
  if (st.phase === 'START') return null;
  if (st.phase === 'INTRO') return { x: 160, y: 140 };
  const kind = ['shaker', 'fish', 'bubbles', 'bubble', 'glass', 'fish', 'bubble', 'shaker', 'bubble', 'glass', 'moon'][st.taps % 11];
  if (kind === 'shaker') return { x: 100, y: 28 };
  if (kind === 'bubbles') return { x: 220, y: 28 };
  if (kind === 'moon') return { x: 160, y: 28 };
  if (kind === 'fish') { const [x, y] = ip(fish[((st.taps / 11) | 0) % 3]); return { x, y }; }
  if (kind === 'bubble') {
    for (const b of bubbles) { const [x, y] = ip(b); if (b.g >= 1 && y > 90) return { x, y }; }
    return { x: 220, y: 28 };
  }
  return { x: 60 + (st.taps * 53) % 200, y: 100 + (st.taps * 37) % 90 };
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); if (ac) musicTick();
  const t0 = performance.now();
  drawScene();
  if (st.phase === 'START') drawStart();
  frameMs = lerp(frameMs, performance.now() - t0, 0.1); fps = lerp(fps, 1 / Math.max(dt, 1e-3), 0.05);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
